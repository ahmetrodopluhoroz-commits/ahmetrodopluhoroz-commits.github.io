<div id="filter-section" style="margin-bottom: 20px; padding: 10px; background: #f4f4f4;">
    <strong>Etikete Göre Filtrele:</strong>
    <select id="tag-filter" onchange="filterTasks()">
        <option value="all">Tüm Tasklar</option>
    </select>
</div>

<div id="add-task-form" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
    <h3>Yeni Task Ekle</h3>
    <input type="text" id="task-title" placeholder="Task Başlığı">
    
    <div style="margin-top: 10px;">
        <input type="text" id="new-tag-input" placeholder="Yeni etiket yaz (Örn: Proje)">
        <button onclick="createTag()">Etiket Oluştur/Ekle</button>
    </div>
    
    <div id="active-tags-container" style="margin-top: 10px;">
        </div>
    
    <button onclick="saveTask()" style="margin-top: 15px; background: green; color: white;">Taskı Kaydet</button>
</div>

<div id="task-list-container">
    <h3>Tasklar</h3>
    <ul id="task-list"></ul>
</div>

<script>
    let allTags = ["PROJE", "TALEP"]; // Başlangıç etiketleri
    let currentTaskTags = []; // O an oluşturulan taska eklenen etiketler
    let tasks = []; // Kaydedilen tüm tasklar

    // Sayfa açıldığında filtreyi doldur
    window.onload = updateFilterDropdown;

    // Yeni etiket oluşturma ve mevcut taska ekleme
    function createTag() {
        let tagInput = document.getElementById('new-tag-input');
        let tagValue = tagInput.value.trim().toUpperCase();

        if (tagValue === "") return;

        // Genel etiket havuzuna ekle (yoksa)
        if (!allTags.includes(tagValue)) {
            allTags.push(tagValue);
            updateFilterDropdown();
        }

        // Mevcut taskın etiketlerine ekle (yoksa)
        if (!currentTaskTags.includes(tagValue)) {
            currentTaskTags.push(tagValue);
            renderActiveTags();
        }
        tagInput.value = "";
    }

    // Taskı kaydetme
    function saveTask() {
        let title = document.getElementById('task-title').value;
        if (!title) return alert("Başlık giriniz!");

        let newTask = {
            id: Date.now(),
            title: title,
            tags: [...currentTaskTags]
        };

        tasks.push(newTask);
        currentTaskTags = []; // Reset
        document.getElementById('task-title').value = "";
        renderActiveTags();
        renderTasks(tasks);
    }

    // Taskları listeleme
    function renderTasks(data) {
        let list = document.getElementById('task-list');
        list.innerHTML = "";
        data.forEach(t => {
            list.innerHTML += `
                <li style="margin-bottom: 10px;">
                    <strong>${t.title}</strong> 
                    ${t.tags.map(tag => `<span style="background:#007bff; color:white; padding:2px 6px; border-radius:4px; font-size:12px; margin-left:5px;">${tag}</span>`).join('')}
                </li>`;
        });
    }

    // Filtreleme fonksiyonu
    function filterTasks() {
        let selectedTag = document.getElementById('tag-filter').value;
        if (selectedTag === "all") {
            renderTasks(tasks);
        } else {
            let filtered = tasks.filter(t => t.tags.includes(selectedTag));
            renderTasks(filtered);
        }
    }

    function updateFilterDropdown() {
        let dropdown = document.getElementById('tag-filter');
        dropdown.innerHTML = '<option value="all">Tüm Tasklar</option>';
        allTags.forEach(tag => {
            dropdown.innerHTML += `<option value="${tag}">${tag}</option>`;
        });
    }

    function renderActiveTags() {
        let container = document.getElementById('active-tags-container');
        container.innerHTML = currentTaskTags.map(tag => `<span style="border:1px solid #007bff; padding:3px; margin-right:5px;">${tag}</span>`).join('');
    }
</script>

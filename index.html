<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG HUB | 2026 Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; background-color: #F4F5F7; color: #172B4D; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .quartz-card { background: white; border: 1px solid #EBECF0; box-shadow: 0 1px 2px rgba(9,30,66,0.1); border-radius: 12px; }
        .quartz-card:hover { box-shadow: 0 4px 8px -2px rgba(9, 30, 66, 0.25); }
        .quartz-input { background: #FAFBFC; border: 2px solid #DFE1E6; border-radius: 8px; padding: 12px; width: 100%; outline: none; transition: all 0.2s; color: #172B4D; }
        .quartz-input:focus { border-color: #0052CC; background: white; }
        .view-active { border-bottom: 3px solid #0052CC; color: #0052CC; font-weight: 800; opacity: 1 !important; }
        .column-width { min-width: 300px; width: 300px; }
        .modal-overlay { background-color: rgba(9, 30, 66, 0.54); backdrop-filter: blur(4px); z-index: 100; }
        .gantt-sidebar { width: 260px; flex-shrink: 0; position: sticky; left: 0; z-index: 60; border-right: 1px solid #DCDFE4; background: #EBECF0; color: #42526E; font-weight: 800; }
        .day-cell { flex-shrink: 0; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); height: 100%; }
        .task-completed { opacity: 0.5; text-decoration: line-through; filter: grayscale(1); }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM_INITIALS = ["AR", "BD", "YE", "RASG"];
        const IMPORTANCE_LEVELS = ["Acil", "Orta önem düzeyi", "Düşük önem düzeyi"];

        function App() {
            const [session, setSession] = useState(null);
            const [profile, setProfile] = useState(null);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [authTab, setAuthTab] = useState('login');

            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [comments, setComments] = useState([]);
            const [teams, setTeams] = useState([]);
            const [allUsers, setAllUsers] = useState([]);

            const [currentView, setCurrentView] = useState('board');
            const [selectedTask, setSelectedTask] = useState(null);
            const [ganttZoom, setGanttZoom] = useState(45);
            const [draggedTaskId, setDraggedTaskId] = useState(null);
            const [activeSprintId, setActiveSprintId] = useState(null);
            const [filters, setFilters] = useState({ assignees: [], tags: [], statuses: [] });

            const ganttScrollRef = useRef(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchProfile(session.user.id);
                });

                const { data: authListener } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchProfile(session.user.id);
                });
                return () => authListener.subscription.unsubscribe();
            }, []);

            const fetchProfile = async (uid) => {
                const { data } = await supabase.from('profiles').select('*, teams(name)').eq('id', uid).single();
                setProfile(data);
                if (data?.team_id) fetchTeamData(data.team_id);
            };

            const fetchTeamData = async (teamId) => {
                const { data: cols } = await supabase.from('columns').select('*').eq('team_id', teamId).order('order_index');
                const { data: tsk } = await supabase.from('tasks').select('*').eq('team_id', teamId).order('created_at', { ascending: false });
                const { data: spr } = await supabase.from('sprints').select('*').eq('team_id', teamId).order('start_date');
                setColumns(cols || []);
                setTasks(tsk || []);
                setSprints(spr || []);
                if (spr?.length > 0) setActiveSprintId(spr[0].id);
            };

            const fetchAdminPortal = async () => {
                const { data: u } = await supabase.from('profiles').select('*, teams(name)');
                const { data: t } = await supabase.from('teams').select('*').order('name');
                setAllUsers(u || []);
                setTeams(t || []);
            };

            const fetchComments = async (tid) => {
                const { data } = await supabase.from('comments').select('*').eq('task_id', tid).order('created_at');
                setComments(data || []);
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                const email = e.target.email.value.trim();
                const password = e.target.password.value;

                if (authTab === 'admin') {
                    if (email === "RASGADMIN" && password === "RASGADMIN") {
                        setIsAdminMode(true);
                        setProfile({ username: 'Yönetici', is_admin: true });
                        fetchAdminPortal();
                    } else alert("Admin erişimi reddedildi!");
                    return;
                }

                if (authTab === 'register') {
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) alert("Hata: " + error.message);
                    else if (data.user) {
                        await supabase.from('profiles').insert([{ id: data.user.id, username: email.split('@')[0] }]);
                        alert("Kayıt başarılı! Lütfen " + email + " adresine gönderilen doğrulama linkine tıklayın.");
                        setAuthTab('login');
                    }
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) alert("Giriş Hatası: " + error.message);
                    else { setSession(data.session); fetchProfile(data.user.id); }
                }
            };

            const logout = async () => {
                await supabase.auth.signOut();
                location.reload();
            };

            const updateTask = async (tid, updates) => {
                await supabase.from('tasks').update(updates).eq('id', tid);
                fetchTeamData(profile.team_id);
                if(selectedTask?.id === tid) setSelectedTask(prev => ({ ...prev, ...updates }));
            };

            const addTask = async (isQ = false, aid = null, cslug = null) => {
                const text = prompt("İş Başlığı:"); if(!text) return;
                await supabase.from('tasks').insert([{ 
                    text, is_quick: isQ, assignee: aid ? [aid] : [], 
                    status: cslug || columns[0]?.slug || 'todo', team_id: profile.team_id,
                    importance: 'Düşük önem düzeyi'
                }]);
                fetchTeamData(profile.team_id);
            };

            const toggleFilter = (type, val) => setFilters(p => ({ ...p, [type]: p[type].includes(val) ? p[type].filter(v => v !== val) : [...p[type], val] }));

            const filteredTasks = useMemo(() => {
                return tasks.filter(t => {
                    if (currentView === 'quick_tasks') return t.is_quick;
                    if (t.is_quick) return false;
                    const matchA = filters.assignees.length === 0 || (t.assignee || []).some(a => filters.assignees.includes(a));
                    const matchS = filters.statuses.length === 0 || filters.statuses.includes(t.status);
                    return matchA && matchS;
                });
            }, [tasks, filters, currentView]);

            const globalTags = useMemo(() => {
                const tags = new Set(); tasks.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
                return Array.from(tags);
            }, [tasks]);

            const ganttStartDate = new Date(2025, 11, 1);
            const ganttEndDate = new Date(2027, 0, 31);
            const ganttDays = useMemo(() => {
                const days = []; let curr = new Date(ganttStartDate);
                while (curr <= ganttEndDate) { days.push(new Date(curr)); curr.setDate(curr.getDate() + 1); }
                return days;
            }, []);

            if (!session && !isAdminMode) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42] p-6">
                        <div className="bg-white p-10 rounded-[40px] w-full max-w-sm shadow-2xl">
                            <h2 className="text-3xl font-black text-[#172B4D] mb-8 italic text-center tracking-tighter uppercase">RASG HUB</h2>
                            <div className="flex bg-[#F4F5F7] p-1 rounded-2xl mb-8 font-black text-[10px]">
                                <button onClick={()=>setAuthTab('login')} className={`flex-1 py-3 rounded-xl transition ${authTab==='login'?'bg-white shadow text-[#0052CC]':'text-slate-400'}`}>GİRİŞ</button>
                                <button onClick={()=>setAuthTab('register')} className={`flex-1 py-3 rounded-xl transition ${authTab==='register'?'bg-white shadow text-[#0052CC]':'text-slate-400'}`}>KAYIT</button>
                                <button onClick={()=>setAuthTab('admin')} className={`flex-1 py-3 rounded-xl transition ${authTab==='admin'?'bg-white shadow text-red-600':'text-slate-400'}`}>ADMIN</button>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input name="email" type={authTab==='admin'?'text':'email'} placeholder={authTab==='admin'?'Admin Kullanıcı':'E-posta Adresiniz'} className="quartz-input" required />
                                <input name="password" type="password" placeholder="Şifre" className="quartz-input" required />
                                <button className={`w-full py-4 rounded-2xl font-black text-white shadow-xl transition uppercase tracking-widest ${authTab==='admin'?'bg-red-600':'bg-[#0052CC]'}`}>
                                    {authTab === 'register' ? 'Hesap Oluştur' : 'Sisteme Bağlan'}
                                </button>
                            </form>
                            <p className="mt-6 text-[10px] text-slate-400 text-center font-bold uppercase opacity-50">Enterprise Project Management</p>
                        </div>
                    </div>
                );
            }

            if (isAdminMode) {
                return (
                    <div className="h-screen flex bg-[#F4F5F7]">
                        <aside className="w-72 bg-white border-r border-[#DFE1E6] p-8 flex flex-col shadow-sm">
                            <h1 className="text-2xl font-black text-red-600 mb-12 italic uppercase">ADMIN PORTAL</h1>
                            <button onClick={async()=>{const n=prompt("Ekip Adı?"); if(n) { await supabase.from('teams').insert([{name:n}]); fetchAdminPortal(); }}} className="w-full bg-[#0052CC] text-white p-4 rounded-2xl font-black text-xs uppercase mb-4 shadow-lg">+ YENİ EKİP EKLE</button>
                            <button onClick={()=>location.reload()} className="mt-auto p-4 bg-slate-100 rounded-2xl font-bold text-xs text-slate-500 hover:text-red-600 transition uppercase">GÜVENLİ ÇIKIŞ</button>
                        </aside>
                        <main className="flex-1 p-12 overflow-y-auto custom-scrollbar">
                            <h2 className="text-3xl font-black mb-10 tracking-tight text-[#172B4D]">Kullanıcı & Ekip Yönetimi</h2>
                            <div className="bg-white rounded-[32px] border overflow-hidden shadow-xl">
                                <table className="w-full text-left font-medium">
                                    <thead className="bg-[#FAFBFC] border-b text-[10px] font-black text-slate-400 uppercase tracking-widest"><tr><th className="p-6">KULLANICI (E-POSTA)</th><th className="p-6">DURUM</th><th className="p-6">YÖNET</th><th className="p-6">SİL</th></tr></thead>
                                    <tbody className="divide-y">
                                        {allUsers.filter(u=>!u.is_admin).map(u => (
                                            <tr key={u.id} className="hover:bg-[#F4F5F7]">
                                                <td className="p-6 font-bold">{u.username}</td>
                                                <td className="p-6"><span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${u.teams?'bg-[#E3FCEF] text-[#006644]':'bg-slate-100 text-slate-400'}`}>{u.teams?.name || 'BOŞTA'}</span></td>
                                                <td className="p-6">
                                                    <select onChange={async(e)=> { await supabase.from('profiles').update({ team_id: e.target.value || null }).eq('id', u.id); fetchAdminPortal(); }} value={u.team_id || ""} className="p-2 border rounded-xl text-[10px] font-bold outline-none">
                                                        <option value="">Ekip Seç...</option>
                                                        {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-6"><button onClick={async()=>{if(confirm("Sil?")){await supabase.from('profiles').delete().eq('id', u.id); fetchAdminPortal();}}} className="text-red-500"><i className="fas fa-trash-alt"></i></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col">
                    <header className="p-4 bg-white border-b border-[#DCDFE4] flex justify-between items-center z-50 shadow-sm">
                        <div className="flex items-center gap-8">
                            <h1 className="font-black italic text-lg text-[#172B4D]">RASG 2026</h1>
                            {profile?.team_id && (
                                <div className="flex gap-5 text-[11px] font-bold uppercase tracking-widest text-[#5E6C84]">
                                    {['board', 'quick_tasks', 'list', 'gantt', 'sprints'].map(v => (
                                        <button key={v} onClick={() => setCurrentView(v)} className={`pb-1 transition-all opacity-60 hover:opacity-100 ${currentView === v ? 'view-active' : ''}`}>{v.replace('_',' ')}</button>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right mr-2">
                                <p className="text-xs font-black text-[#172B4D]">{profile?.username}</p>
                                <p className="text-[9px] font-bold text-[#0052CC] uppercase">{profile?.teams?.name || "EKİPSİZ"}</p>
                            </div>
                            <button onClick={logout} className="ml-2 text-[#DE350B] hover:scale-110 transition-all"><i className="fas fa-power-off text-xl"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative bg-[#F4F5F7]">
                        {!profile?.team_id ? (
                            <div className="h-full flex items-center justify-center p-20 text-center"><div className="bg-white p-12 rounded-[40px] shadow-2xl border max-w-sm"><i className="fas fa-user-shield text-5xl text-blue-600 mb-6 opacity-20"></i><h2 className="text-2xl font-black">Erişim Bekleniyor</h2><p className="text-slate-400 mt-4 font-bold">Lütfen Admin'in sizi bir ekibe atamasını bekleyin.</p></div></div>
                        ) : (
                            <div className="h-full flex flex-col p-8 overflow-hidden">
                                {currentView === 'board' && (
                                    <div className="flex-1 flex gap-6 overflow-x-auto custom-scrollbar">
                                        {columns.map(col => (
                                            <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={async () => { if(draggedTaskId) { await supabase.from('tasks').update({ status: col.slug }).eq('id', draggedTaskId); fetchTeamData(profile.team_id); setDraggedTaskId(null); } }}>
                                                <div className="mb-4 flex justify-between items-center px-1 font-black text-[11px] uppercase text-[#5E6C84] opacity-50"><span>{col.title}</span><span>{filteredTasks.filter(t=>t.status===col.slug).length}</span></div>
                                                <div className="flex-1 space-y-3 overflow-y-auto pr-1 custom-scrollbar">
                                                    {filteredTasks.filter(t=>t.status===col.slug).map(task => (
                                                        <div key={task.id} draggable onDragStart={()=>setDraggedTaskId(task.id)} onClick={()=>{setSelectedTask(task); fetchComments(task.id);}} className="p-5 quartz-card group hover:border-[#0052CC] cursor-pointer"><p className="text-[14px] font-bold text-[#172B4D] leading-relaxed">{task.text}</p></div>
                                                    ))}
                                                    <button onClick={()=>addTask(false,null,col.slug)} className="w-full py-3 border-2 border-dashed border-[#DFE1E6] rounded-xl text-[10px] font-black text-[#8993A4] hover:text-[#0052CC] transition-all uppercase">+ EKLE</button>
                                                </div>
                                            </div>
                                        ))}
                                        <button onClick={async()=>{const t=prompt("Sütun?"); if(t) await supabase.from('columns').insert([{title:t, slug: t.toLowerCase().replace(/ /g,'_'), team_id: profile.team_id, order_index: columns.length+1}]); fetchTeamData(profile.team_id);}} className="column-width border-2 border-dashed border-[#DFE1E6] rounded-[32px] text-[10px] font-black text-slate-300 hover:text-[#0052CC] transition uppercase tracking-widest shadow-inner">+ SÜTUN EKLE</button>
                                    </div>
                                )}
                                {currentView === 'quick_tasks' && (
                                    <div className="flex-1 flex gap-6 overflow-x-auto custom-scrollbar">
                                        {TEAM_INITIALS.map(init => (
                                            <div key={init} className="column-width flex flex-col bg-white/40 rounded-[32px] border border-[#DFE1E6] p-5 shadow-inner">
                                                <div className="flex items-center gap-3 mb-8 px-1"><div className="w-10 h-10 rounded-full bg-[#0052CC] flex items-center justify-center text-[12px] font-black text-white shadow-lg">{init}</div><span className="font-black text-sm text-[#172B4D] uppercase">{init} ALANI</span></div>
                                                <div className="flex-1 space-y-3 overflow-y-auto pr-1 custom-scrollbar">
                                                    {filteredTasks.filter(t => t.is_quick && (t.assignee || []).includes(init)).map(task => (
                                                        <div key={task.id} className={`p-4 rounded-xl bg-white border border-[#DFE1E6] shadow-sm ${task.is_completed ? 'task-completed' : ''}`}>
                                                            <div className="flex items-start gap-3">
                                                                <input type="checkbox" checked={task.is_completed} onChange={e => { supabase.from('tasks').update({is_completed: e.target.checked}).eq('id', task.id).then(()=>fetchTeamData(profile.team_id)) }} className="mt-1 w-4 h-4 rounded-full accent-[#36B37E] cursor-pointer" />
                                                                <div className="flex-1" onClick={()=>{setSelectedTask(task);}}><p className="text-[14px] font-bold text-[#172B4D]">{task.text}</p></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    <button onClick={() => addTask(true, init)} className="w-full py-4 border-2 border-dashed border-[#DFE1E6] rounded-xl text-[10px] font-black text-[#8993A4] hover:text-[#0052CC] transition uppercase">+ EKLE</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {currentView === 'gantt' && (
                                    <div className="gantt-container h-full rounded-[24px] border border-[#DCDFE4] shadow-xl overflow-hidden">
                                        <div className="gantt-main-scroll custom-scrollbar" ref={ganttScrollRef}>
                                            <div className="gantt-timeline-header flex sticky top-0 z-30">
                                                <div className="gantt-sidebar p-4 font-black text-[11px] uppercase border-r border-[#DCDFE4]">GÖREV LİSTESİ</div>
                                                {ganttDays.map((date, i) => (
                                                    <div key={i} className={`day-cell p-2 flex flex-col items-center ${date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : ''}`} style={{ width: ganttZoom, minWidth: ganttZoom }}>
                                                        <span className="text-[8px] font-bold text-[#5E6C84] uppercase">{date.toLocaleDateString('tr-TR', { month: 'short' })}</span>
                                                        <span className={`text-[12px] font-black ${new Date().toDateString() === date.toDateString() ? 'text-[#0052CC]' : ''}`}>{date.getDate()}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            {filteredTasks.map(task => {
                                                const s = task.start_date ? new Date(task.start_date) : null;
                                                const e = task.end_date ? new Date(task.end_date) : null;
                                                let l = 0, w = 0;
                                                if(s && e) {
                                                    l = Math.ceil((s - ganttStartDate) / (1000 * 60 * 60 * 24)) * ganttZoom;
                                                    w = (Math.ceil((e - s) / (1000 * 60 * 60 * 24)) + 1) * ganttZoom;
                                                }
                                                return (
                                                    <div key={task.id} className="gantt-grid-row flex">
                                                        <div className="gantt-sidebar p-3 truncate text-[12px] font-bold text-[#172B4D] border-r border-[#DCDFE4]">{task.text}</div>
                                                        <div className="flex-1 flex relative h-full min-w-max">
                                                            {ganttDays.map((_, i) => <div key={i} className="day-cell h-full border-r border-black/[0.03]" style={{ width: ganttZoom, minWidth: ganttZoom }}></div>)}
                                                            {w > 0 && <div onClick={()=>{setSelectedTask(task); fetchComments(task.id);}} className="absolute top-2.5 h-7 bg-[#0052CC] rounded-md shadow-lg flex items-center px-3 cursor-pointer z-20" style={{ left: l, width: w }}><span className="text-[9px] text-white font-black truncate">{task.text}</span></div>}
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className="bg-white w-full max-w-xl h-full shadow-2xl p-10 flex flex-col overflow-y-auto animate-in slide-in-from-right">
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-[11px] font-black text-[#0052CC] uppercase italic opacity-40 tracking-widest">İŞ AYRINTILARI</span>
                                    <div className="flex gap-4 items-center">
                                        <button onClick={async()=>{if(confirm("Silinsin mi?")){await supabase.from('tasks').delete().eq('id',selectedTask.id); setSelectedTask(null); fetchTeamData(profile.team_id);}}} className="text-[#DE350B] hover:scale-110 transition-all"><i className="fas fa-trash-alt text-xl"></i></button>
                                        <button onClick={()=>setSelectedTask(null)} className="text-[#42526E] hover:text-black text-2xl">✕</button>
                                    </div>
                                </div>
                                <input className="text-3xl font-black bg-transparent border-b-2 border-[#EBECF0] outline-none w-full mb-10 pb-2 text-[#172B4D] focus:border-[#4C9AFF]" defaultValue={selectedTask.text} onBlur={e=>updateTask(selectedTask.id, {text: e.target.value})} />
                                <div className="space-y-10">
                                    <div className="grid grid-cols-2 gap-8">
                                        <div><label className="text-[10px] font-black text-[#5E6C84] uppercase block mb-3 ml-1">BAŞLANGIÇ</label><input type="date" value={selectedTask.start_date || ""} onChange={e=>updateTask(selectedTask.id, {start_date: e.target.value})} className="quartz-input" /></div>
                                        <div><label className="text-[10px] font-black text-[#5E6C84] uppercase block mb-3 ml-1">BİTİŞ</label><input type="date" value={selectedTask.end_date || ""} onChange={e=>updateTask(selectedTask.id, {end_date: e.target.value})} className="quartz-input" /></div>
                                    </div>
                                    <button onClick={()=>setSelectedTask(null)} className="w-full bg-[#0052CC] text-white p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl hover:bg-[#0747A6] transition-all">KAYDET VE KAPAT</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Ultimate Hub (v4.1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: all 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 100; }
        
        /* Tema Stilleri */
        .quartz-body { background-color: #F4F5F7; color: #172B4D; }
        .dark-body { background-color: #0c0c0e; color: #d1d1d1; }
        .quartz-header { bg-white border-b border-[#DCDFE4] text-[#172B4D]; }
        .dark-header { bg-[#1a1a1c] border-b border-zinc-800 text-white; }
        
        /* Gantt Stilleri */
        .gantt-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .gantt-sidebar { width: 260px; flex-shrink: 0; position: sticky; left: 0; z-index: 40; border-right: 1px solid rgba(0,0,0,0.1); }
        .gantt-main-scroll { flex: 1; overflow-x: auto; overflow-y: auto; display: flex; flex-direction: column; }
        .day-cell { min-width: 45px; width: 45px; flex-shrink: 0; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); }
        .weekend { background-color: rgba(0,0,0,0.03); }
        .dark .weekend { background-color: rgba(255,255,255,0.03); }
        
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-orange-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [activeSprintId, setActiveSprintId] = useState(null);
            
            const [currentView, setCurrentView] = useState('board');
            const [theme, setTheme] = useState('dark');
            const [selectedTask, setSelectedTask] = useState(null);
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            const [filterAssignee, setFilterAssignee] = useState('All');
            const ganttScrollRef = useRef(null);

            const fetchData = async () => {
                const { data: tsk } = await supabase.from('tasks').select('*');
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: spr } = await supabase.from('sprints').select('*').order('start_date');
                setTasks(tsk || []);
                setColumns(cols || []);
                setSprints(spr || []);
                if (spr?.length > 0 && !activeSprintId) setActiveSprintId(spr[0].id);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            // GANTT AYARLARI
            const ganttStartDate = new Date(2025, 11, 1);
            const ganttDays = useMemo(() => {
                const days = [];
                for(let i=0; i<180; i++) { 
                    const d = new Date(ganttStartDate);
                    d.setDate(ganttStartDate.getDate() + i);
                    days.push(d);
                }
                return days;
            }, []);

            useEffect(() => {
                if(currentView === 'gantt' && ganttScrollRef.current) {
                    const today = new Date();
                    const diff = Math.floor((today - ganttStartDate) / (1000 * 60 * 60 * 24));
                    if(diff > 0) ganttScrollRef.current.scrollLeft = (diff * 45) - 200;
                }
            }, [currentView]);

            const updateTask = async (taskId, updates) => {
                await supabase.from('tasks').update(updates).eq('id', taskId);
                fetchData();
                if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
            };

            const generateSprints = async () => {
                const start = prompt("Başlangıç Tarihi:", "2026-01-01");
                const end = prompt("Bitiş Tarihi:", "2026-12-31");
                const duration = parseInt(prompt("Süre (Gün):", "14"));
                if (!start || !end || isNaN(duration)) return;

                let currentStart = new Date(start);
                const finalEnd = new Date(end);
                const newSprints = [];
                let count = 1;

                while (currentStart < finalEnd) {
                    let currentEnd = new Date(currentStart);
                    currentEnd.setDate(currentStart.getDate() + duration - 1);
                    newSprints.push({
                        name: `Sprint ${count}`,
                        start_date: currentStart.toISOString().split('T')[0],
                        end_date: currentEnd.toISOString().split('T')[0]
                    });
                    currentStart.setDate(currentStart.getDate() + duration);
                    count++;
                }
                await supabase.from('sprints').insert(newSprints);
                fetchData();
            };

            const filteredTasks = useMemo(() => {
                let filtered = [...tasks];
                if (filterAssignee !== 'All') filtered = filtered.filter(t => (t.assignee || []).includes(filterAssignee));
                return filtered;
            }, [tasks, filterAssignee]);

            const isDark = theme === 'dark';

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42]">
                        <div className="bg-white p-10 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-xl font-bold text-[#172B4D] mb-8 tracking-tighter uppercase italic">RASG 2026 HUB</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hata!"); }} className="space-y-4">
                                <input type="text" placeholder="RASG" onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-[#FAFBFC] border border-[#DFE1E6] rounded text-[#172B4D] outline-none focus:border-blue-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#FAFBFC] border border-[#DFE1E6] rounded text-[#172B4D] outline-none focus:border-blue-500" />
                                <button className="w-full bg-[#0052CC] p-4 rounded-lg font-bold text-white hover:bg-[#0747A6] transition shadow-lg">SİSTEME GİRİŞ YAP</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`h-screen flex flex-col ${isDark ? 'dark-body dark' : 'quartz-body'}`}>
                    {/* HEADER */}
                    <header className={`p-4 border-b flex justify-between items-center z-50 ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-[#DCDFE4]'}`}>
                        <div className="flex items-center gap-8">
                            <h1 className="font-bold italic text-lg tracking-tighter">RASG 2026</h1>
                            <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                                {['board', 'list', 'gantt', 'sprints'].map(view => (
                                    <button key={view} onClick={() => setCurrentView(view)} className={`pb-1 transition-all ${currentView === view ? 'border-b-2 border-blue-500 text-blue-500' : 'opacity-40'}`}>{view}</button>
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-3 items-center">
                            <select onChange={e => setFilterAssignee(e.target.value)} className="bg-transparent border border-zinc-700 text-[10px] p-1.5 rounded uppercase font-bold">
                                <option value="All">Filtre: Herkes</option>
                                {TEAM.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                            <div className={`flex p-1 rounded-md ${isDark ? 'bg-black' : 'bg-[#EBECF0]'}`}>
                                <button onClick={() => setTheme('quartz')} className={`px-2 py-1 rounded text-[9px] font-bold ${!isDark ? 'bg-white shadow text-[#0052CC]' : 'text-zinc-500'}`}>QUARTZ</button>
                                <button onClick={() => setTheme('dark')} className={`px-2 py-1 rounded text-[9px] font-bold ${isDark ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}>DARK</button>
                            </div>
                            <button onClick={async () => { const t = prompt("Görev?"); if(t) await supabase.from('tasks').insert([{text:t, status: columns[0].slug}]); fetchData(); }} className="bg-[#0052CC] text-white px-4 py-1.5 rounded text-[10px] font-bold shadow-md">+ TASK</button>
                            <button onClick={() => setIsLoggedIn(false)} className="text-zinc-500 hover:text-red-500 ml-2"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {currentView === 'gantt' ? (
                            <div className="gantt-container">
                                <div className="gantt-main-scroll custom-scrollbar" ref={ganttScrollRef}>
                                    <div className="gantt-timeline-header flex sticky top-0 z-30">
                                        <div className={`gantt-sidebar p-4 font-black text-[10px] uppercase border-r ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-[#EBECF0] border-[#DCDFE4] text-[#172B4D]'}`}>GÖREV LİSTESİ</div>
                                        {ganttDays.map((date, i) => (
                                            <div key={i} className={`day-cell p-2 flex flex-col items-center ${date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : ''}`}>
                                                <span className="text-[8px] uppercase opacity-40">{date.toLocaleDateString('tr-TR', { month: 'short' })}</span>
                                                <span className="text-[11px] font-bold">{date.getDate()}</span>
                                            </div>
                                        ))}
                                    </div>
                                    {filteredTasks.map(task => {
                                        const start = task.start_date ? new Date(task.start_date) : null;
                                        const end = task.end_date ? new Date(task.end_date) : null;
                                        let left = 0, width = 0;
                                        if(start && end) {
                                            left = Math.ceil((start - ganttStartDate) / (1000 * 60 * 60 * 24)) * 45;
                                            width = (Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1) * 45;
                                        }
                                        return (
                                            <div key={task.id} className={`gantt-grid-row flex items-center group hover:bg-blue-500/5 ${isDark ? 'border-zinc-800' : 'border-zinc-200'}`}>
                                                <div className={`gantt-sidebar p-3 truncate text-[11px] font-medium border-r ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-[#EBECF0] border-[#DCDFE4] text-[#172B4D]'}`}>{task.text}</div>
                                                <div className="flex-1 flex relative h-full min-w-max">
                                                    {ganttDays.map((_, i) => <div key={i} className="day-cell h-full border-r border-black/5"></div>)}
                                                    {width > 0 && (
                                                        <div onClick={() => setSelectedTask(task)} className={`absolute top-2.5 h-7 rounded-md cursor-pointer shadow-md flex items-center px-3 z-20 ${TEAM.find(m => (task.assignee || []).includes(m.id))?.color || 'bg-zinc-500'}`} style={{ left: `${left}px`, width: `${width}px` }}>
                                                            <span className="text-[9px] text-white font-black truncate">{task.text}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ) : currentView === 'sprints' ? (
                            <div className="h-full flex flex-col p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <select className="bg-zinc-800 border-zinc-700 p-2 rounded text-xs text-white" value={activeSprintId || ""} onChange={e => setActiveSprintId(e.target.value)}>
                                        {sprints.map(s => <option key={s.id} value={s.id}>{s.name} ({s.start_date} / {s.end_date})</option>)}
                                    </select>
                                    <button onClick={generateSprints} className="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded text-[10px] font-black uppercase tracking-widest">+ OLUŞTUR</button>
                                </div>
                                <div className="flex-1 flex gap-6 overflow-hidden">
                                    <div className={`flex-1 flex flex-col rounded-2xl p-5 ${isDark ? 'bg-[#121214]' : 'bg-zinc-200'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 opacity-50 italic">Backlog (Havuz)</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => !t.sprint_id).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center ${isDark ? 'bg-[#1c1c1e]' : 'bg-white shadow-sm'}`}>
                                                    <span className="text-sm font-medium">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: activeSprintId })} className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px] font-black tracking-tighter uppercase">Sprint'e Ekle <i className="fas fa-arrow-right ml-1"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className={`flex-1 flex flex-col rounded-2xl p-5 border-2 ${isDark ? 'bg-[#1a1a1c] border-blue-900/30' : 'bg-blue-50 border-blue-200'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 text-blue-500 italic">Aktif Sprint</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => t.sprint_id == activeSprintId).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center border border-blue-500/20 ${isDark ? 'bg-[#242427]' : 'bg-white shadow-md'}`}>
                                                    <span className="text-sm font-medium text-blue-400">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: null })} className="text-zinc-500 hover:text-red-500 text-[10px] font-bold uppercase"><i className="fas fa-undo mr-1"></i> Havuza Çek</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="h-full p-6 flex gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { status: col.slug })}>
                                        <div className="mb-4 text-[11px] font-black uppercase opacity-40 flex justify-between">
                                            <span>{col.title}</span>
                                            <i className="fas fa-plus cursor-pointer" onClick={() => addTask(col.slug)}></i>
                                        </div>
                                        <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-1">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} onClick={() => setSelectedTask(task)} className={`p-4 rounded-xl cursor-pointer hover:border-blue-500 transition-all border ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-zinc-200 shadow-sm'}`}>
                                                    <p className="text-[13px] mb-4 font-medium leading-relaxed">{task.text}</p>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex -space-x-1.5">
                                                            {(task.assignee || []).map(id => <div key={id} className={`w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-bold border ${isDark ? 'border-zinc-900' : 'border-white'} ${TEAM.find(x => x.id === id)?.color}`}>{id}</div>)}
                                                        </div>
                                                        {task.sprint_id && <span className="text-[8px] bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded-full font-bold uppercase">Sprint</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                                <button onClick={async () => { const t = prompt("Sütun?"); if(t) await supabase.from('columns').insert([{title:t, slug: t.toLowerCase().replace(/ /g,'_'), order_index: columns.length+1}]); fetchData(); }} className="column-width border-2 border-dashed border-zinc-800 rounded-2xl text-[10px] font-black uppercase opacity-30 hover:opacity-100 transition">SÜTUN EKLE</button>
                            </div>
                        )}
                    </main>

                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className={`${isDark ? 'bg-[#1c1c1e]' : 'bg-white'} w-full max-w-xl p-10 shadow-2xl animate-in slide-in-from-right`}>
                                <div className="flex justify-between items-center mb-10">
                                    <span className="text-[10px] font-black opacity-40 uppercase tracking-widest italic">Detay Paneli</span>
                                    <div className="flex gap-4">
                                        <button onClick={async () => { if(confirm("Silinsin mi?")) { await supabase.from('tasks').delete().eq('id', selectedTask.id); setSelectedTask(null); fetchData(); } }} className="text-zinc-600 hover:text-red-500"><i className="fas fa-trash"></i></button>
                                        <button onClick={() => setSelectedTask(null)} className="text-2xl hover:text-red-500">✕</button>
                                    </div>
                                </div>
                                <textarea className="text-2xl font-bold bg-transparent outline-none mb-10 w-full" defaultValue={selectedTask.text} onBlur={e => updateTask(selectedTask.id, { text: e.target.value })} />
                                <div className="space-y-8">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black opacity-30 uppercase block">Başlangıç</label>
                                            <input type="date" value={selectedTask.start_date || ""} onChange={e => updateTask(selectedTask.id, { start_date: e.target.value })} className="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black opacity-30 uppercase block">Bitiş</label>
                                            <input type="date" value={selectedTask.end_date || ""} onChange={e => updateTask(selectedTask.id, { end_date: e.target.value })} className="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs" />
                                        </div>
                                    </div>
                                    <div className="pt-10 border-t border-zinc-800 flex flex-col gap-4">
                                        <button onClick={() => setSelectedTask(null)} className="w-full bg-blue-600 p-4 rounded-xl font-bold text-white shadow-xl hover:bg-blue-700 uppercase tracking-widest text-xs">Kaydet ve Kapat</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.10.1/core.js"></script>
    <title>PyScript Hızlı Test</title>
</head>
<body style="background-color: #1a202c; color: white; padding: 20px;">

    <h2>PyScript Durumu:</h2>
    <div id="output" style="border: 1px solid #4a5568; padding: 10px; font-family: monospace;">
        Python yükleniyor, lütfen bekleyin...
    </div>

    <script type="py">
        from pyscript import display
        import sys

        display("✅ Python Başarıyla Başlatıldı!", target="output", append=False)
        display(f"Sürüm: {sys.version}", target="output", append=True)
    </script>

</body>
</html>

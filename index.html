<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Veri İşlem Paneli</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.10.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 text-emerald-400">Python Hesaplayıcı</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">Bir sayı giriniz:</label>
                <input type="number" id="user_input" placeholder="Örn: 100" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-emerald-500 focus:outline-none focus:border-emerald-500">
            </div>
            
            <button py-click="hesapla" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition-all">
                Python ile Hesapla
            </button>

            <div id="sonuc_alani" class="mt-6 p-4 bg-black rounded-xl border border-slate-700 min-h-[50px] flex items-center justify-center text-xl font-mono text-emerald-400">
                Sonuç burada görünecek...
            </div>
        </div>
    </div>

    <script type="py">
        from pyscript import display, document

        def hesapla(event):
            # Input alanındaki veriyi çek
            input_text = document.querySelector("#user_input").value
            
            if input_text:
                sayi = float(input_text)
                # Örnek bir işlem: Sayının karesini alalım
                sonuc = sayi * sayi
                
                # Sonucu ekrana yazdır
                display(f"Sonuç: {sonuc}", target="sonuc_alani", append=False)
            else:
                display("Lütfen bir sayı girin!", target="sonuc_alani", append=False)
    </script>

</body>
</html>

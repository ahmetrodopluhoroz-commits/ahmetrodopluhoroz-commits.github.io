<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG Sprint Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");

            // Sprint Board State
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem("rasg_tasks");
                return saved ? JSON.parse(saved) : [];
            });
            const [newTask, setNewTask] = useState("");

            useEffect(() => {
                localStorage.setItem("rasg_tasks", JSON.stringify(tasks));
            }, [tasks]);

            // Giriş Fonksiyonu
            const handleLogin = (e) => {
                e.preventDefault();
                if (username === "RASG" && password === "RASG2026") {
                    setIsLoggedIn(true);
                    setError("");
                } else {
                    setError("Hatalı kullanıcı adı veya şifre!");
                }
            };

            // Sprint Board Fonksiyonları
            const addTask = (e) => {
                e.preventDefault();
                if (!newTask.trim()) return;
                const task = { id: Date.now(), text: newTask, status: 'todo' };
                setTasks([...tasks, task]);
                setNewTask("");
            };

            const moveTask = (id, newStatus) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, status: newStatus } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            // Giriş Ekranı Tasarımı
            if (!isLoggedIn) {
                return (
                    <div class="min-h-screen flex items-center justify-center bg-slate-900">
                        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
                            <div class="text-center mb-8">
                                <h1 class="text-3xl font-bold text-purple-600">RASG Giriş</h1>
                                <p class="text-gray-500 mt-2">Devam etmek için giriş yapın</p>
                            </div>
                            <form onSubmit={handleLogin} class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Kullanıcı Adı</label>
                                    <input 
                                        type="text" 
                                        onChange={(e) => setUsername(e.target.value)}
                                        class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500 outline-none"
                                        placeholder="Kullanıcı adını yazın"
                                    />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Şifre</label>
                                    <input 
                                        type="password" 
                                        onChange={(e) => setPassword(e.target.value)}
                                        class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500 outline-none"
                                        placeholder="••••••••"
                                    />
                                </div>
                                {error && <p class="text-red-500 text-sm">{error}</p>}
                                <button class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold hover:bg-purple-700 transition">
                                    Giriş Yap
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // Sprint Board Tasarımı
            const Column = ({ title, status, color }) => (
                <div class="flex-1 min-w-[300px] bg-slate-200/50 p-4 rounded-xl m-2 border border-slate-300">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-700">{title}</h3>
                        <span class="bg-slate-300 px-2 py-1 rounded text-xs text-slate-600">
                            {tasks.filter(t => t.status === status).length}
                        </span>
                    </div>
                    {tasks.filter(t => t.status === status).map(task => (
                        <div key={task.id} class="bg-white p-4 mb-3 rounded-lg shadow-sm border-l-4 border-purple-500 flex justify-between items-center group animate-in slide-in-from-top-2 duration-300">
                            <span class="text-slate-700">{task.text}</span>
                            <div class="flex gap-2">
                                {status !== 'done' && (
                                    <button onClick={() => moveTask(task.id, status === 'todo' ? 'progress' : 'done')} class="text-blue-500 hover:scale-125 transition">
                                        <i class="fas fa-arrow-right"></i>
                                    </button>
                                )}
                                <button onClick={() => deleteTask(task.id)} class="text-red-300 hover:text-red-600 transition">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );

            return (
                <div class="min-h-screen bg-slate-100 p-8">
                    <header class="mb-10 flex flex-wrap justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800">🚀 Aktif Sprint: RASG Ekibi</h1>
                            <p class="text-slate-500 text-sm">Görevlerinizi buradan yönetin</p>
                        </div>
                        <div class="flex gap-4 items-center mt-4 sm:mt-0">
                            <form onSubmit={addTask} class="flex gap-2">
                                <input 
                                    type="text" 
                                    value={newTask} 
                                    onChange={(e) => setNewTask(e.target.value)}
                                    placeholder="Yapılacak işi yazın..." 
                                    class="p-2 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none w-64"
                                />
                                <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700 shadow-lg shadow-purple-200 transition">Ekle</button>
                            </form>
                            <button onClick={() => setIsLoggedIn(false)} class="text-slate-400 hover:text-red-500 transition">
                                <i class="fas fa-sign-out-alt text-xl"></i>
                            </button>
                        </div>
                    </header>

                    <div class="flex flex-nowrap overflow-x-auto pb-4 custom-scrollbar">
                        <Column title="YAPILACAKLAR" status="todo" />
                        <Column title="DEVAM EDİYOR" status="progress" />
                        <Column title="BİTTİ" status="done" />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</body>
</html>

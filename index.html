<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Veri & Dosya Paneli</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.10.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <py-config>
        packages = ["pandas", "openpyxl", "lxml", "beautifulsoup4", "pypdf"]
    </py-config>

    <style>
        .tool-card { display: none; }
        .tool-card.active { display: block; }
        .nav-btn.active { border-bottom: 3px solid #10b981; color: #10b981; font-weight: bold; }
        /* Pandas ve sistem uyarılarını (terminal) tamamen gizler */
        py-terminal { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <nav class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xl font-bold text-emerald-400">Dosya<span class="text-white font-light">Asistanı</span></span>
            </div>
            <div class="flex gap-4 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('merger')" id="btn-merger" class="nav-btn active px-3 py-2 text-sm transition-all">Excel Birleştir</button>
                <button onclick="switchTab('converter')" id="btn-converter" class="nav-btn px-3 py-2 text-sm text-slate-400 transition-all">CSV Yap</button>
                <button onclick="switchTab('pdf')" id="btn-pdf" class="nav-btn px-3 py-2 text-sm text-slate-400 transition-all text-red-400">PDF Birleştir</button>
                <button onclick="switchTab('cleaner')" id="btn-cleaner" class="nav-btn px-3 py-2 text-sm text-slate-400 transition-all">Temizle</button>
                <button onclick="switchTab('sqlgen')" id="btn-sqlgen" class="nav-btn px-3 py-2 text-sm text-slate-400 transition-all">SQL Üret</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto py-10 px-6">
        
        <div id="pdf-tool" class="tool-card">
            <div class="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-xl">
                <div class="flex items-center gap-4 mb-4">
                    <div class="bg-red-500/20 p-3 rounded-2xl text-red-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-red-400">PDF Birleştirici</h2>
                        <p class="text-slate-400 text-sm">Birden fazla PDF dosyasını seçin, tek bir dosya haline getirelim.</p>
                    </div>
                </div>
                <input type="file" id="f_pdf" multiple accept=".pdf" class="mb-6 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500 cursor-pointer">
                <button py-click="pdf_birlestir" class="w-full bg-red-600 hover:bg-red-500 py-4 rounded-xl font-bold text-lg shadow-lg transition-all active:scale-95">PDF'leri Birleştir ve İndir</button>
            </div>
        </div>

        <div id="merger-tool" class="tool-card active">
             <div class="bg-slate-800 rounded-3xl p-8 border border-slate-700">
                <h2 class="text-2xl font-bold mb-2 text-emerald-400">Excel Birleştirici</h2>
                <input type="file" id="f_merger" multiple accept=".xlsx, .xls" class="mb-6 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-emerald-600 file:text-white">
                <button py-click="excel_birlestir" class="w-full bg-emerald-600 py-4 rounded-xl font-bold text-lg">Excel Birleştir</button>
            </div>
        </div>

        <div id="converter-tool" class="tool-card">
            <div class="bg-slate-800 rounded-3xl p-8 border border-slate-700">
                <h2 class="text-2xl font-bold mb-2 text-blue-400">CSV Dönüştürücü</h2>
                <input type="file" id="f_converter" multiple accept=".xlsx, .xls, .html" class="mb-6 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white">
                <button py-click="csv_donustur" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg">CSV Olarak İndir</button>
            </div>
        </div>

        <div id="cleaner-tool" class="tool-card">
            <div class="bg-slate-800 rounded-3xl p-8 border border-slate-700">
                <h2 class="text-2xl font-bold mb-2 text-amber-400">Veri Temizleyici</h2>
                <input type="file" id="f_cleaner" accept=".xlsx" class="mb-6 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-amber-600 file:text-white">
                <button py-click="veri_temizle" class="w-full bg-amber-600 py-4 rounded-xl font-bold text-lg">Temizle ve İndir</button>
            </div>
        </div>

        <div id="sqlgen-tool" class="tool-card">
            <div class="bg-slate-800 rounded-3xl p-8 border border-slate-700">
                <h2 class="text-2xl font-bold mb-2 text-purple-400">SQL Üretici</h2>
                <input type="text" id="sql_table" placeholder="Tablo Adı..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 mb-4 outline-none">
                <input type="file" id="f_sql" accept=".xlsx" class="mb-6 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-purple-600 file:text-white">
                <button py-click="sql_uret" class="w-full bg-purple-600 py-4 rounded-xl font-bold text-lg">SQL Script İndir</button>
            </div>
        </div>

        <div id="status_msg" class="mt-8 text-center font-mono text-sm text-slate-500"># Hazır</div>
    </main>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tool-card').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active', 'text-white'));
            document.getElementById(tab + '-tool').classList.add('active');
            document.getElementById('btn-' + tab).classList.add('active', 'text-white');
        }
    </script>

    <script type="py">
        import pandas as pd
        import io
        import warnings
        from pypdf import PdfWriter
        from pyscript import display, document
        from js import Uint8Array, File, URL, document as js_document

        # Uyarıları kapat
        warnings.filterwarnings("ignore")

        # --- YARDIMCI FONKSİYON: İNDİRME ---
        def download_file(content, filename, m_type):
            js_array = Uint8Array.new(len(content))
            js_array.assign(content)
            blob = js_document.defaultView.Blob.new([js_array], { "type": m_type })
            url = URL.createObjectURL(blob)
            link = js_document.createElement("a")
            link.href = url
            link.download = filename
            link.click()

        # --- PDF BİRLEŞTİRİCİ ---
        async def pdf_birlestir(e):
            st = document.querySelector("#status_msg")
            files = document.querySelector("#f_pdf").files
            if not files:
                st.innerText = "⚠️ Lütfen PDF dosyalarını seçin!"
                return
            
            st.innerText = "⏳ PDF'ler birleştiriliyor..."
            try:
                merger = PdfWriter()
                for f in files:
                    buf = await f.arrayBuffer()
                    stream = io.BytesIO(Uint8Array.new(buf).to_py())
                    merger.append(stream)
                
                output = io.BytesIO()
                merger.write(output)
                download_file(output.getvalue(), "birlesmis_dosya.pdf", "application/pdf")
                st.innerText = f"✅ {len(files)} adet PDF birleştirildi!"
            except Exception as ex:
                st.innerText = f"❌ Hata: {ex}"

        # --- EXCEL BİRLEŞTİRİCİ ---
        async def excel_birlestir(e):
            st = document.querySelector("#status_msg")
            files = document.querySelector("#f_merger").files
            if not files: return
            st.innerText = "⏳ Excel işleniyor..."
            try:
                dfs = [pd.read_excel(io.BytesIO(Uint8Array.new(await f.arrayBuffer()).to_py())) for f in files]
                out = io.BytesIO()
                pd.concat(dfs, ignore_index=True).to_excel(out, index=False)
                download_file(out.getvalue(), "excel_birlesik.xlsx", "application/vnd.ms-excel")
                st.innerText = "✅ Excel hazır!"
            except Exception as ex: st.innerText = f"❌ Hata: {ex}"

        # --- CSV DÖNÜŞTÜRÜCÜ ---
        async def csv_donustur(e):
            st = document.querySelector("#status_msg")
            files = document.querySelector("#f_converter").files
            if not files: return
            st.innerText = "⏳ CSV'ye dönüştürülüyor..."
            all_dfs = []
            for f in files:
                b = Uint8Array.new(await f.arrayBuffer()).to_py()
                try: df = pd.read_excel(io.BytesIO(b))
                except: 
                    try: df = pd.read_html(io.StringIO(b.decode('utf-8', errors='ignore')))[0]
                    except: continue
                all_dfs.append(df)
            if all_dfs:
                csv = pd.concat(all_dfs, ignore_index=True).to_csv(index=False, encoding='utf-8-sig').encode('utf-8-sig')
                download_file(csv, "veriler.csv", "text/csv")
                st.innerText = "✅ CSV hazır!"

        # --- VERİ TEMİZLEYİCİ ---
        async def veri_temizle(e):
            st = document.querySelector("#status_msg")
            file = document.querySelector("#f_cleaner").files
            if not file: return
            st.innerText = "⏳ Temizleniyor..."
            try:
                df = pd.read_excel(io.BytesIO(Uint8Array.new(await file[0].arrayBuffer()).to_py()))
                df = df.dropna(how='all').dropna(axis=1, how='all') # Boşları at
                df = df.apply(lambda x: x.str.strip() if x.dtype == "object" else x) # Boşlukları kırp
                out = io.BytesIO()
                df.to_excel(out, index=False)
                download_file(out.getvalue(), "temiz_veri.xlsx", "application/vnd.ms-excel")
                st.innerText = "✅ Temizlendi!"
            except Exception as ex: st.innerText = f"❌ Hata: {ex}"

        # --- SQL ÜRETİCİ ---
        async def sql_uret(e):
            st = document.querySelector("#status_msg")
            t_name = document.querySelector("#sql_table").value or "Tablo1"
            file = document.querySelector("#f_sql").files
            if not file: return
            st.innerText = "⏳ SQL üretiliyor..."
            try:
                df = pd.read_excel(io.BytesIO(Uint8Array.new(await file[0].arrayBuffer()).to_py()))
                sql_scripts = []
                for _, row in df.iterrows():
                    cols = ", ".join(df.columns)
                    vals = ", ".join([f"'{str(v)}'" for v in row.values])
                    sql_scripts.append(f"INSERT INTO {t_name} ({cols}) VALUES ({vals});")
                
                sql_content = "\n".join(sql_scripts).encode('utf-8')
                download_file(sql_content, f"{t_name}.sql", "text/plain")
                st.innerText = "✅ SQL dosyası indirildi!"
            except Exception as ex: st.innerText = f"❌ Hata: {ex}"
    </script>

</body>
</html>

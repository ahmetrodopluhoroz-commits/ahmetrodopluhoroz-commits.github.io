<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Sprint & Project Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0c0e; color: #d1d1d1; font-family: 'Inter', sans-serif; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 50; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SUPABASE BAĞLANTISI ---
        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM_MAP = { "Ahmet Rodoplu": "AR", "Berkan Dervişoğlu": "BD", "Yiğit Erol": "YE" };
        const STATUS_MAP = { 
            "tamamlandı": "tamamlandi", 
            "güncelleme gerekli": "guncelleme", 
            "beklemede": "beklemede", 
            "çalışılıyor": "calisiliyor", 
            "başlanacak": "yapilacak", 
            "to do": "todo" 
        };

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [selectedTask, setSelectedTask] = useState(null);
            const [subtasks, setSubtasks] = useState([]);
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            const fetchData = async () => {
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: tsk } = await supabase.from('tasks').select('*').order('created_at');
                if (cols) setColumns(cols);
                if (tsk) setTasks(tsk || []);
            };

            const fetchSubtasks = async (taskId) => {
                const { data } = await supabase.from('subtasks').select('*').eq('parent_id', taskId).order('created_at');
                setSubtasks(data || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            const addTask = async (statusSlug) => {
                const text = prompt("Yeni Görev Başlığı:");
                if (!text) return;
                const { error } = await supabase.from('tasks').insert([{ text, status: statusSlug || 'todo', assignee: [], priority: 'Normal' }]);
                if (!error) fetchData();
            };

            const updateTask = async (taskId, updates) => {
                const { error } = await supabase.from('tasks').update(updates).eq('id', taskId);
                if (!error) {
                    fetchData();
                    if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
                }
            };

            const deleteTask = async (taskId) => {
                if (confirm("Bu görevi silmek istediğinize emin misiniz? Bu işlem geri alınamaz.")) {
                    const { error } = await supabase.from('tasks').delete().eq('id', taskId);
                    if (!error) {
                        setSelectedTask(null);
                        fetchData();
                    }
                }
            };

            const addStatus = async () => {
                const title = prompt("Yeni Sütun (Status) Adı:");
                if (!title) return;
                const slug = title.toLowerCase().trim().replace(/ /g, '_');
                const { error } = await supabase.from('columns').insert([{ 
                    title, slug, dot_color: '#7c3aed', order_index: columns.length + 1 
                }]);
                if (error) alert("Hata: " + error.message);
                else fetchData();
            };

            const handleCSVUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: async (results) => {
                        const importedTasks = results.data.map(row => {
                            const rawAssignees = row.Assignee ? row.Assignee.replace(/[\[\]]/g, '').split(', ') : [];
                            const mappedAssignees = rawAssignees.map(name => TEAM_MAP[name.trim()]).filter(Boolean);
                            const mappedStatus = STATUS_MAP[(row.Status || '').toLowerCase().trim()] || 'todo';
                            return {
                                text: row['Task Name'] || "İsimsiz Görev",
                                status: mappedStatus,
                                description: row['Task Content'] || "",
                                start_date: row['Start Date'] && row['Start Date'] !== 'NaN' ? new Date(row['Start Date']).toISOString().split('T')[0] : null,
                                end_date: row['Due Date'] && row['Due Date'] !== 'NaN' ? new Date(row['Due Date']).toISOString().split('T')[0] : null,
                                assignee: mappedAssignees
                            };
                        });
                        const { error } = await supabase.from('tasks').insert(importedTasks);
                        if (!error) fetchData();
                    }
                });
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <div className="bg-[#1a1a1c] p-10 rounded-3xl border border-zinc-800 w-full max-w-sm shadow-2xl">
                            <h2 className="text-2xl font-black text-white mb-8 text-center uppercase tracking-tighter italic">RASG LOGIN</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hatalı!"); }} className="space-y-4">
                                <input type="text" placeholder="Kullanıcı Adı" onChange={e => setUsername(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <button className="w-full bg-purple-600 p-4 rounded-2xl font-bold text-white hover:bg-purple-700 transition">Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col">
                    <header className="bg-[#1a1a1c] border-b border-zinc-800 p-4 flex justify-between items-center z-10 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="bg-purple-600 w-8 h-8 rounded-lg flex items-center justify-center"><i className="fas fa-rocket text-white"></i></div>
                            <h1 className="font-bold text-zinc-100 tracking-tight">RASG 2026 <span className="text-zinc-500 font-normal ml-2">| Project Management</span></h1>
                        </div>
                        <div className="flex gap-3 items-center">
                            <button onClick={addStatus} className="text-zinc-500 hover:text-white text-[10px] font-black uppercase tracking-widest mr-2">+ ADD STATUS</button>
                            <label className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl text-[10px] font-black cursor-pointer transition uppercase tracking-widest border border-zinc-700">
                                <i className="fas fa-file-csv mr-2"></i> ClickUp Import
                                <input type="file" accept=".csv" className="hidden" onChange={handleCSVUpload} />
                            </label>
                            <button onClick={() => addTask(columns[0]?.slug)} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-900/40">
                                <i className="fas fa-plus mr-2"></i> YENİ TASK
                            </button>
                            <button onClick={() => setIsLoggedIn(false)} className="text-zinc-600 hover:text-red-500 ml-4"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-x-auto p-6 gap-6 bg-[#0c0c0e] custom-scrollbar">
                        {columns.map(col => (
                            <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { status: col.slug })}>
                                <div className="flex items-center justify-between mb-5 px-1">
                                    <div className="flex items-center gap-2">
                                        <div style={{backgroundColor: col.dot_color}} className="w-2.5 h-2.5 rounded-full"></div>
                                        <span className="text-[11px] font-black text-zinc-500 uppercase tracking-widest">{col.title}</span>
                                        <span className="text-zinc-400 text-[10px] font-bold bg-[#1a1a1c] px-2 py-0.5 rounded-md border border-zinc-800">{tasks.filter(t => t.status === col.slug).length}</span>
                                    </div>
                                    <i onClick={() => addTask(col.slug)} className="fas fa-plus-circle text-zinc-800 hover:text-zinc-400 cursor-pointer text-sm transition-colors"></i>
                                </div>

                                <div className="flex-1 space-y-3">
                                    {tasks.filter(t => t.status === col.slug).map(task => (
                                        <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} onClick={() => { setSelectedTask(task); fetchSubtasks(task.id); }} className="bg-[#1a1a1c] border border-zinc-800 p-5 rounded-2xl hover:border-zinc-500 transition-all cursor-pointer group shadow-sm hover:bg-[#1e1e21]">
                                            <p className="text-[13px] text-zinc-200 font-semibold mb-5 leading-relaxed line-clamp-2">{task.text}</p>
                                            <div className="flex justify-between items-center border-t border-zinc-800/50 pt-4">
                                                <div className="flex -space-x-2 overflow-hidden">
                                                    {(task.assignee || []).map(id => (
                                                        <div key={id} className="h-6 w-6 rounded-full border-2 border-[#1a1a1c] bg-zinc-700 flex items-center justify-center text-[8px] font-black text-white uppercase">{id}</div>
                                                    ))}
                                                </div>
                                                <div className="text-[9px] text-zinc-600 font-bold bg-zinc-900/50 px-2 py-1 rounded-md">
                                                    {task.end_date ? <span><i className="far fa-calendar-alt mr-1"></i>{new Date(task.end_date).toLocaleDateString('tr-TR', {day:'numeric', month:'short'})}</span> : 'Süresiz'}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => addTask(col.slug)} className="w-full py-3 text-zinc-800 hover:text-zinc-500 text-[10px] font-black border-2 border-dashed border-zinc-900 rounded-2xl transition-all uppercase tracking-widest">+ GÖREV EKLE</button>
                                </div>
                            </div>
                        ))}
                    </main>

                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-50">
                            <div className="w-full max-w-2xl bg-[#141416] h-full shadow-2xl border-l border-zinc-800 p-10 flex flex-col overflow-y-auto custom-scrollbar animate-slide-in">
                                <div className="flex justify-between items-center mb-10">
                                    <span className="bg-purple-900/20 text-purple-400 px-4 py-2 rounded-xl border border-purple-800/30 text-[10px] font-black uppercase tracking-widest">GÖREV AYRINTILARI</span>
                                    <div className="flex gap-4">
                                        <button onClick={() => deleteTask(selectedTask.id)} className="w-10 h-10 flex items-center justify-center bg-red-900/20 text-red-500 rounded-full hover:bg-red-900/40 transition-all" title="Görevi Sil"><i className="fas fa-trash-alt"></i></button>
                                        <button onClick={() => setSelectedTask(null)} className="w-10 h-10 flex items-center justify-center bg-zinc-800 text-zinc-400 rounded-full hover:bg-zinc-700 transition-all"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                </div>

                                <input className="text-3xl font-bold bg-transparent outline-none text-white mb-10 w-full focus:text-purple-400 transition-colors" defaultValue={selectedTask.text} onBlur={(e) => updateTask(selectedTask.id, { text: e.target.value })} />

                                <div className="space-y-10">
                                    {/* Atananlar */}
                                    <div className="space-y-4">
                                        <label className="text-zinc-600 text-[10px] font-black uppercase tracking-widest">Atanan Ekip Üyeleri</label>
                                        <div className="flex gap-2">
                                            {Object.entries(TEAM_MAP).map(([fullName, id]) => {
                                                const active = (selectedTask.assignee || []).includes(id);
                                                return (
                                                    <button key={id} onClick={() => {
                                                        const current = selectedTask.assignee || [];
                                                        const next = current.includes(id) ? current.filter(x => x !== id) : [...current, id];
                                                        updateTask(selectedTask.id, { assignee: next });
                                                    }} className={`px-5 py-2.5 rounded-2xl text-xs font-bold transition-all border ${active ? `bg-purple-600 text-white border-transparent shadow-lg shadow-purple-900/40` : 'border-zinc-800 text-zinc-500 hover:border-zinc-600'}`}>{id} <span className="text-[10px] opacity-50 ml-1 font-normal">{fullName.split(' ')[0]}</span></button>
                                                )
                                            })}
                                        </div>
                                    </div>

                                    {/* Tarihler */}
                                    <div className="grid grid-cols-2 gap-6 pt-10 border-t border-zinc-900">
                                        <div className="space-y-3">
                                            <label className="text-zinc-600 text-[10px] font-black uppercase tracking-widest">Başlangıç</label>
                                            <input type="date" value={selectedTask.start_date || ""} onChange={e => updateTask(selectedTask.id, { start_date: e.target.value })} className="bg-zinc-900 border border-zinc-800 text-white p-4 rounded-2xl w-full outline-none focus:border-purple-500 transition-all" />
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-zinc-600 text-[10px] font-black uppercase tracking-widest">Bitiş (Due Date)</label>
                                            <input type="date" value={selectedTask.end_date || ""} onChange={e => updateTask(selectedTask.id, { end_date: e.target.value })} className="bg-zinc-900 border border-zinc-800 text-white p-4 rounded-2xl w-full outline-none focus:border-purple-500 transition-all" />
                                        </div>
                                    </div>

                                    {/* Açıklama */}
                                    <div className="pt-10 border-t border-zinc-900">
                                        <label className="text-zinc-600 text-[10px] font-black uppercase tracking-widest block mb-4">Görev İçeriği / Notlar</label>
                                        <textarea className="w-full bg-[#0c0c0e] border border-zinc-800 rounded-3xl p-6 text-sm min-h-[200px] outline-none focus:border-purple-900/50 transition-all custom-scrollbar leading-relaxed" placeholder="Görevin detaylarını buraya yazabilirsiniz..." defaultValue={selectedTask.description} onBlur={e => updateTask(selectedTask.id, { description: e.target.value })} />
                                    </div>

                                    {/* Modal Alt Butonlar */}
                                    <div className="flex gap-4 pt-10 border-t border-zinc-900">
                                        <button onClick={() => setSelectedTask(null)} className="flex-1 bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-2xl font-bold transition-all shadow-lg shadow-purple-900/20">DEĞİŞİKLİKLERİ KAYDET VE KAPAT</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

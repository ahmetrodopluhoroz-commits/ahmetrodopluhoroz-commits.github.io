<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Rodoplu Horoz | Portfolyo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-tooltip-card { background: rgba(255, 255, 255, 0.98); border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 12px; min-width: 240px; z-index: 50; }
        .tooltip-header { font-weight: 700; color: #1e293b; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .tooltip-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.85rem; }
        .tooltip-label { color: #64748b; }
        .tooltip-value { font-weight: 600; color: #334155; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .expand-modal { width: 90%; height: 90%; background: white; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; overflow: hidden; animation: zoomIn 0.2s ease-out; }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .ai-message { padding: 12px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; font-size: 0.9rem; line-height: 1.5; }
        .ai-message.user { background-color: #eff6ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message.bot { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-[1000] shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-blue-600">ARH</span>
                    <span class="ml-2 text-slate-700 font-semibold text-lg hidden md:block">Ahmet Rodoplu Horoz | Portfolyo</span>
                </div>
                <div class="flex space-x-8 text-sm font-medium text-slate-500">
                    <a href="#" class="hover:text-blue-600 transition">Hakkımda</a>
                    <a href="#" class="hover:text-blue-600 transition border-b-2 border-blue-600 text-blue-600 pb-1">Finansal Panel</a>
                    <a href="https://linkedin.com" target="_blank" class="hover:text-blue-600 transition">LinkedIn</a>
                </div>
            </div>
        </div>
    </nav>

    <div id="root"></div>

    <a href="https://wa.me/905442657833?text=Merhaba%20Ahmet%20Bey,%20web%20sitenizdeki%20finansal%20panel%20hakkında%20yardım%20almak%20istiyorum." 
       target="_blank" 
       class="fixed bottom-6 right-6 z-[2000] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center group"
       title="WhatsApp ile Yardım Al">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.3a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
        <span class="max-w-0 overflow-hidden group-hover:max-w-xs group-hover:ml-2 transition-all duration-500 ease-in-out whitespace-nowrap text-sm font-medium">
            Destek Al
        </span>
    </a>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const getRecharts = () => window.Recharts || null;

        const apiKey = ""; // Gemini API Key Buraya

        const Icons = {
            Upload: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            TrendingUp: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            TrendingDown: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>,
            AlertTriangle: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            Settings: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Printer: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            Maximize: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
        };

        const DISPLAY_MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
        const MONTH_SEARCH_KEYS = [['oca','jan'],['sub','feb'],['mar'],['nis','apr'],['may'],['haz','jun'],['tem','jul'],['agu','aug'],['eyl','sep'],['eki','oct'],['kas','nov'],['ara','dec']];
        const THEME = { bg: 'bg-slate-50', card: 'bg-white shadow-sm border border-slate-200 rounded-xl' };

        function App() {
            const [isRechartsReady, setIsRechartsReady] = useState(false);
            const [data, setData] = useState([]);
            const [budgetData, setBudgetData] = useState([]);
            const [fileName, setFileName] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(false);
            const [showDataModal, setShowDataModal] = useState(false);
            
            useEffect(() => {
                const checkInterval = setInterval(() => { if (window.Recharts) { setIsRechartsReady(true); clearInterval(checkInterval); } }, 500);
                return () => clearInterval(checkInterval);
            }, []);

            const parseNumber = (val) => { 
                if (!val) return 0; 
                let str = String(val).replace(/\s/g, '').replace(/\u00A0/g, ''); 
                let clean = str.replace(/\./g, '').replace(',', '.'); 
                let result = parseFloat(clean); 
                return isNaN(result) ? 0 : result; 
            };

            const parseCSV = (text, type) => {
                setLoading(true);
                setTimeout(() => {
                    try {
                        const lines = text.split(/\r?\n/);
                        const delimiter = lines[0].includes(';') ? ';' : ',';
                        const headers = lines[0].split(delimiter).map(h => h.trim().toLocaleLowerCase('tr-TR'));
                        
                        const parsed = lines.slice(1).map((line, i) => {
                            const cols = line.split(delimiter);
                            if (cols.length < 2) return null;
                            const monthlyData = {};
                            DISPLAY_MONTHS.forEach((m, idx) => {
                                monthlyData[m] = parseNumber(cols[idx + 4]); // Sütun yapısına göre düzenlenmeli
                            });
                            return { id: i, monthlyData, toplam2025: Object.values(monthlyData).reduce((a,b)=>a+b, 0) };
                        }).filter(Boolean);

                        if (type === 'actual') setData(parsed); else setBudgetData(parsed);
                        setShowDataModal(false);
                    } catch (e) { alert("Hata: " + e.message); } finally { setLoading(false); }
                }, 200);
            };

            const handleFileUpload = (e, type) => {
                const f = e.target.files?.[0];
                if (f) {
                    if(type==='actual') setFileName(f.name);
                    const r = new FileReader();
                    r.onload = (ev) => parseCSV(ev.target.result, type);
                    r.readAsText(f, 'ISO-8859-9');
                }
            };

            if (!isRechartsReady) return <div className="flex h-screen items-center justify-center">Yükleniyor...</div>;
            const { ComposedChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

            return (
                <div className={`min-h-screen ${THEME.bg} p-6`}>
                    {/* Dashboard Header */}
                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800">Finansal Yönetim Paneli</h2>
                                <p className="text-slate-500 text-sm mt-1">{fileName || 'Lütfen CSV dosyası yükleyin'}</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setShowDataModal(true)} className="flex items-center gap-2 bg-slate-100 text-slate-700 px-4 py-2 rounded-lg hover:bg-slate-200 transition border border-slate-200"><Icons.Settings size={18}/> Veri İşlemleri</button>
                                <button onClick={() => window.print()} className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition"><Icons.Printer size={18}/> Rapor Al</button>
                            </div>
                        </div>

                        {data.length === 0 ? (
                            <div className="bg-white p-20 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                                <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600"><Icons.Upload size={32}/></div>
                                <h3 className="text-lg font-bold text-slate-700">Analize Başlamak İçin Veri Yükleyin</h3>
                                <p className="text-slate-500 mb-6 max-w-sm mx-auto">Fiili harcama verilerinizi içeren CSV dosyasını sürükleyip bırakın veya seçin.</p>
                                <label className="bg-blue-600 text-white px-6 py-3 rounded-xl cursor-pointer hover:bg-blue-700 transition font-medium inline-block">
                                    <input type="file" hidden onChange={(e)=>handleFileUpload(e, 'actual')}/> CSV Dosyası Seç
                                </label>
                            </div>
                        ) : (
                            <div className="space-y-6 animate-fadeIn">
                                {/* Grafik ve Tablo Alanı Buraya Gelecek */}
                                <div className={`${THEME.card} p-8 h-96`}>
                                    <ResponsiveContainer>
                                        <ComposedChart data={DISPLAY_MONTHS.map(m => ({ name: m, actual: data.reduce((acc, r) => acc + (r.monthlyData[m] || 0), 0) }))}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9"/>
                                            <XAxis dataKey="name" axisLine={false} tickLine={false} />
                                            <YAxis axisLine={false} tickLine={false} tickFormatter={v => `${(v/1000).toFixed(0)}k`} />
                                            <Tooltip />
                                            <Bar dataKey="actual" name="Fiili" fill="#3b82f6" radius={[4,4,0,0]} barSize={30} />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Veri Modal */}
                    {showDataModal && (
                        <div className="modal-overlay" onClick={() => setShowDataModal(false)}>
                            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold mb-6">Veri Yönetimi</h3>
                                <div className="space-y-4">
                                    <div className="p-4 border rounded-xl bg-blue-50 border-blue-100 text-center">
                                        <p className="text-sm font-bold text-blue-800 mb-3">Fiili Veri (Actual)</p>
                                        <input type="file" onChange={(e)=>handleFileUpload(e, 'actual')} className="text-xs"/>
                                    </div>
                                    <div className="p-4 border rounded-xl bg-purple-50 border-purple-100 text-center">
                                        <p className="text-sm font-bold text-purple-800 mb-3">Bütçe Verisi (Budget)</p>
                                        <input type="file" onChange={(e)=>handleFileUpload(e, 'budget')} className="text-xs"/>
                                    </div>
                                </div>
                                <button onClick={() => setShowDataModal(false)} className="mt-8 w-full py-3 bg-slate-100 rounded-xl font-bold text-slate-600 hover:bg-slate-200 transition">Kapat</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

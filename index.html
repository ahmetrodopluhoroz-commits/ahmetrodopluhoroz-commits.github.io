<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | Team & Sprint Hub (v5.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: all 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 100; }
        .dark-body { background-color: #0c0c0e; color: #d1d1d1; }
        .quartz-body { background-color: #F4F5F7; color: #172B4D; }
        .day-cell { min-width: 45px; width: 45px; flex-shrink: 0; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body class="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-orange-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [comments, setComments] = useState([]);
            const [activeSprintId, setActiveSprintId] = useState(null);
            
            const [currentView, setCurrentView] = useState('board');
            const [theme, setTheme] = useState('dark');
            const [selectedTask, setSelectedTask] = useState(null);
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // Filtre State'leri
            const [filterAssignee, setFilterAssignee] = useState('All');
            const [filterTag, setFilterTag] = useState('All');
            const [filterTime, setFilterTime] = useState('All');

            const ganttScrollRef = useRef(null);

            const fetchData = async () => {
                const { data: tsk } = await supabase.from('tasks').select('*');
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: spr } = await supabase.from('sprints').select('*').order('start_date');
                setTasks(tsk || []);
                setColumns(cols || []);
                setSprints(spr || []);
                if (spr?.length > 0 && !activeSprintId) setActiveSprintId(spr[0].id);
            };

            const fetchComments = async (taskId) => {
                const { data } = await supabase.from('comments').select('*').eq('task_id', taskId).order('created_at', { ascending: true });
                setComments(data || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            // --- FİLTRELEME MANTIĞI ---
            const filteredTasks = useMemo(() => {
                let f = [...tasks];
                if (filterAssignee !== 'All') f = f.filter(t => (t.assignee || []).includes(filterAssignee));
                if (filterTag !== 'All') f = f.filter(t => (t.tags || []).includes(filterTag));
                if (filterTime !== 'All') {
                    const now = new Date();
                    const limit = new Date(now.setDate(now.getDate() + (filterTime === 'week' ? 7 : 30)));
                    f = f.filter(t => t.end_date && new Date(t.end_date) <= limit);
                }
                return f;
            }, [tasks, filterAssignee, filterTag, filterTime]);

            const availableTags = useMemo(() => {
                const tags = new Set();
                tasks.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
                return Array.from(tags);
            }, [tasks]);

            const updateTask = async (taskId, updates) => {
                await supabase.from('tasks').update(updates).eq('id', taskId);
                fetchData();
                if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
            };

            const addComment = async (text, userId) => {
                if(!text.trim()) return;
                await supabase.from('comments').insert([{ task_id: selectedTask.id, text, user_id: userId }]);
                fetchComments(selectedTask.id);
            };

            const isDark = theme === 'dark';

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42]">
                        <div className="bg-white p-10 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-xl font-bold text-[#172B4D] mb-8 uppercase italic">RASG 2026</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hata!"); }} className="space-y-4">
                                <input type="text" placeholder="RASG" onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-[#FAFBFC] border border-[#DFE1E6] rounded text-[#172B4D] outline-none" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#FAFBFC] border border-[#DFE1E6] rounded text-[#172B4D] outline-none" />
                                <button className="w-full bg-[#0052CC] p-4 rounded-lg font-bold text-white hover:bg-[#0747A6] transition">GİRİŞ</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`h-screen flex flex-col ${isDark ? 'dark-body dark' : 'quartz-body'}`}>
                    {/* HEADER & FILTERS */}
                    <header className={`p-4 border-b flex justify-between items-center z-50 ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-[#DCDFE4]'}`}>
                        <div className="flex items-center gap-6">
                            <h1 className="font-bold italic text-lg tracking-tighter">RASG 2026</h1>
                            <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                                {['board', 'list', 'gantt', 'sprints'].map(v => (
                                    <button key={v} onClick={() => setCurrentView(v)} className={`pb-1 ${currentView === v ? 'border-b-2 border-blue-500 text-blue-500' : 'opacity-40'}`}>{v}</button>
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-2 items-center">
                            {/* Global Filtreler */}
                            <select onChange={e => setFilterAssignee(e.target.value)} className="bg-transparent border border-zinc-700 text-[9px] p-1 rounded font-bold uppercase">
                                <option value="All">Atanan: Hepsi</option>
                                {TEAM.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                            <select onChange={e => setFilterTag(e.target.value)} className="bg-transparent border border-zinc-700 text-[9px] p-1 rounded font-bold uppercase">
                                <option value="All">Etiket: Hepsi</option>
                                {availableTags.map(tag => <option key={tag} value={tag}>{tag}</option>)}
                            </select>
                            
                            <div className={`flex p-1 rounded-md mx-2 ${isDark ? 'bg-black' : 'bg-[#EBECF0]'}`}>
                                <button onClick={() => setTheme('quartz')} className={`px-2 py-1 rounded text-[8px] font-bold ${!isDark ? 'bg-white shadow text-[#0052CC]' : 'text-zinc-500'}`}>QUARTZ</button>
                                <button onClick={() => setTheme('dark')} className={`px-2 py-1 rounded text-[8px] font-bold ${isDark ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}>DARK</button>
                            </div>
                            <button onClick={async () => { const t = prompt("Görev?"); if(t) await supabase.from('tasks').insert([{text:t, status: columns[0].slug, tags: []}]); fetchData(); }} className="bg-[#0052CC] text-white px-4 py-1.5 rounded text-[10px] font-bold">+ TASK</button>
                            <button onClick={() => setIsLoggedIn(false)} className="text-zinc-500 hover:text-red-500 ml-1"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden">
                        {/* BOARD GÖRÜNÜMÜ */}
                        {currentView === 'board' && (
                            <div className="flex h-full p-6 gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { status: col.slug })}>
                                        <div className="mb-4 flex justify-between items-center px-1">
                                            <span className="text-[11px] font-black uppercase opacity-40">{col.title}</span>
                                            <span className="text-[10px] bg-zinc-800 px-2 py-0.5 rounded-full">{filteredTasks.filter(t => t.status === col.slug).length}</span>
                                        </div>
                                        <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-1">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} onClick={() => { setSelectedTask(task); fetchComments(task.id); }} className={`p-4 rounded-xl border cursor-pointer hover:border-blue-500 transition-all ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-zinc-200 shadow-sm'}`}>
                                                    <div className="flex flex-wrap gap-1 mb-2">{(task.tags || []).map(tag => <span key={tag} className="text-[8px] bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded font-bold uppercase">{tag}</span>)}</div>
                                                    <p className="text-[13px] font-medium leading-relaxed">{task.text}</p>
                                                    <div className="flex justify-between items-center mt-4">
                                                        <div className="flex -space-x-1.5">
                                                            {(task.assignee || []).map(id => <div key={id} className={`w-5 h-5 rounded-full border border-zinc-900 flex items-center justify-center text-[7px] font-bold text-white ${TEAM.find(x => x.id === id)?.color}`}>{id}</div>)}
                                                        </div>
                                                        <span className="text-[9px] opacity-40 font-bold">{task.end_date || 'Açık'}</span>
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={() => { const t = prompt("Görev?"); if(t) supabase.from('tasks').insert([{text:t, status: col.slug}]).then(fetchData); }} className="w-full py-2 border-2 border-dashed border-zinc-800 rounded-xl text-[10px] font-black opacity-20 hover:opacity-100 transition uppercase">+ ADD TASK</button>
                                        </div>
                                    </div>
                                ))}
                                <button onClick={async () => { const t = prompt("Sütun?"); if(t) await supabase.from('columns').insert([{title:t, slug: t.toLowerCase().replace(/ /g,'_'), order_index: columns.length+1}]); fetchData(); }} className="column-width border-2 border-dashed border-zinc-800 rounded-xl text-[10px] font-black opacity-20 hover:opacity-100 transition uppercase">SÜTUN EKLE</button>
                            </div>
                        )}
                        {/* Diğer görünümler (List, Gantt, Sprints) buraya gelecek - Alan tasarrufu için Board detaylandırıldı */}
                    </main>

                    {/* TASK MODAL (YORUM VE ETİKET PANELİ) */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className={`${isDark ? 'bg-[#141416]' : 'bg-white'} w-full max-w-2xl h-full shadow-2xl p-10 flex flex-col overflow-y-auto animate-in slide-in-from-right`}>
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-[10px] font-black text-blue-500 uppercase tracking-widest">GÖREV AYRINTILARI</span>
                                    <button onClick={() => setSelectedTask(null)} className="text-2xl hover:text-red-500 transition-all">✕</button>
                                </div>
                                <input className="text-3xl font-bold bg-transparent outline-none w-full mb-8" defaultValue={selectedTask.text} onBlur={e => updateTask(selectedTask.id, { text: e.target.value })} />
                                
                                <div className="flex-1 space-y-8 custom-scrollbar pr-2">
                                    {/* Etiket Yönetimi */}
                                    <div>
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-3 tracking-widest">Etiketler (Tags)</label>
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            {(selectedTask.tags || []).map(tag => (
                                                <span key={tag} className="bg-blue-500/10 text-blue-500 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-2">
                                                    {tag} <i className="fas fa-times cursor-pointer" onClick={() => updateTask(selectedTask.id, { tags: selectedTask.tags.filter(t => t !== tag) })}></i>
                                                </span>
                                            ))}
                                            <input type="text" placeholder="+ Yeni Etiket" className="bg-transparent border-b border-zinc-800 text-xs outline-none p-1 w-24" onKeyDown={e => {
                                                if(e.key === 'Enter' && e.target.value) {
                                                    const next = [...(selectedTask.tags || []), e.target.value];
                                                    updateTask(selectedTask.id, { tags: next });
                                                    e.target.value = "";
                                                }
                                            }} />
                                        </div>
                                    </div>

                                    {/* YORUMLAR (ACTIVITY) BÖLÜMÜ */}
                                    <div className="pt-8 border-t border-zinc-900 flex-1 flex flex-col">
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-6 tracking-widest"><i className="far fa-comments mr-2"></i>Aktivite & Yorumlar</label>
                                        <div className="flex-1 space-y-4 mb-8">
                                            {comments.map(c => (
                                                <div key={c.id} className="flex gap-4">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-bold text-white flex-shrink-0 ${TEAM.find(t => t.id === c.user_id)?.color}`}>{c.user_id}</div>
                                                    <div className="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800 flex-1">
                                                        <p className="text-sm leading-relaxed">{c.text}</p>
                                                        <span className="text-[9px] opacity-20 block mt-2">{new Date(c.created_at).toLocaleString('tr-TR')}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        {/* Yeni Yorum Yazma */}
                                        <div className="bg-zinc-900 p-4 rounded-3xl border border-zinc-800">
                                            <textarea id="commentBox" className="w-full bg-transparent outline-none text-sm min-h-[60px] resize-none" placeholder="Bir yorum bırakın..."></textarea>
                                            <div className="flex justify-between items-center mt-2 border-t border-zinc-800 pt-2">
                                                <div className="flex gap-2">
                                                    {TEAM.map(u => (
                                                        <button key={u.id} onClick={() => {
                                                            const txt = document.getElementById('commentBox').value;
                                                            addComment(txt, u.id);
                                                            document.getElementById('commentBox').value = "";
                                                        }} className={`${u.color} text-white px-3 py-1 rounded-full text-[10px] font-black uppercase`}>{u.id} olarak gönder</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedTask(null)} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold shadow-xl hover:bg-blue-700 transition-all uppercase text-xs tracking-widest mt-4">Kaydet ve Kapat</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

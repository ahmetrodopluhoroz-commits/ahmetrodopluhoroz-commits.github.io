<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG & YIGIT | 2026 Enterprise Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: all 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 100; }
        .dark-body { background-color: #0c0c0e; color: #d1d1d1; }
        .view-active { border-bottom: 2px solid #0052CC; color: #0052CC; opacity: 1 !important; }
        .task-completed { opacity: 0.4; text-decoration: line-through; filter: grayscale(1); }
        .recharts-default-tooltip { border-radius: 16px !important; border: none !important; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1) !important; background-color: #fff !important; padding: 10px 15px !important; color: #1e293b !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, PieChart, Pie, Legend, LineChart, Line } = window.Recharts;

        // --- SUPABASE BAĞLANTISI ---
        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-orange-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' },
            { id: 'RASG', name: 'RASG', color: 'bg-zinc-600' }
        ];

        // Bütçe İkonları
        const Icon = ({ size = 24, className = "", children, ...p }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...p}>{children}</svg>
        );
        const Icons = {
            LayoutDashboard: (p) => <Icon {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></Icon>,
            CreditCard: (p) => <Icon {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></Icon>,
            Receipt: (p) => <Icon {...p}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/></Icon>,
            Home: (p) => <Icon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
            Settings: (p) => <Icon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>,
            PlusCircle: (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></Icon>,
            Wallet: (p) => <Icon {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></Icon>,
            ArrowUpRight: (p) => <Icon {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>,
            ShoppingBag: (p) => <Icon {...p}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></Icon>,
            Trash2: (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>,
        };

        // --- GİRİŞ KONTROLÜ ---
        function MainApp() {
            const [userMode, setUserMode] = useState(null);
            const [credentials, setCredentials] = useState({ u: "", p: "" });

            const handleLogin = (e) => {
                e.preventDefault();
                if (credentials.u === "RASG" && credentials.p === "RASG2026") setUserMode('project');
                else if (credentials.u === "YIGIT" && credentials.p === "YIGIT") setUserMode('budget');
                else alert("Hatalı Giriş!");
            };

            if (!userMode) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42]">
                        <div className="bg-white p-10 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-xl font-black text-[#172B4D] mb-8 italic uppercase tracking-tighter">RASG HUB LOGIN</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" placeholder="Kullanıcı" onChange={e => setCredentials({...credentials, u: e.target.value})} className="w-full p-4 bg-[#FAFBFC] border border-[#DFE1E6] rounded-xl outline-none focus:border-blue-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setCredentials({...credentials, p: e.target.value})} className="w-full p-4 bg-[#FAFBFC] border border-[#DFE1E6] rounded-xl outline-none focus:border-blue-500" />
                                <button className="w-full bg-[#0052CC] p-4 rounded-xl font-bold text-white hover:bg-[#0747A6] transition uppercase tracking-widest">GİRİŞ YAP</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return userMode === 'project' ? <AppProject logout={() => setUserMode(null)} /> : <AppBudget logout={() => setUserMode(null)} />;
        }

        // --- SAYFA 1: PROJE YÖNETİMİ (Kod Değişmedi) ---
        function AppProject({ logout }) {
            // (Mevcut v7.0 Proje Kodu Buraya Gelecek - Alan tasarrufu için özetlendi)
            return <div className="h-screen bg-[#0c0c0e] flex flex-col p-10"><button onClick={logout} className="text-white">ÇIKIŞ YAP</button><h1 className="text-white mt-10">Proje Yönetim Alanı Aktif.</h1></div>;
        }

        // --- SAYFA 2: BÜTÇE & KASA (SUPABASE BAĞLANTILI) ---
        function AppBudget({ logout }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedMonth, setSelectedMonth] = useState("Ocak");
            const [transactions, setTransactions] = useState([]);
            const [categories, setCategories] = useState([]);
            const [totalSavings, setTotalSavings] = useState(0);
            const [newTrans, setNewTrans] = useState({ title: '', categoryId: '', amount: '', month: 'Ocak' });
            const [isSuccess, setIsSuccess] = useState(false);

            const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
            const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];

            const fetchBudgetData = async () => {
                const { data: cats } = await supabase.from('budget_categories').select('*');
                const { data: trans } = await supabase.from('budget_transactions').select('*').order('created_at', { ascending: false });
                const { data: sav } = await supabase.from('budget_savings').select('amount').eq('id', 1).single();
                
                setCategories(cats || []);
                setTransactions(trans || []);
                if(sav) setTotalSavings(sav.amount);
            };

            useEffect(() => { fetchBudgetData(); }, []);

            const stats = useMemo(() => {
                const mData = transactions.filter(t => t.month === selectedMonth);
                const inc = mData.filter(t => t.type === 'income').reduce((a, b) => a + Number(b.amount), 0);
                const exp = mData.filter(t => t.type === 'expense').reduce((a, b) => a + Number(b.amount), 0);
                const bankChart = Object.entries(mData.filter(t => categories.find(c => c.id == t.category_id)?.group === 'banka').reduce((acc, curr) => {
                    const name = categories.find(c => c.id == curr.category_id)?.name || 'Diğer';
                    acc[name] = (acc[name] || 0) + Number(curr.amount); return acc;
                }, {})).map(([name, value]) => ({ name, value }));
                return { income: inc, expense: exp, balance: inc - exp, bankChart };
            }, [transactions, selectedMonth, categories]);

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!newTrans.categoryId || !newTrans.amount) return;
                const cat = categories.find(c => c.id == newTrans.categoryId);
                await supabase.from('budget_transactions').insert([{
                    title: newTrans.title || cat.name,
                    category_id: newTrans.categoryId,
                    amount: Number(newTrans.amount),
                    month: selectedMonth,
                    type: cat.type
                }]);
                setIsSuccess(true); setTimeout(() => setIsSuccess(false), 2000);
                fetchBudgetData();
                setNewTrans({ title: '', categoryId: '', amount: '', month: selectedMonth });
            };

            const handleDelete = async (id) => {
                if(confirm("Silinsin mi?")) {
                    await supabase.from('budget_transactions').delete().eq('id', id);
                    fetchBudgetData();
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row text-slate-900 overflow-hidden">
                    <aside className="w-64 bg-white border-r p-6 flex flex-col sticky top-0 h-screen">
                        <div className="flex items-center space-x-3 text-blue-600 mb-10"><Icons.Wallet size={28} /><span className="text-xl font-black italic">BUTCE2026</span></div>
                        <nav className="space-y-2 flex-1">
                            {[{ id: 'dashboard', label: 'Dashboard', icon: Icons.LayoutDashboard }, { id: 'gelir', label: 'Gelirler', icon: Icons.ArrowUpRight }, { id: 'banka', label: 'Banka İşlemleri', icon: Icons.CreditCard }].map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${activeTab === item.id ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    <item.icon size={20} /><span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <button onClick={logout} className="mt-auto flex items-center gap-2 p-4 text-slate-400 hover:text-red-500 font-bold text-sm"><i className="fas fa-power-off"></i> ÇIKIŞ</button>
                    </aside>

                    <main className="flex-1 overflow-y-auto custom-scrollbar">
                        <div className="p-4 md:p-8 flex space-x-2 bg-white border-b overflow-x-auto no-scrollbar">
                            {MONTHS.map(m => <button key={m} onClick={() => setSelectedMonth(m)} className={`px-5 py-2 rounded-full text-[10px] font-black transition-all ${selectedMonth === m ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}`}>{m.toUpperCase()}</button>)}
                        </div>

                        <div className="p-10 max-w-6xl mx-auto space-y-12">
                            {activeTab === 'dashboard' ? (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-white p-6 rounded-[32px] border"><p className="text-slate-400 text-[10px] font-black uppercase mb-2">Gelir</p><h2 className="text-2xl font-black text-emerald-600">₺{stats.income.toLocaleString()}</h2></div>
                                        <div className="bg-white p-6 rounded-[32px] border"><p className="text-slate-400 text-[10px] font-black uppercase mb-2">Gider</p><h2 className="text-2xl font-black text-rose-600">₺{stats.expense.toLocaleString()}</h2></div>
                                        <div className="bg-white p-6 rounded-[32px] border"><p className="text-slate-400 text-[10px] font-black uppercase mb-2">Net</p><h2 className="text-2xl font-black text-blue-600">₺{stats.balance.toLocaleString()}</h2></div>
                                        <div className="bg-gradient-to-br from-emerald-500 to-teal-600 p-6 rounded-[32px] text-white shadow-xl"><p className="opacity-70 text-[10px] font-black uppercase mb-2">Toplam Birikim</p><h2 className="text-2xl font-black">₺{totalSavings.toLocaleString()}</h2></div>
                                    </div>

                                    <div className="bg-white p-10 rounded-[48px] border shadow-2xl">
                                        <h3 className="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] mb-8">YENİ KAYIT EKLE</h3>
                                        <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 ml-2">KATEGORİ</label>
                                                <select className="w-full p-5 bg-slate-50 border rounded-[24px] outline-none font-bold" value={newTrans.categoryId} onChange={e => setNewTrans({...newTrans, categoryId: e.target.value})}>
                                                    <option value="">Seçiniz</option>
                                                    {categories.filter(c => activeTab === 'gelir' ? c.type === 'income' : true).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-slate-400 ml-2">TUTAR</label>
                                                <input type="number" className="w-full p-5 bg-blue-50 border-2 border-blue-100 rounded-[24px] outline-none font-black text-blue-700 text-xl" value={newTrans.amount} onChange={e => setNewTrans({...newTrans, amount: e.target.value})} placeholder="0,00" />
                                            </div>
                                            <div className="flex items-end">
                                                <button type="submit" className="w-full bg-blue-600 text-white font-black rounded-[24px] py-5 shadow-xl hover:bg-blue-700 transition-all uppercase tracking-widest">KAYDET</button>
                                            </div>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-[40px] border shadow-sm overflow-hidden">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest"><tr className="border-b"><th className="p-8">İşlem / Kategori</th><th className="p-8 text-center">Ay</th><th className="p-8 text-right">Tutar</th><th className="p-8"></th></tr></thead>
                                            <tbody className="divide-y">
                                                {transactions.filter(t => t.month === selectedMonth).map(t => (
                                                    <tr key={t.id} className="hover:bg-slate-50/50 transition-all group font-bold">
                                                        <td className="p-8 text-sm text-slate-700">{t.title} <span className="ml-2 text-[9px] bg-slate-100 px-2 py-1 rounded text-slate-400">{categories.find(c => c.id == t.category_id)?.name}</span></td>
                                                        <td className="p-8 text-center text-[10px] text-slate-400">{t.month}</td>
                                                        <td className={`p-8 text-right text-lg italic tracking-tighter ${t.type === 'income' ? 'text-emerald-600' : 'text-slate-900'}`}>₺{t.amount.toLocaleString()}</td>
                                                        <td className="p-8 text-right"><button onClick={() => handleDelete(t.id)} className="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100"><Icons.Trash2 size={18}/></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </>
                            ) : <div className="p-20 text-center text-slate-300 italic">Sayfa detayları yüklendi.</div>}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>

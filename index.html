<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | Proje Yönetim Sistemi 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0c0e; color: #d1d1d1; font-family: 'Inter', sans-serif; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 300px; width: 300px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.85); z-index: 50; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- API BİLGİLERİNİZİ BURAYA YAPIŞTIRIN ---
        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        
        // Kütüphane çakışmasını önlemek için window üzerinden çağırıyoruz
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const USERS = [
            { id: 'AR', color: 'bg-orange-500' },
            { id: 'YE', color: 'bg-blue-500' },
            { id: 'BD', color: 'bg-purple-500' }
        ];

        const COLUMNS = [
            { id: 'todo', title: 'TO DO', dot: '#4b5563' },
            { id: 'yapilacak', title: 'YAPILACAK', dot: '#d1d5db' },
            { id: 'calisiliyor', title: 'ÇALIŞILIYOR', dot: '#7c3aed' },
            { id: 'beklemede', title: 'BEKLEMEDE', dot: '#d97706' },
            { id: 'guncelleme', title: 'GÜNCELLEME GEREKLİ', dot: '#ca8a04' },
            { id: 'tamamlandi', title: 'TAMAMLANDI', dot: '#14b8a6' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [tasks, setTasks] = useState([]);
            const [selectedTask, setSelectedTask] = useState(null);
            const [subtasks, setSubtasks] = useState([]);
            const [loading, setLoading] = useState(false);

            const fetchTasks = async () => {
                setLoading(true);
                try {
                    const { data, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: true });
                    if (!error) setTasks(data || []);
                } catch (err) { console.error("Task çekme hatası:", err); }
                setLoading(false);
            };

            const fetchSubtasks = async (taskId) => {
                if (!taskId) return;
                try {
                    const { data, error } = await supabaseClient.from('subtasks').select('*').eq('parent_id', taskId).order('created_at');
                    if (!error) setSubtasks(data || []);
                } catch (err) { console.error("Subtask çekme hatası:", err); }
            };

            useEffect(() => { if (isLoggedIn) fetchTasks(); }, [isLoggedIn]);

            const addTask = async (status = 'todo') => {
                const text = prompt("Görev Başlığı:");
                if (!text) return;
                const { error } = await supabaseClient.from('tasks').insert([{ text, status, assignee: 'AR', priority: 'Normal', date: new Date().toLocaleDateString('tr-TR') }]);
                if (!error) fetchTasks();
            };

            const updateTask = async (id, updates) => {
                const { error } = await supabaseClient.from('tasks').update(updates).eq('id', id);
                if (!error) fetchTasks();
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <div className="bg-[#1a1a1c] p-8 rounded-xl border border-zinc-800 w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-2xl font-bold text-white mb-6">RASG Giriş</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if (username === "RASG" && password === "RASG2026") setIsLoggedIn(true); else alert("Hatalı!"); }} className="space-y-4">
                                <input type="text" placeholder="Kullanıcı Adı" onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-zinc-900 border border-zinc-700 rounded text-white outline-none focus:border-purple-500"/>
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-zinc-900 border border-zinc-700 rounded text-white outline-none focus:border-purple-500"/>
                                <button className="w-full bg-purple-600 p-3 rounded font-bold text-white hover:bg-purple-700 transition">Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col relative">
                    <header className="bg-[#1a1a1c] border-b border-zinc-800 p-4 flex justify-between items-center z-10">
                        <span className="text-zinc-400 font-bold">2026-Ortak İş & Proje Alanı</span>
                        <button onClick={() => addTask()} className="bg-blue-600 px-4 py-1.5 rounded text-white text-sm font-bold">+ TASK</button>
                    </header>

                    <main className="flex-1 flex overflow-x-auto p-6 gap-6 custom-scrollbar bg-[#0c0c0e]">
                        {COLUMNS.map(col => (
                            <div key={col.id} className="column-width flex flex-col">
                                <div className="flex items-center gap-2 mb-4 border-b border-zinc-800 pb-2">
                                    <div style={{backgroundColor: col.dot}} className="w-2.5 h-2.5 rounded-full"></div>
                                    <span className="text-xs font-bold text-zinc-500 uppercase">{col.title}</span>
                                </div>
                                <div className="space-y-3">
                                    {tasks.filter(t => t.status === col.id).map(task => (
                                        <div key={task.id} onClick={() => setSelectedTask(task)} className="bg-[#1a1a1c] border border-zinc-800 p-4 rounded-lg hover:border-purple-500 transition-all cursor-pointer group">
                                            <p className="text-sm text-zinc-200">{task.text}</p>
                                        </div>
                                    ))}
                                    <button onClick={() => addTask(col.id)} className="w-full py-2 text-zinc-700 hover:text-zinc-500 text-xs border border-dashed border-zinc-800 rounded-lg text-center">+ Add Task</button>
                                </div>
                            </div>
                        ))}
                    </main>

                    {/* DETAY MODALI (SİYAH EKRAN HATASINI ÖNLEMEK İÇİN KOŞULLU) */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end">
                            <div className="w-full max-w-2xl bg-[#1a1a1c] h-full shadow-2xl border-l border-zinc-800 p-8 overflow-y-auto custom-scrollbar flex flex-col">
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-zinc-500 text-sm">Görev Detayı</span>
                                    <button onClick={() => { setSelectedTask(null); setSubtasks([]); }} className="text-zinc-500 hover:text-white text-xl">✕</button>
                                </div>
                                
                                <h2 className="text-2xl font-bold text-white mb-6">{selectedTask.text}</h2>
                                
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4 text-sm">
                                        <div className="text-zinc-500">Durum:</div>
                                        <div className="text-zinc-200 uppercase font-bold">{selectedTask.status}</div>
                                        <div className="text-zinc-500">Atanan:</div>
                                        <div className="text-orange-500 font-bold">{selectedTask.assignee || 'AR'}</div>
                                    </div>

                                    <div className="border-t border-zinc-800 pt-6">
                                        <h3 className="text-zinc-400 font-bold mb-4 flex items-center gap-2">
                                            <i className="fas fa-align-left"></i> Açıklama
                                        </h3>
                                        <textarea 
                                            defaultValue={selectedTask.description}
                                            onBlur={(e) => updateTask(selectedTask.id, { description: e.target.value })}
                                            placeholder="Açıklama ekleyin..."
                                            className="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-zinc-300 outline-none focus:border-zinc-600 min-h-[100px]"
                                        ></textarea>
                                    </div>
                                    
                                    <div className="border-t border-zinc-800 pt-6">
                                        <h3 className="text-zinc-400 font-bold mb-4">Alt Görevler</h3>
                                        <div className="space-y-2 mb-4">
                                            {/* Burası fetchSubtasks bittiğinde otomatik dolacak */}
                                            <p className="text-zinc-600 text-xs italic">Veriler yükleniyor veya henüz alt görev yok...</p>
                                        </div>
                                        <div className="text-zinc-600 text-xs italic">Detaylı alt görev yönetimi bir sonraki adımda eklenecek.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Ultimate Hub (v7.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: all 0.2s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 100; }
        .dark-body { background-color: #0c0c0e; color: #d1d1d1; }
        .quartz-body { background-color: #F4F5F7; color: #172B4D; }
        .view-active { border-bottom: 2px solid #0052CC; color: #0052CC; opacity: 1 !important; }
        .task-completed { opacity: 0.4; text-decoration: line-through; filter: grayscale(1); }
        
        /* Gantt Mimarisi */
        .gantt-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
        .gantt-main-scroll { flex: 1; overflow-x: auto; overflow-y: auto; }
        .gantt-timeline-header { display: flex; position: sticky; top: 0; z-index: 50; }
        .gantt-sidebar { width: 280px; flex-shrink: 0; position: sticky; left: 0; z-index: 60; border-right: 1px solid rgba(0,0,0,0.1); }
        .day-cell { flex-shrink: 0; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); height: 100%; }
        .gantt-grid-row { display: flex; min-height: 48px; border-bottom: 1px solid rgba(0,0,0,0.05); align-items: center; }
        .weekend { background-color: rgba(0,0,0,0.03); }
        .dark .weekend { background-color: rgba(255,255,255,0.03); }
        
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body class="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-orange-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' },
            { id: 'RASG', name: 'RASG', color: 'bg-zinc-600' }
        ];

        const IMPORTANCE_LEVELS = ["Acil", "Orta önem düzeyi", "Düşük önem düzeyi"];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [comments, setComments] = useState([]);
            const [activeSprintId, setActiveSprintId] = useState(null);
            
            const [currentView, setCurrentView] = useState('board');
            const [theme, setTheme] = useState('dark');
            const [selectedTask, setSelectedTask] = useState(null);
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // Filtreler & Zoom
            const [filters, setFilters] = useState({ assignees: [], tags: [], statuses: [] });
            const [ganttZoom, setGanttZoom] = useState(45);

            const ganttScrollRef = useRef(null);

            const fetchData = async () => {
                const { data: tsk } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: spr } = await supabase.from('sprints').select('*').order('start_date');
                setTasks(tsk || []);
                setColumns(cols || []);
                setSprints(spr || []);
                if (spr?.length > 0 && !activeSprintId) setActiveSprintId(spr[0].id);
            };

            const fetchComments = async (taskId) => {
                const { data } = await supabase.from('comments').select('*').eq('task_id', taskId).order('created_at', { ascending: true });
                setComments(data || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            // --- GANTT TARİH ARALIĞI ---
            const ganttStartDate = new Date(2025, 11, 1);
            const ganttEndDate = new Date(2027, 0, 31);
            const ganttDays = useMemo(() => {
                const days = [];
                let current = new Date(ganttStartDate);
                while (current <= ganttEndDate) { days.push(new Date(current)); current.setDate(current.getDate() + 1); }
                return days;
            }, []);

            useEffect(() => {
                if(currentView === 'gantt' && ganttScrollRef.current) {
                    const today = new Date();
                    const diff = Math.floor((today - ganttStartDate) / (1000 * 60 * 60 * 24));
                    if(diff > 0) ganttScrollRef.current.scrollLeft = (diff * ganttZoom) - 200;
                }
            }, [currentView, ganttZoom]);

            // --- FİLTRELEME ---
            const filteredTasks = useMemo(() => {
                return tasks.filter(t => {
                    if (currentView === 'quick_tasks') return t.is_quick === true;
                    if (t.is_quick) return false;
                    const matchAssignee = filters.assignees.length === 0 || (t.assignee || []).some(a => filters.assignees.includes(a));
                    const matchTag = filters.tags.length === 0 || (t.tags || []).some(tag => filters.tags.includes(tag));
                    const matchStatus = filters.statuses.length === 0 || filters.statuses.includes(t.status);
                    return matchAssignee && matchTag && matchStatus;
                });
            }, [tasks, filters, currentView]);

            const globalTags = useMemo(() => {
                const tags = new Set();
                tasks.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
                return Array.from(tags);
            }, [tasks]);

            // --- İŞLEMLER ---
            const toggleFilter = (type, val) => {
                setFilters(prev => {
                    const current = prev[type];
                    const next = current.includes(val) ? current.filter(v => v !== val) : [...current, val];
                    return { ...prev, [type]: next };
                });
            };

            const addTask = async (isQuick = false, assigneeId = null, colSlug = null) => {
                const text = prompt("İş Başlığı:");
                if(!text) return;
                await supabase.from('tasks').insert([{ 
                    text, 
                    is_quick: isQuick, 
                    assignee: assigneeId ? [assigneeId] : [],
                    status: colSlug || columns[0]?.slug || 'todo',
                    importance: isQuick ? "Orta önem düzeyi" : "Düşük önem düzeyi"
                }]);
                fetchData();
            };

            const updateTask = async (taskId, updates) => {
                await supabase.from('tasks').update(updates).eq('id', taskId);
                fetchData();
                if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
            };

            const resetSprints = async () => {
                if(!confirm("Tüm sprintler silinecek. Emin misiniz?")) return;
                await supabase.from('tasks').update({ sprint_id: null }).not('sprint_id', 'is', null);
                await supabase.from('sprints').delete().neq('id', 0);
                fetchData();
            };

            const autoGenerateSprints = async () => {
                const name = prompt("Önek?", "Sprint");
                const start = prompt("Başlangıç?", "2026-01-01");
                const end = prompt("Bitiş?", "2026-12-31");
                const days = parseInt(prompt("Süre?", "14"));
                if(!start || !end || isNaN(days)) return;
                let cur = new Date(start);
                const final = new Date(end);
                const newSprs = [];
                let i = 1;
                while(cur < final) {
                    let next = new Date(cur); next.setDate(cur.getDate() + days - 1);
                    newSprs.push({ name: `${name} ${i}`, start_date: cur.toISOString().split('T')[0], end_date: next.toISOString().split('T')[0] });
                    cur.setDate(cur.getDate() + days); i++;
                }
                await supabase.from('sprints').insert(newSprs);
                fetchData();
            };

            const isDark = theme === 'dark';

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42]">
                        <div className="bg-white p-10 rounded-2xl w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-xl font-black text-[#172B4D] mb-8 italic uppercase">RASG HUB</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hatalı!"); }} className="space-y-4">
                                <input type="text" placeholder="RASG" onChange={e => setUsername(e.target.value)} className="w-full p-4 bg-[#FAFBFC] border border-[#DFE1E6] rounded-xl outline-none focus:border-blue-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-[#FAFBFC] border border-[#DFE1E6] rounded-xl outline-none focus:border-blue-500" />
                                <button className="w-full bg-[#0052CC] p-4 rounded-xl font-bold text-white hover:bg-[#0747A6] transition shadow-lg uppercase">GİRİŞ YAP</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`h-screen flex flex-col ${isDark ? 'dark-body dark' : 'quartz-body'}`}>
                    {/* GLOBAL HEADER */}
                    <header className={`p-4 border-b flex flex-wrap justify-between items-center z-50 ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-[#DCDFE4]'}`}>
                        <div className="flex items-center gap-6">
                            <h1 className="font-bold italic text-lg tracking-tighter">RASG 2026</h1>
                            <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                                {['board', 'quick_tasks', 'list', 'gantt', 'sprints'].map(v => (
                                    <button key={v} onClick={() => setCurrentView(v)} className={`pb-1 opacity-40 transition-all ${currentView === v ? 'view-active' : ''}`}>{v.replace('_', ' ')}</button>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-3 items-center flex-wrap">
                            {/* Çoklu Filtreler */}
                            {currentView !== 'quick_tasks' && (
                                <div className="flex gap-2 mr-2">
                                    <div className="group relative">
                                        <button className="bg-zinc-800 text-[9px] font-bold p-1.5 rounded uppercase">Ekip ({filters.assignees.length})</button>
                                        <div className="hidden group-hover:block absolute top-full left-0 bg-zinc-900 border border-zinc-800 p-2 rounded-xl w-40 shadow-2xl z-[100]">
                                            {TEAM.map(u => (
                                                <label key={u.id} className="flex items-center gap-2 p-2 hover:bg-white/5 cursor-pointer text-[10px]"><input type="checkbox" checked={filters.assignees.includes(u.id)} onChange={() => toggleFilter('assignees', u.id)} /> {u.name}</label>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="group relative">
                                        <button className="bg-zinc-800 text-[9px] font-bold p-1.5 rounded uppercase">Statü ({filters.statuses.length})</button>
                                        <div className="hidden group-hover:block absolute top-full left-0 bg-zinc-900 border border-zinc-800 p-2 rounded-xl w-40 shadow-2xl z-[100]">
                                            {columns.map(c => (
                                                <label key={c.id} className="flex items-center gap-2 p-2 hover:bg-white/5 cursor-pointer text-[10px]"><input type="checkbox" checked={filters.statuses.includes(c.slug)} onChange={() => toggleFilter('statuses', c.slug)} /> {c.title}</label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentView === 'gantt' && (
                                <div className="flex items-center gap-2 bg-zinc-900 p-1 px-3 rounded-full border border-zinc-800 mr-2">
                                    <input type="range" min="15" max="150" value={ganttZoom} onChange={e => setGanttZoom(parseInt(e.target.value))} className="w-20 accent-blue-500 h-1" />
                                </div>
                            )}

                            <div className={`flex p-1 rounded-md ${isDark ? 'bg-black' : 'bg-[#EBECF0]'}`}>
                                <button onClick={() => setTheme('quartz')} className={`px-2 py-1 rounded text-[8px] font-bold ${!isDark ? 'bg-white shadow text-[#0052CC]' : 'text-zinc-500'}`}>QUARTZ</button>
                                <button onClick={() => setTheme('dark')} className={`px-2 py-1 rounded text-[8px] font-bold ${isDark ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}>DARK</button>
                            </div>
                            <button onClick={() => addTask(currentView === 'quick_tasks')} className="bg-[#0052CC] text-white px-4 py-1.5 rounded text-[10px] font-bold shadow-md uppercase">+ TASK</button>
                            <button onClick={() => setIsLoggedIn(false)} className="text-zinc-500 hover:text-red-500 ml-1"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {/* 1. BOARD */}
                        {currentView === 'board' && (
                            <div className="flex h-full p-6 gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { status: col.slug })}>
                                        <div className="mb-4 flex justify-between items-center px-1 opacity-50"><span className="text-[11px] font-black uppercase tracking-widest">{col.title}</span><span className="text-[10px]">{filteredTasks.filter(t => t.status === col.slug).length}</span></div>
                                        <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-1">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} onClick={() => { setSelectedTask(task); fetchComments(task.id); }} className={`p-4 rounded-xl border border-zinc-800 bg-[#1a1a1c] cursor-pointer hover:border-blue-500 transition-all`}>
                                                    <div className="flex flex-wrap gap-1 mb-2">{(task.tags || []).map(tag => <span key={tag} className="text-[8px] bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded font-bold uppercase">{tag}</span>)}</div>
                                                    <p className="text-[13px] font-medium leading-relaxed">{task.text}</p>
                                                    <div className="flex justify-between items-center mt-4">
                                                        <div className="flex -space-x-1.5">{(task.assignee || []).map(id => <div key={id} className={`w-5 h-5 rounded-full border border-zinc-900 flex items-center justify-center text-[7px] font-bold text-white ${TEAM.find(x => x.id === id)?.color}`}>{id}</div>)}</div>
                                                        <span className="text-[9px] opacity-30 font-bold">{task.end_date || ''}</span>
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={() => addTask(false, null, col.slug)} className="w-full py-2 border-2 border-dashed border-zinc-800 rounded-xl text-[10px] font-black opacity-20 hover:opacity-100 transition uppercase">+ ADD</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 2. HIZLI İŞLER (QUICK TASKS) */}
                        {currentView === 'quick_tasks' && (
                            <div className="h-full flex flex-col p-6 overflow-hidden">
                                <div className="flex-1 flex gap-6 overflow-x-auto custom-scrollbar">
                                    {TEAM.map(member => (
                                        <div key={member.id} className="column-width flex flex-col bg-zinc-900/30 rounded-3xl border border-zinc-800/50 p-4" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { assignee: [member.id] })}>
                                            <div className="flex items-center gap-3 mb-6 px-2">
                                                <div className={`w-8 h-8 rounded-full ${member.color} flex items-center justify-center text-[10px] font-black text-white`}>{member.id}</div>
                                                <span className="font-bold text-sm tracking-tight">{member.name.toUpperCase()}</span>
                                                <span className="ml-auto text-[10px] opacity-40">{filteredTasks.filter(t => (t.assignee || []).includes(member.id)).length} İŞ</span>
                                            </div>
                                            <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-1">
                                                {filteredTasks.filter(t => (t.assignee || []).includes(member.id)).map(task => (
                                                    <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} className={`p-4 rounded-2xl bg-[#1a1a1c] border border-zinc-800 transition-all ${task.is_completed ? 'task-completed' : 'hover:border-blue-500/50'}`}>
                                                        <div className="flex items-start gap-3">
                                                            <input type="checkbox" checked={task.is_completed || false} onChange={(e) => updateTask(task.id, { is_completed: e.target.checked })} className="mt-1 w-4 h-4 rounded-full accent-green-500 cursor-pointer" />
                                                            <div className="flex-1" onClick={() => { setSelectedTask(task); fetchComments(task.id); }}>
                                                                <p className="text-sm font-medium mb-2 leading-snug">{task.text}</p>
                                                                <div className="flex items-center gap-2">
                                                                    <span className={`text-[8px] font-black uppercase px-2 py-0.5 rounded ${task.importance === 'Acil' ? 'bg-red-500/10 text-red-500' : task.importance === 'Orta önem düzeyi' ? 'bg-yellow-500/10 text-yellow-500' : 'bg-green-500/10 text-green-500'}`}>{task.importance || 'Düşük'}</span>
                                                                    <span className="text-[8px] opacity-30 font-bold">{task.end_date || ''}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                                <button onClick={() => addTask(true, member.id)} className="w-full py-3 border-2 border-dashed border-zinc-800/50 rounded-2xl text-[10px] font-black opacity-30 hover:opacity-100 transition uppercase">+ EKLE</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. LIST VIEW */}
                        {currentView === 'list' && (
                            <div className="h-full overflow-y-auto p-8 max-w-5xl mx-auto custom-scrollbar">
                                {columns.map(col => {
                                    const colTasks = filteredTasks.filter(t => t.status === col.slug);
                                    if (colTasks.length === 0) return null;
                                    return (
                                        <div key={col.id} className="mb-8">
                                            <div className="text-[11px] font-black uppercase tracking-widest opacity-40 mb-3 border-b border-black/5 pb-2">{col.title}</div>
                                            <div className={`rounded-xl divide-y divide-black/5 ${isDark ? 'bg-[#1a1a1c]' : 'bg-white shadow-sm'}`}>
                                                {colTasks.map(task => (
                                                    <div key={task.id} onClick={() => { setSelectedTask(task); fetchComments(task.id); }} className="p-4 hover:bg-blue-500/5 flex items-center cursor-pointer transition-colors group">
                                                        <span className="flex-1 text-sm font-medium">{task.text}</span>
                                                        <div className="flex -space-x-1 mx-4">{(task.assignee || []).map(id => <div key={id} className={`w-6 h-6 rounded-full border-2 ${isDark ? 'border-[#1a1a1c]' : 'border-white'} ${TEAM.find(x => x.id === id)?.color} text-white text-[8px] flex items-center justify-center font-bold`}>{id}</div>)}</div>
                                                        <span className="text-[10px] opacity-30 font-bold w-24 text-right">{task.end_date || '--'}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* 4. GANTT VIEW */}
                        {currentView === 'gantt' && (
                            <div className="gantt-container h-full">
                                <div className="gantt-main-scroll custom-scrollbar" ref={ganttScrollRef}>
                                    <div className="gantt-timeline-header flex sticky top-0 z-30">
                                        <div className={`gantt-sidebar p-4 font-black text-[10px] uppercase border-r ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-[#EBECF0] border-[#DCDFE4]'}`}>GÖREV LİSTESİ</div>
                                        {ganttDays.map((date, i) => (
                                            <div key={i} className={`day-cell p-2 flex flex-col items-center ${date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : ''} ${isDark ? 'bg-[#1a1a1c]' : 'bg-[#EBECF0]'}`} style={{ width: `${ganttZoom}px`, minWidth: `${ganttZoom}px` }}>
                                                <span className="text-[8px] uppercase opacity-40">{date.toLocaleDateString('tr-TR', { month: 'short' })}</span>
                                                <span className={`text-[11px] font-bold ${new Date().toDateString() === date.toDateString() ? 'text-blue-500' : ''}`}>{date.getDate()}</span>
                                            </div>
                                        ))}
                                    </div>
                                    {filteredTasks.map(task => {
                                        const start = task.start_date ? new Date(task.start_date) : null;
                                        const end = task.end_date ? new Date(task.end_date) : null;
                                        let left = 0, width = 0;
                                        if(start && end) {
                                            left = Math.ceil((start - ganttStartDate) / (1000 * 60 * 60 * 24)) * ganttZoom;
                                            width = (Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1) * ganttZoom;
                                        }
                                        return (
                                            <div key={task.id} className="gantt-grid-row flex items-center group hover:bg-blue-500/5">
                                                <div className={`gantt-sidebar p-3 truncate text-[11px] font-medium border-r ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-[#DCDFE4]'}`}>{task.text}</div>
                                                <div className="flex-1 flex relative h-full min-w-max">
                                                    {ganttDays.map((_, i) => <div key={i} className="day-cell h-full border-r border-black/5" style={{ width: `${ganttZoom}px`, minWidth: `${ganttZoom}px` }}></div>)}
                                                    {width > 0 && (
                                                        <div onClick={() => { setSelectedTask(task); fetchComments(task.id); }} className={`absolute top-2.5 h-7 rounded-md cursor-pointer shadow-md flex items-center px-3 z-20 ${TEAM.find(m => (task.assignee || []).includes(m.id))?.color || 'bg-zinc-500'}`} style={{ left: `${left}px`, width: `${width}px` }}>
                                                            <span className="text-[9px] text-white font-black truncate">{task.text}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 5. SPRINTS VIEW */}
                        {currentView === 'sprints' && (
                            <div className="h-full flex flex-col p-6 overflow-hidden">
                                <div className="flex justify-between items-center mb-6 bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800">
                                    <div className="flex gap-4 items-center">
                                        <select className="bg-zinc-800 border-zinc-700 p-2 rounded-xl text-xs text-white outline-none font-bold" value={activeSprintId || ""} onChange={e => setActiveSprintId(e.target.value)}>
                                            {sprints.map(s => <option key={s.id} value={s.id}>{s.name.toUpperCase()} ({s.start_date} / {s.end_date})</option>)}
                                        </select>
                                        <button onClick={autoGenerateSprints} className="bg-blue-600/10 text-blue-400 text-[9px] font-black px-3 py-1 rounded-lg border border-blue-500/20 uppercase">+ OTOMATİK SPRINT</button>
                                    </div>
                                    <button onClick={resetSprints} className="text-red-500 text-[9px] font-black uppercase tracking-widest bg-red-500/10 px-3 py-1 border border-red-500/20 rounded-lg hover:bg-red-500 hover:text-white transition-all">SIFIRLA</button>
                                </div>
                                <div className="flex-1 flex gap-6 overflow-hidden">
                                    <div className={`flex-1 flex flex-col rounded-3xl p-6 ${isDark ? 'bg-[#121214]' : 'bg-zinc-200'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 opacity-40 italic tracking-widest">Backlog</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => !t.sprint_id).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center border border-transparent hover:border-blue-500/50 transition-all ${isDark ? 'bg-[#1c1c1e]' : 'bg-white shadow-sm'}`}>
                                                    <span className="text-sm font-medium">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: activeSprintId })} className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-black uppercase">Ekle</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className={`flex-1 flex flex-col rounded-3xl p-6 border-2 ${isDark ? 'bg-[#1a1a1c] border-blue-900/30' : 'bg-blue-50 border-blue-200'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 text-blue-500 italic tracking-widest">Aktif Sprint</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => t.sprint_id == activeSprintId).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center border border-blue-500/20 ${isDark ? 'bg-[#242427]' : 'bg-white shadow-md'}`}>
                                                    <span className="text-sm font-medium text-blue-400">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: null })} className="text-zinc-500 hover:text-red-500 text-[9px] font-black uppercase">Geri Çek</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* SHARED MODAL */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className={`${isDark ? 'bg-[#141416]' : 'bg-white'} w-full max-w-2xl h-full shadow-2xl p-10 flex flex-col overflow-y-auto animate-in slide-in-from-right`}>
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-[10px] font-black text-blue-500 uppercase italic tracking-widest">Detay Paneli</span>
                                    <div className="flex gap-4">
                                        <button onClick={async () => { if(confirm("Silinsin mi?")) { await supabase.from('tasks').delete().eq('id', selectedTask.id); setSelectedTask(null); fetchData(); } }} className="text-zinc-600 hover:text-red-500"><i className="fas fa-trash"></i></button>
                                        <button onClick={() => setSelectedTask(null)} className="text-2xl hover:text-red-500">✕</button>
                                    </div>
                                </div>
                                <input className="text-2xl font-bold bg-transparent border-b border-black/5 outline-none w-full mb-8 pb-2" defaultValue={selectedTask.text} onBlur={e => updateTask(selectedTask.id, { text: e.target.value })} />
                                
                                <div className="space-y-8">
                                    <div className="grid grid-cols-2 gap-6">
                                        <div><label className="text-[10px] font-black opacity-30 uppercase block mb-2">Başlangıç</label><input type="date" value={selectedTask.start_date || ""} onChange={e => updateTask(selectedTask.id, { start_date: e.target.value })} className="w-full bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl text-xs outline-none" /></div>
                                        <div><label className="text-[10px] font-black opacity-30 uppercase block mb-2">Bitiş</label><input type="date" value={selectedTask.end_date || ""} onChange={e => updateTask(selectedTask.id, { end_date: e.target.value })} className="w-full bg-zinc-900/50 border border-zinc-800 p-3 rounded-xl text-xs outline-none" /></div>
                                    </div>

                                    {/* Önem Derecesi */}
                                    <div>
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-3">Önem Derecesi</label>
                                        <div className="flex gap-2">
                                            {IMPORTANCE_LEVELS.map(level => (
                                                <button key={level} onClick={() => updateTask(selectedTask.id, { importance: level })} className={`px-4 py-2 rounded-xl text-[10px] font-bold border transition-all ${selectedTask.importance === level ? 'bg-orange-600 text-white border-transparent' : 'border-zinc-800 text-zinc-500'}`}>{level}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-3">Sorumlu Ekip</label>
                                        <div className="flex gap-2">
                                            {TEAM.map(u => {
                                                const active = (selectedTask.assignee || []).includes(u.id);
                                                return <button key={u.id} onClick={() => {
                                                    const cur = selectedTask.assignee || [];
                                                    const next = cur.includes(u.id) ? cur.filter(x => x !== u.id) : [...cur, u.id];
                                                    updateTask(selectedTask.id, { assignee: next });
                                                }} className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all border ${active ? `${u.color} text-white border-transparent shadow-lg` : 'border-zinc-800 text-zinc-500 hover:border-zinc-600'}`}>{u.id}</button>
                                            })}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-3">Etiketler</label>
                                        <div className="flex flex-wrap gap-2 mb-3">
                                            {(selectedTask.tags || []).map(tag => (
                                                <span key={tag} className="bg-blue-500/10 text-blue-500 px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-2">{tag} <i className="fas fa-times cursor-pointer" onClick={() => updateTask(selectedTask.id, { tags: selectedTask.tags.filter(t => t !== tag) })}></i></span>
                                            ))}
                                        </div>
                                        <div className="flex gap-2 items-center flex-wrap">
                                            {globalTags.filter(t => !(selectedTask.tags || []).includes(t)).map(t => (
                                                <button key={t} onClick={() => updateTask(selectedTask.id, { tags: [...(selectedTask.tags || []), t] })} className="text-[9px] bg-zinc-800 px-2 py-1 rounded hover:bg-blue-500 font-bold">{t}</button>
                                            ))}
                                            <input type="text" placeholder="+ Yeni Etiket" className="bg-transparent border-b border-zinc-800 text-xs outline-none p-1 w-24" onKeyDown={e => {
                                                if(e.key === 'Enter' && e.target.value) { updateTask(selectedTask.id, { tags: [...(selectedTask.tags || []), e.target.value.trim()] }); e.target.value = ""; }
                                            }} />
                                        </div>
                                    </div>

                                    <div className="pt-8 border-t border-zinc-900">
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-6 italic">Yorumlar</label>
                                        <div className="space-y-4 mb-6">
                                            {comments.map(c => (
                                                <div key={c.id} className="flex gap-3">
                                                    <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[9px] font-bold text-white flex-shrink-0 ${TEAM.find(t => t.id === c.user_id)?.color}`}>{c.user_id}</div>
                                                    <div className="bg-zinc-900/40 p-3 rounded-2xl border border-zinc-800 flex-1 text-sm">{c.text}</div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="bg-zinc-900 p-3 rounded-2xl border border-zinc-800">
                                            <textarea id="commInput" className="w-full bg-transparent outline-none text-sm min-h-[50px] resize-none" placeholder="Yaz..."></textarea>
                                            <div className="flex gap-2 mt-2">
                                                {TEAM.map(u => <button key={u.id} onClick={async () => { 
                                                    const val = document.getElementById('commInput').value;
                                                    if(val) { await supabase.from('comments').insert([{task_id: selectedTask.id, text: val, user_id: u.id}]); document.getElementById('commInput').value = ""; fetchComments(selectedTask.id); }
                                                }} className={`${u.color} text-white text-[8px] px-2 py-1 rounded-full font-bold uppercase`}>{u.id}</button>)}
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setSelectedTask(null)} className="w-full bg-blue-600 text-white p-4 rounded-2xl font-black text-xs shadow-xl hover:bg-blue-700 transition-all uppercase">Kaydet ve Kapat</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

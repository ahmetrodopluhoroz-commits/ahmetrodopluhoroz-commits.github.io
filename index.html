<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG HUB | 2026 Crystal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; background-color: #F4F5F7; color: #172B4D; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(9, 30, 66, 0.54); backdrop-filter: blur(4px); z-index: 100; }
        
        /* Crystal Quartz Components */
        .quartz-card { background-color: #FFFFFF; border: 1px solid #EBECF0; box-shadow: 0 1px 2px 0 rgba(9, 30, 66, 0.25); transition: all 0.2s ease; }
        .quartz-card:hover { box-shadow: 0 4px 8px -2px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31); }
        .quartz-input { background-color: #FAFBFC; border: 2px solid #DFE1E6; border-radius: 8px; padding: 10px 14px; outline: none; transition: all 0.2s; color: #172B4D; font-weight: 500; }
        .quartz-input:focus { background-color: #FFFFFF; border-color: #4C9AFF; box-shadow: 0 0 0 2px rgba(76, 154, 255, 0.2); }
        .view-active { border-bottom: 3px solid #0052CC; color: #0052CC; font-weight: 800; opacity: 1 !important; }
        .task-completed { opacity: 0.5; text-decoration: line-through; filter: grayscale(1); }
        
        /* Gantt Mimarisi */
        .gantt-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; background: #fff; }
        .gantt-main-scroll { flex: 1; overflow-x: auto; overflow-y: auto; }
        .gantt-timeline-header { display: flex; position: sticky; top: 0; z-index: 50; background: #EBECF0; border-bottom: 1px solid #DCDFE4; }
        .gantt-sidebar { width: 280px; flex-shrink: 0; position: sticky; left: 0; z-index: 60; border-right: 1px solid #DCDFE4; background: #EBECF0; color: #42526E; font-weight: 800; }
        .day-cell { flex-shrink: 0; text-align: center; border-right: 1px solid rgba(0,0,0,0.05); height: 100%; }
        .gantt-grid-row { display: flex; min-height: 48px; border-bottom: 1px solid #EBECF0; align-items: center; background: #fff; }
        .weekend { background-color: #F4F5F7; }

        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SUPABASE BAĞLANTISI ---
        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-[#FF8B00]' },
            { id: 'YE', name: 'Yiğit', color: 'bg-[#6554C0]' },
            { id: 'RASG', name: 'RASG', color: 'bg-[#42526E]' }
        ];

        const IMPORTANCE_LEVELS = ["Acil", "Orta önem düzeyi", "Düşük önem düzeyi"];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [comments, setComments] = useState([]);
            const [activeSprintId, setActiveSprintId] = useState(null);
            
            const [currentView, setCurrentView] = useState('board');
            const [selectedTask, setSelectedTask] = useState(null);
            const [draggedTaskId, setDraggedTaskId] = useState(null);

            // Filtreler & Zoom
            const [filters, setFilters] = useState({ assignees: [], tags: [], statuses: [] });
            const [ganttZoom, setGanttZoom] = useState(45);
            const ganttScrollRef = useRef(null);

            const fetchData = async () => {
                const { data: tsk } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: spr } = await supabase.from('sprints').select('*').order('start_date');
                setTasks(tsk || []); setColumns(cols || []); setSprints(spr || []);
                if (spr?.length > 0 && !activeSprintId) setActiveSprintId(spr[0].id);
            };

            const fetchComments = async (tid) => {
                const { data } = await supabase.from('comments').select('*').eq('task_id', tid).order('created_at');
                setComments(data || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            // --- GANTT AYARLARI (Aralık 2025 - Ocak 2027) ---
            const ganttStartDate = new Date(2025, 11, 1);
            const ganttEndDate = new Date(2027, 0, 31);
            const ganttDays = useMemo(() => {
                const days = []; let current = new Date(ganttStartDate);
                while (current <= ganttEndDate) { days.push(new Date(current)); current.setDate(current.getDate() + 1); }
                return days;
            }, []);

            useEffect(() => {
                if(currentView === 'gantt' && ganttScrollRef.current) {
                    const today = new Date();
                    const diff = Math.floor((today - ganttStartDate) / (1000 * 60 * 60 * 24));
                    if(diff > 0) ganttScrollRef.current.scrollLeft = (diff * ganttZoom) - 200;
                }
            }, [currentView, ganttZoom]);

            const filteredTasks = useMemo(() => {
                return tasks.filter(t => {
                    if (currentView === 'quick_tasks') return t.is_quick === true;
                    if (t.is_quick) return false;
                    const matchA = filters.assignees.length === 0 || (t.assignee || []).some(a => filters.assignees.includes(a));
                    const matchS = filters.statuses.length === 0 || filters.statuses.includes(t.status);
                    const matchT = filters.tags.length === 0 || (t.tags || []).some(tag => filters.tags.includes(tag));
                    return matchA && matchS && matchT;
                });
            }, [tasks, filters, currentView]);

            const globalTags = useMemo(() => {
                const tags = new Set(); tasks.forEach(t => (t.tags || []).forEach(tag => tags.add(tag)));
                return Array.from(tags);
            }, [tasks]);

            const updateTask = async (id, updates) => { await supabase.from('tasks').update(updates).eq('id', id); fetchData(); if(selectedTask?.id === id) setSelectedTask(p=>({...p, ...updates})); };
            
            const addTask = async (isQ = false, aid = null, cslug = null) => {
                const text = prompt("İş Başlığı:"); if(!text) return;
                await supabase.from('tasks').insert([{ text, is_quick: isQ, assignee: aid ? [aid] : [], status: cslug || columns[0]?.slug || 'todo' }]);
                fetchData();
            };

            const toggleFilter = (type, val) => setFilters(p => ({ ...p, [type]: p[type].includes(val) ? p[type].filter(v => v !== val) : [...p[type], val] }));

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#091E42]">
                        <div className="bg-white p-10 rounded-[32px] w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-2xl font-black mb-8 italic uppercase tracking-tighter text-[#172B4D]">RASG HUB 2026</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hatalı!"); }} className="space-y-4 text-left">
                                <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Kullanıcı</label>
                                <input type="text" placeholder="RASG" onChange={e => setUsername(e.target.value)} className="quartz-input w-full" /></div>
                                <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Şifre</label>
                                <input type="password" placeholder="••••" onChange={e => setPassword(e.target.value)} className="quartz-input w-full" /></div>
                                <button className="w-full bg-[#0052CC] p-4 rounded-xl font-black text-white uppercase tracking-widest hover:bg-[#0747A6] transition shadow-lg mt-4">GİRİŞ YAP</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col">
                    {/* GLOBAL HEADER */}
                    <header className="p-4 bg-white border-b border-[#DCDFE4] flex flex-wrap justify-between items-center z-50 shadow-sm">
                        <div className="flex items-center gap-8">
                            <h1 className="font-black italic text-lg text-[#172B4D]">RASG 2026</h1>
                            <div className="flex gap-5 text-[11px] font-bold uppercase tracking-widest text-[#5E6C84]">
                                {['board', 'quick_tasks', 'list', 'gantt', 'sprints'].map(v => (
                                    <button key={v} onClick={() => setCurrentView(v)} className={`pb-1 transition-all opacity-60 hover:opacity-100 ${currentView === v ? 'view-active' : ''}`}>{v.replace('_',' ')}</button>
                                ))}
                            </div>
                        </div>
                        <div className="flex gap-3 items-center">
                            {currentView !== 'quick_tasks' && (
                                <div className="group relative">
                                    <button className="bg-[#EBECF0] text-[9px] font-black p-2 px-4 rounded-full uppercase text-[#42526E]">Ekip Filtresi ({filters.assignees.length})</button>
                                    <div className="hidden group-hover:block absolute top-full left-0 bg-white border border-[#DCDFE4] p-2 rounded-xl w-40 shadow-2xl z-[100]">
                                        {TEAM.map(u => <label key={u.id} className="flex items-center gap-2 p-2 hover:bg-[#F4F5F7] cursor-pointer text-[10px] font-bold text-[#172B4D]"><input type="checkbox" checked={filters.assignees.includes(u.id)} onChange={() => toggleFilter('assignees', u.id)} /> {u.name}</label>)}
                                    </div>
                                </div>
                            )}
                            {currentView === 'gantt' && <input type="range" min="15" max="150" value={ganttZoom} onChange={e => setGanttZoom(parseInt(e.target.value))} className="w-20 accent-[#0052CC] mr-4 h-1" />}
                            <button onClick={()=>addTask(currentView==='quick_tasks')} className="bg-[#0052CC] text-white px-5 py-2 rounded-lg text-[10px] font-black uppercase shadow-md hover:bg-[#0747A6]">+ TASK</button>
                            <button onClick={() => setIsLoggedIn(false)} className="ml-2 text-[#42526E] hover:text-[#DE350B] transition-all"><i className="fas fa-sign-out-alt text-lg"></i></button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {/* 1. BOARD VIEW */}
                        {currentView === 'board' && (
                            <div className="flex h-full p-6 gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { status: col.slug })}>
                                        <div className="mb-5 flex justify-between items-center px-1 font-black text-[11px] uppercase text-[#5E6C84] tracking-widest opacity-80">
                                            <span>{col.title}</span><span className="bg-[#EBECF0] px-2 py-0.5 rounded-full">{filteredTasks.filter(t => t.status === col.slug).length}</span>
                                        </div>
                                        <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-1">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} onClick={() => { setSelectedTask(task); fetchComments(task.id); }} className="p-4 rounded-xl quartz-card cursor-pointer">
                                                    <div className="flex flex-wrap gap-1 mb-2">{(task.tags || []).map(tag => <span key={tag} className="text-[8px] bg-[#DEEBFF] text-[#0052CC] px-2 py-0.5 rounded font-black uppercase">{tag}</span>)}</div>
                                                    <p className="text-[14px] font-semibold text-[#172B4D] leading-relaxed">{task.text}</p>
                                                    <div className="flex justify-between items-center mt-5 pt-3 border-t border-[#EBECF0]">
                                                        <div className="flex -space-x-1.5">{(task.assignee || []).map(id => <div key={id} className={`w-6 h-6 rounded-full border-2 border-white flex items-center justify-center text-[8px] font-black text-white ${TEAM.find(x => x.id === id)?.color}`}>{id}</div>)}</div>
                                                        <span className="text-[10px] font-bold text-[#5E6C84]">{task.end_date}</span>
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={() => addTask(false, null, col.slug)} className="w-full py-3 border-2 border-dashed border-[#DFE1E6] rounded-xl text-[10px] font-black text-[#8993A4] hover:text-[#0052CC] uppercase transition-all">+ EKLE</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* 2. HIZLI İŞLER (QUICK TASKS) */}
                        {currentView === 'quick_tasks' && (
                            <div className="h-full flex flex-col p-6 overflow-hidden">
                                <div className="flex-1 flex gap-6 overflow-x-auto custom-scrollbar">
                                    {TEAM.map(member => (
                                        <div key={member.id} className="column-width flex flex-col bg-[#EBECF0]/40 rounded-[24px] border border-[#DFE1E6] p-5" onDragOver={e => e.preventDefault()} onDrop={() => draggedTaskId && updateTask(draggedTaskId, { assignee: [member.id] })}>
                                            <div className="flex items-center gap-3 mb-6 px-1"><div className={`w-9 h-9 rounded-full ${member.color} flex items-center justify-center text-[11px] font-black text-white shadow-lg`}>{member.id}</div><span className="font-black text-sm text-[#172B4D] tracking-tight">{member.name.toUpperCase()}</span></div>
                                            <div className="flex-1 space-y-3 overflow-y-auto pr-1">
                                                {filteredTasks.filter(t => (t.assignee || []).includes(member.id)).map(task => (
                                                    <div key={task.id} draggable onDragStart={() => setDraggedTaskId(task.id)} className={`p-4 rounded-xl bg-white border border-[#DFE1E6] shadow-sm transition-all ${task.is_completed ? 'task-completed' : 'hover:border-[#0052CC]'}`}>
                                                        <div className="flex items-start gap-3">
                                                            <input type="checkbox" checked={task.is_completed} onChange={e => updateTask(task.id, { is_completed: e.target.checked })} className="mt-1 w-4 h-4 rounded-full accent-[#36B37E] cursor-pointer" />
                                                            <div className="flex-1" onClick={() => { setSelectedTask(task); fetchComments(task.id); }}><p className="text-[14px] font-bold text-[#172B4D]">{task.text}</p></div>
                                                        </div>
                                                    </div>
                                                ))}
                                                <button onClick={() => addTask(true, member.id)} className="w-full py-4 border-2 border-dashed border-[#DFE1E6] rounded-xl text-[10px] font-black text-[#8993A4] hover:text-[#0052CC] transition uppercase tracking-widest">+ HIZLI İŞ EKLE</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. GANTT VIEW */}
                        {currentView === 'gantt' && (
                            <div className="gantt-container h-full">
                                <div className="gantt-main-scroll custom-scrollbar" ref={ganttScrollRef}>
                                    <div className="gantt-timeline-header flex sticky top-0 z-30 shadow-sm">
                                        <div className="gantt-sidebar p-4 font-black text-[11px] uppercase border-r border-[#DCDFE4]">PROJE GÖREVLERİ</div>
                                        {ganttDays.map((date, i) => {
                                            const isToday = new Date().toDateString() === date.toDateString();
                                            return (
                                                <div key={i} className={`day-cell p-2 flex flex-col items-center ${date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : ''}`} style={{ width: ganttZoom, minWidth: ganttZoom }}>
                                                    <span className="text-[8px] uppercase font-bold text-[#5E6C84]">{date.toLocaleDateString('tr-TR', { month: 'short' })}</span>
                                                    <span className={`text-[12px] font-black ${isToday ? 'text-[#0052CC]' : 'text-[#172B4D]'}`}>{date.getDate()}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    {filteredTasks.map(task => {
                                        const start = task.start_date ? new Date(task.start_date) : null;
                                        const end = task.end_date ? new Date(task.end_date) : null;
                                        let left = 0, width = 0;
                                        if(start && end) {
                                            left = Math.ceil((start - ganttStartDate) / (1000 * 60 * 60 * 24)) * ganttZoom;
                                            width = (Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1) * ganttZoom;
                                        }
                                        return (
                                            <div key={task.id} className="gantt-grid-row flex group hover:bg-[#F4F5F7]">
                                                <div className="gantt-sidebar p-3 truncate text-[12px] font-bold text-[#172B4D] border-r border-[#DCDFE4]">{task.text}</div>
                                                <div className="flex-1 flex relative h-full min-w-max">
                                                    {ganttDays.map((_, i) => <div key={i} className="day-cell h-full border-r border-black/[0.03]" style={{ width: ganttZoom, minWidth: ganttZoom }}></div>)}
                                                    {width > 0 && <div onClick={()=>{setSelectedTask(task); fetchComments(task.id);}} className={`absolute top-2.5 h-7 rounded-md cursor-pointer shadow-md flex items-center px-3 z-20 ${TEAM.find(m => (task.assignee || []).includes(m.id))?.color || 'bg-slate-400'}`} style={{ left, width }}><span className="text-[10px] text-white font-black truncate">{task.text}</span></div>}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}
                        {/* List ve Sprints sekmeleri arka planda filtreleme ile senkronizedir. */}
                    </main>

                    {/* SHARED MODAL */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className="bg-white w-full max-w-xl h-full shadow-2xl p-10 flex flex-col overflow-y-auto animate-in slide-in-from-right duration-200">
                                <div className="flex justify-between items-center mb-8">
                                    <span className="text-[11px] font-black text-[#0052CC] uppercase tracking-widest italic opacity-60">GÖREV AYRINTILARI</span>
                                    <div className="flex gap-4">
                                        <button onClick={async()=>{if(confirm("Silinsin mi?")){await supabase.from('tasks').delete().eq('id',selectedTask.id); setSelectedTask(null); fetchData();}}} className="text-[#DE350B] hover:scale-110 transition-all"><i className="fas fa-trash-alt text-xl"></i></button>
                                        <button onClick={()=>setSelectedTask(null)} className="text-[#42526E] hover:text-black transition-all"><i className="fas fa-times text-2xl"></i></button>
                                    </div>
                                </div>
                                <textarea className="text-3xl font-black bg-transparent border-b-2 border-[#EBECF0] outline-none w-full mb-10 pb-2 text-[#172B4D] focus:border-[#4C9AFF] transition-colors" defaultValue={selectedTask.text} onBlur={e=>updateTask(selectedTask.id, {text: e.target.value})} />
                                <div className="space-y-10">
                                    <div className="grid grid-cols-2 gap-8">
                                        <div><label className="text-[10px] font-black text-[#5E6C84] uppercase block mb-3">BAŞLANGIÇ</label><input type="date" value={selectedTask.start_date || ""} onChange={e=>updateTask(selectedTask.id, {start_date: e.target.value})} className="quartz-input w-full font-bold text-sm" /></div>
                                        <div><label className="text-[10px] font-black text-[#5E6C84] uppercase block mb-3">BİTİŞ</label><input type="date" value={selectedTask.end_date || ""} onChange={e=>updateTask(selectedTask.id, {end_date: e.target.value})} className="quartz-input w-full font-bold text-sm" /></div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black text-[#5E6C84] uppercase block mb-4 tracking-widest">Sorumlu Ekip Üyeleri</label>
                                        <div className="flex gap-3">
                                            {TEAM.map(u=><button key={u.id} onClick={()=>{const cur=selectedTask.assignee||[]; const next=cur.includes(u.id)?cur.filter(x=>x!==u.id):[...cur,u.id]; updateTask(selectedTask.id,{assignee:next});}} className={`px-5 py-2.5 rounded-xl text-[11px] font-black border-2 transition-all ${selectedTask.assignee?.includes(u.id)?`${u.color} border-transparent text-white shadow-lg`:'border-[#DFE1E6] text-[#42526E] hover:bg-[#F4F5F7]'}`}>{u.id}</button>)}
                                        </div>
                                    </div>
                                    <div className="pt-10 border-t border-[#EBECF0]">
                                        <button onClick={()=>setSelectedTask(null)} className="w-full bg-[#0052CC] text-white p-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl hover:bg-[#0747A6] transition-all">DEĞİŞİKLİKLERİ KAYDET VE KAPAT</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

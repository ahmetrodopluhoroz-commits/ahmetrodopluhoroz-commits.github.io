<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | Proje Yönetim Sistemi 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0c0c0e',
                            card: '#1a1a1c',
                            border: '#27272a',
                            text: '#d1d1d1',
                            muted: '#71717a'
                        },
                        brand: {
                            purple: '#7c3aed',
                            blue: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0c0e; font-family: 'Inter', sans-serif; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 300px; width: 300px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.75); }
    </style>
</head>
<body class="text-dark-text">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- API BİLGİLERİNİZİ BURAYA YAPIŞTIRIN ---
        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- SABİTLER ---
        const USERS = [
            { id: 'AR', color: 'bg-orange-500' },
            { id: 'YE', color: 'bg-blue-500' },
            { id: 'BD', color: 'bg-purple-500' }
        ];
        const PRIORITIES = [
            { id: 'Urgent', color: 'text-red-500', icon: 'fa-flag' },
            { id: 'High', color: 'text-orange-500', icon: 'fa-flag' },
            { id: 'Normal', color: 'text-blue-400', icon: 'fa-flag' },
            { id: 'Low', color: 'text-gray-400', icon: 'fa-flag' }
        ];
        const COLUMNS = [
            { id: 'todo', title: 'TO DO', dot: '#4b5563' },
            { id: 'yapilacak', title: 'YAPILACAK', dot: '#d1d5db' },
            { id: 'calisiliyor', title: 'ÇALIŞILIYOR', dot: '#7c3aed' },
            { id: 'beklemede', title: 'BEKLEMEDE', dot: '#d97706' },
            { id: 'guncelleme', title: 'GÜNCELLEME GEREKLİ', dot: '#ca8a04' },
            { id: 'tamamlandi', title: 'TAMAMLANDI', dot: '#14b8a6' }
        ];

        // --- YARDIMCI BİLEŞENLER ---
        const UserAvatar = ({ userId, size = 'sm' }) => {
            const user = USERS.find(u => u.id === userId) || USERS[0];
            const sizeClasses = size === 'sm' ? 'w-6 h-6 text-[9px]' : 'w-8 h-8 text-xs';
            return (
                <div className={`${sizeClasses} ${user.color} rounded-full flex items-center justify-center text-white font-bold border border-white/10`}>
                    {userId}
                </div>
            );
        };

        const PriorityIcon = ({ priority }) => {
            const prio = PRIORITIES.find(p => p.id === priority) || PRIORITIES[2];
            return <i className={`fas ${prio.icon} ${prio.color}`}></i>;
        };

        // --- ANA UYGULAMA ---
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [tasks, setTasks] = useState([]);
            const [selectedTask, setSelectedTask] = useState(null);
            const [subtasks, setSubtasks] = useState([]);
            const [loading, setLoading] = useState(false);

            // --- VERİ ÇEKME ---
            const fetchTasks = async () => {
                setLoading(true);
                const { data, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: true });
                if (!error) setTasks(data);
                setLoading(false);
            };

            const fetchSubtasks = async (taskId) => {
                const { data } = await supabaseClient.from('subtasks').select('*').eq('parent_id', taskId).order('created_at');
                setSubtasks(data || []);
            };

            useEffect(() => { if (isLoggedIn) fetchTasks(); }, [isLoggedIn]);

            // --- GÖREV İŞLEMLERİ ---
            const addTask = async (status = 'todo') => {
                const text = prompt("Yeni Görev Başlığı:");
                if (!text) return;
                const newTask = { text, status, assignee: 'AR', priority: 'Normal', date: new Date().toLocaleDateString('tr-TR') };
                const { error } = await supabaseClient.from('tasks').insert([newTask]);
                if (!error) fetchTasks();
            };

            const updateTask = async (id, updates) => {
                const { error } = await supabaseClient.from('tasks').update(updates).eq('id', id);
                if (!error) {
                    fetchTasks();
                    if (selectedTask && selectedTask.id === id) {
                        setSelectedTask({ ...selectedTask, ...updates });
                    }
                }
            };

             const deleteTask = async (id) => {
                if (confirm("Bu görevi ve tüm alt görevlerini silmek istediğinize emin misiniz?")) {
                    await supabaseClient.from('tasks').delete().eq('id', id);
                    fetchTasks();
                    setSelectedTask(null);
                }
            };

            // --- ALT GÖREV İŞLEMLERİ ---
            const addSubtask = async (parentId, text) => {
                if (!text.trim()) return;
                const { error } = await supabaseClient.from('subtasks').insert([{ parent_id: parentId, text, assignee: 'AR' }]);
                if (!error) fetchSubtasks(parentId);
            };

            const toggleSubtask = async (subtaskId, currentStatus) => {
                const { error } = await supabaseClient.from('subtasks').update({ is_completed: !currentStatus }).eq('id', subtaskId);
                if (!error) fetchSubtasks(selectedTask.id);
            };

             const deleteSubtask = async (subtaskId) => {
                const { error } = await supabaseClient.from('subtasks').delete().eq('id', subtaskId);
                if (!error) fetchSubtasks(selectedTask.id);
            };


            // --- GİRİŞ EKRANI ---
            if (!isLoggedIn) {
                 return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <div className="bg-dark-card p-10 rounded-xl border border-dark-border w-full max-w-sm shadow-2xl text-center">
                            <h2 className="text-3xl font-bold text-white mb-8 tracking-tight">RASG GİRİŞ</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if (username === "RASG" && password === "RASG2026") setIsLoggedIn(true); else alert("Hatalı Giriş!"); }} className="space-y-5">
                                <input type="text" placeholder="Kullanıcı Adı" onChange={e => setUsername(e.target.value)} className="w-full p-4 bg-zinc-900 border border-dark-border rounded-lg outline-none focus:border-brand-purple transition-all"/>
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-zinc-900 border border-dark-border rounded-lg outline-none focus:border-brand-purple transition-all"/>
                                <button className="w-full bg-brand-purple p-4 rounded-lg font-bold text-white hover:bg-purple-700 transition">Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- GÖREV DETAY MODALI ---
            const TaskModal = () => {
                if (!selectedTask) return null;
                const [newSubtaskText, setNewSubtaskText] = useState("");
                const descriptionRef = useRef(null);

                useEffect(() => fetchSubtasks(selectedTask.id), [selectedTask]);

                return (
                    <div className="fixed inset-0 modal-overlay flex justify-end z-50 animate-in fade-in duration-200">
                        <div className="w-full max-w-4xl bg-dark-card h-full border-l border-dark-border shadow-2xl flex flex-col animate-in slide-in-from-right duration-300">
                            {/* Modal Header */}
                            <div className="p-4 border-b border-dark-border flex justify-between items-center bg-[#141416]">
                                <div className="flex items-center gap-2 text-dark-muted hover:text-white cursor-pointer" onClick={() => setSelectedTask(null)}>
                                    <i className="fas fa-chevron-right"></i>
                                    <span className="text-sm">Back to Board</span>
                                </div>
                                <div className="flex gap-4 text-dark-muted">
                                     <button onClick={() => deleteTask(selectedTask.id)} className="hover:text-red-500 transition"><i className="fas fa-trash"></i></button>
                                     <button onClick={() => setSelectedTask(null)} className="hover:text-white transition"><i className="fas fa-times text-lg"></i></button>
                                </div>
                            </div>

                            {/* Modal Content */}
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-8 bg-dark-bg">
                                {/* Title */}
                                <input 
                                    type="text" 
                                    defaultValue={selectedTask.text}
                                    onBlur={(e) => updateTask(selectedTask.id, { text: e.target.value })}
                                    className="text-3xl font-bold bg-transparent outline-none text-white w-full mb-8"
                                />

                                {/* Properties Grid */}
                                <div className="grid grid-cols-4 gap-6 mb-8 text-sm">
                                    <div className="text-dark-muted flex items-center gap-2"><i className="far fa-circle-dot"></i> Status</div>
                                    <div className="col-span-3">
                                        <select 
                                            value={selectedTask.status}
                                            onChange={(e) => updateTask(selectedTask.id, { status: e.target.value })}
                                            className="bg-dark-card border border-dark-border rounded px-3 py-1.5 outline-none cursor-pointer hover:border-dark-muted"
                                        >
                                            {COLUMNS.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                                        </select>
                                    </div>

                                    <div className="text-dark-muted flex items-center gap-2"><i className="far fa-user"></i> Assignees</div>
                                    <div className="col-span-3 flex gap-1">
                                        <UserAvatar userId={selectedTask.assignee} size="md" />
                                        <div className="w-8 h-8 rounded-full border-2 border-dashed border-dark-border flex items-center justify-center text-dark-muted hover:text-white cursor-pointer">
                                            <i className="fas fa-plus text-xs"></i>
                                        </div>
                                    </div>

                                    <div className="text-dark-muted flex items-center gap-2"><i className="far fa-flag"></i> Priority</div>
                                    <div className="col-span-3 flex items-center gap-2 cursor-pointer hover:bg-dark-card p-1 rounded -ml-1">
                                        <PriorityIcon priority={selectedTask.priority} />
                                        <span>{selectedTask.priority}</span>
                                    </div>

                                     <div className="text-dark-muted flex items-center gap-2"><i className="far fa-calendar"></i> Due Date</div>
                                    <div className="col-span-3 text-dark-muted hover:text-white cursor-pointer">
                                        {selectedTask.due_date ? new Date(selectedTask.due_date).toLocaleDateString() : 'Empty'}
                                    </div>
                                </div>

                                {/* Description */}
                                <div className="mb-8 group">
                                    <div className="flex items-center gap-2 text-dark-muted mb-2">
                                        <i className="fas fa-align-left"></i> Description
                                    </div>
                                    <textarea 
                                        ref={descriptionRef}
                                        defaultValue={selectedTask.description}
                                        placeholder="Add description, or type '/' for commands"
                                        onBlur={(e) => updateTask(selectedTask.id, { description: e.target.value })}
                                        className="w-full bg-dark-card border border-dark-border rounded-lg p-4 min-h-[150px] outline-none focus:border-dark-muted transition resize-none custom-scrollbar"
                                    />
                                </div>

                                {/* Subtasks */}
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <div className="flex items-center gap-2 font-bold text-white">
                                            <i className="fas fa-list-check text-brand-purple"></i> Subtasks ({subtasks.filter(s => s.is_completed).length}/{subtasks.length})
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-1 mb-4">
                                        {subtasks.map(subtask => (
                                            <div key={subtask.id} className="group flex items-center justify-between p-2 hover:bg-dark-card rounded transition">
                                                <div className="flex items-center gap-3">
                                                    <div onClick={() => toggleSubtask(subtask.id, subtask.is_completed)} className={`w-4 h-4 rounded-full border cursor-pointer flex items-center justify-center ${subtask.is_completed ? 'bg-brand-purple border-brand-purple' : 'border-dark-muted hover:border-brand-purple'}`}>
                                                        {subtask.is_completed && <i className="fas fa-check text-[8px] text-white"></i>}
                                                    </div>
                                                    <span className={subtask.is_completed ? 'line-through text-dark-muted' : ''}>{subtask.text}</span>
                                                </div>
                                                <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition">
                                                    <UserAvatar userId={subtask.assignee} />
                                                    <button onClick={() => deleteSubtask(subtask.id)} className="text-dark-muted hover:text-red-500 p-1"><i className="fas fa-trash text-xs"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); addSubtask(selectedTask.id, newSubtaskText); setNewSubtaskText(""); }} className="flex items-center gap-2 text-dark-muted hover:text-white group">
                                        <i className="fas fa-plus text-sm group-hover:text-brand-purple"></i>
                                        <input 
                                            type="text" 
                                            value={newSubtaskText}
                                            onChange={(e) => setNewSubtaskText(e.target.value)}
                                            placeholder="Add a subtask..."
                                            className="bg-transparent outline-none flex-1 py-2"
                                        />
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- ANA BOARD GÖRÜNÜMÜ ---
            return (
                <div className="h-screen flex flex-col">
                    {/* Header (Aynı kalıyor) */}
                    <header className="bg-dark-card border-b border-dark-border p-4 flex justify-between items-center shadow-md z-10">
                        <div className="flex items-center gap-6">
                            <span className="text-dark-muted font-semibold flex items-center gap-2">
                                <i className="fas fa-layer-group text-brand-purple"></i> 2026-Ortak İş & Proje
                            </span>
                            {/* ... Diğer menü linkleri ... */}
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => addTask()} className="bg-brand-blue hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-bold shadow-lg shadow-blue-900/20 transition-all flex items-center gap-2"><i className="fas fa-plus"></i> TASK</button>
                            <button onClick={() => setIsLoggedIn(false)} className="text-dark-muted hover:text-red-500 transition"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    {/* Board */}
                    <main className="flex-1 flex overflow-x-auto p-6 gap-6 custom-scrollbar bg-dark-bg">
                        {COLUMNS.map(col => {
                            const colTasks = tasks.filter(t => t.status === col.id);
                            return (
                            <div key={col.id} className="column-width flex flex-col">
                                <div className="flex items-center justify-between mb-5 border-b border-dark-border pb-2">
                                    <div className="flex items-center gap-2">
                                        <div style={{backgroundColor: col.dot}} className="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.1)]"></div>
                                        <span className="text-[11px] font-black text-dark-muted uppercase tracking-tighter">{col.title}</span>
                                        <span className="text-dark-muted text-[10px] font-bold bg-[#27272a] px-2 py-0.5 rounded-full">{colTasks.length}</span>
                                    </div>
                                    <button onClick={() => addTask(col.id)} className="text-dark-muted hover:text-white p-1"><i className="fas fa-plus text-xs"></i></button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                                    {colTasks.map(task => (
                                        <div key={task.id} onClick={() => setSelectedTask(task)} className="bg-dark-card border border-dark-border rounded-lg p-4 hover:border-brand-purple transition-all group shadow-sm cursor-pointer relative">
                                            <div className="flex justify-between items-start mb-3">
                                                <p className="text-[13px] text-white leading-snug font-medium line-clamp-2">{task.text}</p>
                                                <UserAvatar userId={task.assignee} />
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 text-dark-muted text-[10px]">
                                                    {task.due_date && <span className="flex items-center gap-1"><i className="far fa-calendar-alt"></i> {new Date(task.due_date).toLocaleDateString('tr-TR', {day: 'numeric', month: 'short'})}</span>}
                                                    <PriorityIcon priority={task.priority} />
                                                </div>
                                                {/* Kart üzerindeki hızlı aksiyonlar (Opsiyonel) */}
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => addTask(col.id)} className="w-full py-2 text-dark-muted hover:text-brand-purple text-xs font-medium border border-dashed border-dark-border rounded-lg hover:border-brand-purple transition-colors flex items-center justify-center gap-2">
                                        <i className="fas fa-plus"></i> Add Task
                                    </button>
                                </div>
                            </div>
                        )})}
                    </main>
                    
                    {/* Görev Detay Modalı */}
                    <TaskModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

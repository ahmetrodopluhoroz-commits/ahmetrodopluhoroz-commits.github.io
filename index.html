<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Ultimate Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0c0c0e; color: #d1d1d1; font-family: 'Inter', sans-serif; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); z-index: 50; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .view-tab-active { border-bottom: 2px solid #7c3aed; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-orange-500' },
            { id: 'BD', name: 'Berkan', color: 'bg-blue-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [selectedTask, setSelectedTask] = useState(null);
            const [subtasks, setSubtasks] = useState([]);
            const [currentView, setCurrentView] = useState('board'); // 'board' veya 'list'
            
            // Filtre State'leri
            const [filterAssignee, setFilterAssignee] = useState('All');
            const [filterTime, setFilterTime] = useState('All');

            const fetchData = async () => {
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: tsk } = await supabase.from('tasks').select('*').order('created_at');
                setColumns(cols || []);
                setTasks(tsk || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            const updateTask = async (taskId, updates) => {
                await supabase.from('tasks').update(updates).eq('id', taskId);
                fetchData();
                if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
            };

            // Filtreleme Mantığı
            const getFilteredTasks = () => {
                let filtered = [...tasks];
                
                // Kişi Filtresi
                if (filterAssignee !== 'All') {
                    filtered = filtered.filter(t => (t.assignee || []).includes(filterAssignee));
                }

                // Zaman Filtresi (Bitiş Tarihine Göre)
                if (filterTime !== 'All') {
                    const now = new Date();
                    const diff = filterTime === 'week' ? 7 : 30;
                    const limit = new Date(now.setDate(now.getDate() + diff));
                    
                    filtered = filtered.filter(t => {
                        if (!t.end_date) return false;
                        const taskDate = new Date(t.end_date);
                        return taskDate <= limit && taskDate >= new Date();
                    });
                }
                return filtered;
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <div className="bg-[#1a1a1c] p-10 rounded-3xl border border-zinc-800 w-full max-w-sm shadow-2xl">
                            <h2 className="text-2xl font-black text-white mb-8 text-center italic uppercase">RASG 2026</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hata!"); }} className="space-y-4">
                                <input type="text" placeholder="Kullanıcı" onChange={e => setUsername(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <button className="w-full bg-purple-600 p-4 rounded-2xl font-bold text-white hover:bg-purple-700 transition shadow-lg">GİRİŞ</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const filteredTasks = getFilteredTasks();

            return (
                <div className="h-screen flex flex-col">
                    {/* Üst Header */}
                    <header className="bg-[#1a1a1c] border-b border-zinc-800 p-4 flex justify-between items-center z-10">
                        <div className="flex items-center gap-6">
                            <h1 className="font-bold text-zinc-100 italic">RASG 2026</h1>
                            <div className="flex gap-4 text-[11px] font-bold uppercase tracking-widest">
                                <button onClick={() => setCurrentView('board')} className={`pb-1 transition-all ${currentView === 'board' ? 'view-tab-active' : 'text-zinc-500'}`}>BOARD</button>
                                <button onClick={() => setCurrentView('list')} className={`pb-1 transition-all ${currentView === 'list' ? 'view-tab-active' : 'text-zinc-500'}`}>LIST</button>
                            </div>
                        </div>
                        <div className="flex gap-3 items-center">
                            {/* Filtreleme Araçları */}
                            <select onChange={(e) => setFilterAssignee(e.target.value)} className="bg-zinc-900 border border-zinc-800 text-[10px] text-zinc-400 px-2 py-1 rounded outline-none focus:border-purple-500">
                                <option value="All">Tüm Kişiler</option>
                                {TEAM.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                            <select onChange={(e) => setFilterTime(e.target.value)} className="bg-zinc-900 border border-zinc-800 text-[10px] text-zinc-400 px-2 py-1 rounded outline-none focus:border-purple-500">
                                <option value="All">Tüm Zamanlar</option>
                                <option value="week">Son 1 Hafta (Bitiş)</option>
                                <option value="month">Son 1 Ay (Bitiş)</option>
                            </select>
                            <button onClick={async () => { const t = prompt("Görev?"); if(t) await supabase.from('tasks').insert([{text:t, status: columns[0].slug}]); fetchData(); }} className="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-lg">+ TASK</button>
                        </div>
                    </header>

                    {/* Ana İçerik */}
                    <main className="flex-1 bg-[#0c0c0e] overflow-hidden">
                        {currentView === 'board' ? (
                            /* BOARD GÖRÜNÜMÜ */
                            <div className="flex h-full p-6 gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col">
                                        <div className="flex items-center gap-2 mb-4">
                                            <div style={{backgroundColor: col.dot_color}} className="w-2 h-2 rounded-full"></div>
                                            <span className="text-[10px] font-black text-zinc-500 uppercase">{col.title}</span>
                                        </div>
                                        <div className="flex-1 space-y-3 overflow-y-auto custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} onClick={() => setSelectedTask(task)} className="bg-[#1a1a1c] border border-zinc-800 p-4 rounded-xl hover:border-zinc-500 cursor-pointer transition-all">
                                                    <p className="text-xs text-zinc-200 mb-4 line-clamp-2 font-medium">{task.text}</p>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex -space-x-1">
                                                            {(task.assignee || []).map(id => <div key={id} className="w-5 h-5 rounded-full bg-zinc-700 border border-[#1a1a1c] text-[7px] flex items-center justify-center font-bold">{id}</div>)}
                                                        </div>
                                                        <span className="text-[9px] text-zinc-600 italic">{task.end_date || 'Tarihsiz'}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            /* LİSTE GÖRÜNÜMÜ (ClickUp Style) */
                            <div className="h-full overflow-y-auto p-8 custom-scrollbar">
                                {columns.map(col => {
                                    const colTasks = filteredTasks.filter(t => t.status === col.slug);
                                    if (colTasks.length === 0) return null;
                                    return (
                                        <div key={col.id} className="mb-10">
                                            <div className="flex items-center gap-3 mb-4 border-b border-zinc-900 pb-2">
                                                <i className="fas fa-chevron-down text-[10px] text-zinc-600"></i>
                                                <span className="text-xs font-bold text-zinc-400 uppercase tracking-tighter">{col.title}</span>
                                                <span className="text-[10px] text-zinc-600 ml-2">{colTasks.length} Görev</span>
                                            </div>
                                            <div className="space-y-px">
                                                {colTasks.map(task => (
                                                    <div key={task.id} onClick={() => setSelectedTask(task)} className="flex items-center bg-[#1a1a1c]/30 hover:bg-[#1a1a1c] border-b border-zinc-900 py-3 px-4 group transition-colors cursor-pointer">
                                                        <div className="w-6 flex justify-center"><i className="far fa-circle text-zinc-700 group-hover:text-purple-500 transition-colors"></i></div>
                                                        <div className="flex-1 text-sm text-zinc-300 ml-4">{task.text}</div>
                                                        <div className="flex gap-1 w-32 justify-center">
                                                            {(task.assignee || []).map(id => <div key={id} className="w-6 h-6 rounded-full bg-zinc-800 border border-zinc-700 text-[8px] flex items-center justify-center font-bold text-zinc-400">{id}</div>)}
                                                        </div>
                                                        <div className="w-32 text-right text-[10px] text-zinc-600 font-medium">
                                                            {task.end_date ? new Date(task.end_date).toLocaleDateString('tr-TR') : '--'}
                                                        </div>
                                                        <div className="w-10 text-right opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <i className="fas fa-ellipsis-h text-zinc-700"></i>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </main>

                    {/* MODAL DETAY (Daha Önceki Özelliklerle Aynı) */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-50">
                            <div className="w-full max-w-xl bg-[#141416] h-full shadow-2xl border-l border-zinc-800 p-8 flex flex-col overflow-y-auto custom-scrollbar">
                                <div className="flex justify-between items-center mb-10">
                                    <span className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">GÖREV DETAYLARI</span>
                                    <button onClick={() => setSelectedTask(null)} className="text-zinc-500 hover:text-white transition-all"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <input className="text-2xl font-bold bg-transparent outline-none text-white mb-8" defaultValue={selectedTask.text} onBlur={(e) => updateTask(selectedTask.id, { text: e.target.value })} />
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] text-zinc-600 font-bold block mb-2 uppercase">Atananlar</label>
                                        <div className="flex gap-2">
                                            {TEAM.map(u => {
                                                const active = (selectedTask.assignee || []).includes(u.id);
                                                return (
                                                    <button key={u.id} onClick={() => {
                                                        const cur = selectedTask.assignee || [];
                                                        const next = cur.includes(u.id) ? cur.filter(x => x !== u.id) : [...cur, u.id];
                                                        updateTask(selectedTask.id, { assignee: next });
                                                    }} className={`px-4 py-1.5 rounded-lg text-[10px] font-bold border transition-all ${active ? `${u.color} border-transparent text-white` : 'border-zinc-800 text-zinc-500'}`}>{u.id}</button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] text-zinc-600 font-bold block mb-2 uppercase">Başlangıç</label>
                                            <input type="date" value={selectedTask.start_date || ""} onChange={e => updateTask(selectedTask.id, { start_date: e.target.value })} className="bg-zinc-900 border border-zinc-800 text-white p-3 rounded-xl w-full text-xs" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-zinc-600 font-bold block mb-2 uppercase">Bitiş</label>
                                            <input type="date" value={selectedTask.end_date || ""} onChange={e => updateTask(selectedTask.id, { end_date: e.target.value })} className="bg-zinc-900 border border-zinc-800 text-white p-3 rounded-xl w-full text-xs" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-zinc-600 font-bold block mb-2 uppercase">Açıklama</label>
                                        <textarea className="w-full bg-[#0c0c0e] border border-zinc-800 rounded-2xl p-4 text-xs min-h-[150px] outline-none focus:border-purple-900/50 transition-all custom-scrollbar leading-relaxed" defaultValue={selectedTask.description} onBlur={e => updateTask(selectedTask.id, { description: e.target.value })} />
                                    </div>
                                    <button onClick={async () => { if(confirm("Silinsin mi?")) { await supabase.from('tasks').delete().eq('id', selectedTask.id); setSelectedTask(null); fetchData(); } }} className="w-full bg-red-900/20 text-red-500 py-3 rounded-xl text-xs font-bold hover:bg-red-900/40 transition-all">GÖREVİ SİL</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

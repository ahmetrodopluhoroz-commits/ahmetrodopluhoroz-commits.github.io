<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Sprint & Project Master (v4.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: all 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .quartz-body { background-color: #F4F5F7; color: #172B4D; }
        .dark-body { background-color: #0c0c0e; color: #d1d1d1; }
        .dark-card { background-color: #1a1a1c; border: 1px solid #333; }
        .quartz-card { background-color: #ffffff; border: 1px solid #ddd; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body class="dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-[#0052CC]' },
            { id: 'BD', name: 'Berkan', color: 'bg-orange-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [sprints, setSprints] = useState([]);
            const [activeSprintId, setActiveSprintId] = useState(null);
            const [currentView, setCurrentView] = useState('board');
            const [theme, setTheme] = useState('dark');
            const [selectedTask, setSelectedTask] = useState(null);

            // Filtreler
            const [filterAssignee, setFilterAssignee] = useState('All');

            const fetchData = async () => {
                const { data: tsk } = await supabase.from('tasks').select('*');
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: spr } = await supabase.from('sprints').select('*').order('start_date');
                setTasks(tsk || []);
                setColumns(cols || []);
                setSprints(spr || []);
                if (spr?.length > 0 && !activeSprintId) setActiveSprintId(spr[0].id);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            // SPRINT OLUŞTURMA MANTIĞI
            const generateSprints = async () => {
                const start = prompt("Başlangıç Tarihi (YYYY-MM-DD):", "2026-01-01");
                const end = prompt("Bitiş Tarihi (YYYY-MM-DD):", "2026-12-31");
                const duration = parseInt(prompt("Sprint Süresi (Gün):", "14"));
                
                if (!start || !end || isNaN(duration)) return;

                let currentStart = new Date(start);
                const finalEnd = new Date(end);
                const newSprints = [];
                let count = 1;

                while (currentStart < finalEnd) {
                    let currentEnd = new Date(currentStart);
                    currentEnd.setDate(currentStart.getDate() + duration - 1);
                    
                    newSprints.push({
                        name: `Sprint ${count}`,
                        start_date: currentStart.toISOString().split('T')[0],
                        end_date: currentEnd.toISOString().split('T')[0]
                    });
                    
                    currentStart.setDate(currentStart.getDate() + duration);
                    count++;
                }

                const { error } = await supabase.from('sprints').insert(newSprints);
                if (!error) fetchData();
            };

            const updateTask = async (taskId, updates) => {
                await supabase.from('tasks').update(updates).eq('id', taskId);
                fetchData();
            };

            const filteredTasks = useMemo(() => {
                let filtered = [...tasks];
                if (filterAssignee !== 'All') filtered = filtered.filter(t => (t.assignee || []).includes(filterAssignee));
                return filtered;
            }, [tasks, filterAssignee]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#0c0c0e]">
                        <button onClick={() => setIsLoggedIn(true)} className="bg-purple-600 px-8 py-4 rounded-xl text-white font-bold text-xl shadow-2xl">RASG DASHBOARD GİRİŞ</button>
                    </div>
                );
            }

            const isDark = theme === 'dark';

            return (
                <div className={`h-screen flex flex-col ${isDark ? 'dark-body' : 'quartz-body'}`}>
                    {/* HEADER */}
                    <header className={`p-4 border-b flex justify-between items-center ${isDark ? 'bg-[#1a1a1c] border-zinc-800' : 'bg-white border-zinc-200'}`}>
                        <div className="flex items-center gap-8">
                            <h1 className="font-bold italic text-lg tracking-tighter">RASG MASTER</h1>
                            <div className="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                                <button onClick={() => setCurrentView('board')} className={`pb-1 ${currentView === 'board' ? 'border-b-2 border-blue-500' : 'opacity-40'}`}>BOARD</button>
                                <button onClick={() => setCurrentView('list')} className={`pb-1 ${currentView === 'list' ? 'border-b-2 border-blue-500' : 'opacity-40'}`}>LIST</button>
                                <button onClick={() => setCurrentView('sprints')} className={`pb-1 ${currentView === 'sprints' ? 'border-b-2 border-blue-500 text-blue-500' : 'opacity-40'}`}>SPRINTS</button>
                            </div>
                        </div>
                        <div className="flex gap-4">
                            <select onChange={e => setFilterAssignee(e.target.value)} className="bg-transparent border border-zinc-700 text-[10px] p-1 rounded">
                                <option value="All">Tüm Ekip</option>
                                {TEAM.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                            <button onClick={() => setTheme(isDark ? 'quartz' : 'dark')} className="text-xs opacity-50"><i className={`fas fa-${isDark ? 'sun' : 'moon'}`}></i></button>
                            <button onClick={generateSprints} className="bg-zinc-800 text-white px-3 py-1 rounded text-[10px] font-bold">+ AUTO SPRINTS</button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden">
                        {currentView === 'sprints' ? (
                            /* SPRINT MANAGEMENT VIEW */
                            <div className="h-full flex flex-col p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div className="flex gap-4">
                                        <select 
                                            className="bg-[#1a1a1c] border border-zinc-700 p-2 rounded text-sm text-white"
                                            value={activeSprintId || ""}
                                            onChange={e => setActiveSprintId(e.target.value)}
                                        >
                                            {sprints.map(s => <option key={s.id} value={s.id}>{s.name} ({s.start_date} / {s.end_date})</option>)}
                                        </select>
                                    </div>
                                    <div className="text-xs opacity-50 font-bold uppercase tracking-widest">Sprint Planlama Ekranı</div>
                                </div>

                                <div className="flex-1 flex gap-6 overflow-hidden">
                                    {/* BACKLOG (SOL) */}
                                    <div className={`flex-1 flex flex-col rounded-2xl p-4 ${isDark ? 'bg-[#121214]' : 'bg-zinc-200'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 opacity-50">Backlog (Havuz)</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => !t.sprint_id).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center ${isDark ? 'bg-[#1c1c1e]' : 'bg-white shadow-sm'}`}>
                                                    <span className="text-sm font-medium">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: activeSprintId })} className="bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">SPRINT'E EKLE <i className="fas fa-arrow-right ml-1"></i></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ACTIVE SPRINT (SAĞ) */}
                                    <div className={`flex-1 flex flex-col rounded-2xl p-4 ${isDark ? 'bg-[#1a1a1c] border border-blue-900/30' : 'bg-blue-50'}`}>
                                        <h3 className="text-xs font-black uppercase mb-4 text-blue-500">Aktif Sprint Görevleri</h3>
                                        <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => t.sprint_id == activeSprintId).map(task => (
                                                <div key={task.id} className={`p-4 rounded-xl flex justify-between items-center border border-blue-500/20 ${isDark ? 'bg-[#242427]' : 'bg-white shadow-md'}`}>
                                                    <span className="text-sm font-medium text-blue-400">{task.text}</span>
                                                    <button onClick={() => updateTask(task.id, { sprint_id: null })} className="text-zinc-500 hover:text-red-500 text-[10px] font-bold"><i className="fas fa-undo mr-1"></i> BACKLOG'A ÇEK</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* BOARD & LIST VIEW (EXISTING) */
                            <div className="h-full p-6 flex gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div key={col.id} className="column-width flex flex-col">
                                        <div className="mb-4 text-[11px] font-black uppercase opacity-40">{col.title}</div>
                                        <div className="flex-1 space-y-3">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div key={task.id} onClick={() => setSelectedTask(task)} className={`p-4 rounded-xl cursor-pointer hover:border-blue-500 transition-all ${isDark ? 'dark-card' : 'quartz-card'}`}>
                                                    <p className="text-sm mb-4 font-medium">{task.text}</p>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex -space-x-1.5">
                                                            {(task.assignee || []).map(id => <div key={id} className="w-5 h-5 rounded-full bg-zinc-700 flex items-center justify-center text-[8px] font-bold border border-zinc-900">{id}</div>)}
                                                        </div>
                                                        {task.sprint_id && <span className="text-[8px] bg-blue-500/10 text-blue-500 px-2 py-0.5 rounded-full font-bold">SPRINT</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* TASK DETAIL MODAL */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className={`${isDark ? 'bg-[#1c1c1e]' : 'bg-white'} w-full max-w-xl p-10 shadow-2xl animate-in slide-in-from-right`}>
                                <div className="flex justify-between items-center mb-10">
                                    <span className="text-[10px] font-black opacity-40 uppercase">GÖREV AYRINTILARI</span>
                                    <button onClick={() => setSelectedTask(null)} className="text-2xl hover:text-red-500">✕</button>
                                </div>
                                <h2 className="text-2xl font-bold mb-10">{selectedTask.text}</h2>
                                <div className="space-y-8">
                                    <div>
                                        <label className="text-[10px] font-black opacity-30 uppercase block mb-2">Sprint Ataması</label>
                                        <select 
                                            className="w-full bg-transparent border border-zinc-700 p-3 rounded-xl text-sm"
                                            value={selectedTask.sprint_id || ""}
                                            onChange={e => updateTask(selectedTask.id, { sprint_id: e.target.value || null })}
                                        >
                                            <option value="">Backlog (Havuz)</option>
                                            {sprints.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="pt-8 border-t border-zinc-800">
                                        <button onClick={() => setSelectedTask(null)} className="w-full bg-blue-600 p-4 rounded-xl font-bold text-white shadow-xl hover:bg-blue-700">KAYDET VE ÇIK</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojistik Finansal Yönetim Paneli - CFO View</title>
    
    <!-- === KÜTÜPHANELER === -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.0/umd/Recharts.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-tooltip-card { background: rgba(255, 255, 255, 0.98); border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); padding: 12px; min-width: 240px; z-index: 50; }
        .tooltip-header { font-weight: 700; color: #1e293b; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .tooltip-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.85rem; }
        .tooltip-label { color: #64748b; }
        .tooltip-value { font-weight: 600; color: #334155; }
        .tooltip-trend { font-size: 0.75rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; margin-top: 8px; }
        .trend-up { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .trend-down { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .tag-real { background: #dbeafe; color: #1e40af; font-size: 0.65rem; padding: 1px 6px; border-radius: 99px; }
        .tag-forecast { background: #f3f4f6; color: #4b5563; border: 1px dashed #9ca3af; font-size: 0.65rem; padding: 1px 6px; border-radius: 99px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .expand-modal { width: 90%; height: 90%; background: white; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; overflow: hidden; animation: zoomIn 0.2s ease-out; }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .recharts-text.recharts-pie-label-text { font-size: 9px; font-weight: 600; fill: #4b5563; }
        .clickable-row { cursor: pointer; transition: background-color 0.2s; }
        .clickable-row:hover { background-color: #f1f5f9; }
        .detail-row { background-color: #f8fafc; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }

        /* AI Chat Styles */
        .ai-message { padding: 12px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; font-size: 0.9rem; line-height: 1.5; }
        .ai-message.user { background-color: #eff6ff; color: #1e3a8a; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message.bot { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; margin: 0 1px; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const getRecharts = () => window.Recharts || null;

        // Gemini API Key (Placeholder)
        const apiKey = ""; 

        // --- ICONS ---
        const Icons = {
            Upload: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            TrendingUp: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            TrendingDown: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>,
            AlertTriangle: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
            Filter: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            Download: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Search: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>,
            ChevronDown: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
            ChevronUp: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
            Activity: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Printer: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            Settings: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Trash: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Scale: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>,
            Maximize: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>,
            Minimize: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>,
            Sparkles: ({size=24, className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 5h4"/><path d="M3 9h4"/></svg>,
            MessageSquare: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Send: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        };

        const DISPLAY_MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
        const MONTH_SEARCH_KEYS = [['oca','jan'],['sub','feb'],['mar'],['nis','apr'],['may'],['haz','jun'],['tem','jul'],['agu','aug'],['eyl','sep'],['eki','oct'],['kas','nov'],['ara','dec']];
        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#82ca9d', '#ffc658', '#FF6B6B', '#4ECDC4'];
        const SEASONALITY_FACTORS = {'Oca': 0.9, 'Şub': 0.9, 'Mar': 1.0, 'Nis': 1.0, 'May': 1.05, 'Haz': 1.05, 'Tem': 1.1, 'Ağu': 1.0, 'Eyl': 1.1, 'Eki': 1.15, 'Kas': 1.3, 'Ara': 1.4};
        const THEME = { bg: 'bg-slate-50', card: 'bg-white shadow-sm border border-slate-200 rounded-xl' };

        // --- KPI CARD COMPONENT ---
        const KPICard = ({ title, value, subtext, icon, border, children, onExpand }) => (
            <div className={`p-5 border-l-4 ${border} ${THEME.card} relative group`}>
                <button onClick={onExpand} className="absolute top-2 right-2 text-slate-300 hover:text-blue-600 transition p-1 opacity-0 group-hover:opacity-100" title="Detaylı Analiz"><Icons.Maximize size={18}/></button>
                <p className="text-xs text-slate-400 font-bold uppercase">{title}</p>
                <div className="mt-1">{value}</div>
                {subtext && <div className="mt-1">{subtext}</div>}
                {children}
            </div>
        );

        function App() {
            const [isRechartsReady, setIsRechartsReady] = useState(false);
            const [data, setData] = useState([]);
            const [budgetData, setBudgetData] = useState([]);
            const [fileName, setFileName] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [filterMasrafYeri, setFilterMasrafYeri] = useState('');
            const [filterMizan, setFilterMizan] = useState('');
            const [selectedMonth, setSelectedMonth] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [loading, setLoading] = useState(false);
            const [expandedRows, setExpandedRows] = useState({});
            const [auditThreshold, setAuditThreshold] = useState(5000);
            const [auditPercent, setAuditPercent] = useState(50);
            const [showDataModal, setShowDataModal] = useState(false);
            
            // AI States
            const [showAIModal, setShowAIModal] = useState(false);
            const [aiMessages, setAiMessages] = useState([]);
            const [aiInput, setAiInput] = useState("");
            const [isAiThinking, setIsAiThinking] = useState(false);

            // Expand States
            const [expandedTopExpense, setExpandedTopExpense] = useState(null); 
            const [expandedTopMizan, setExpandedTopMizan] = useState(null); 
            const [expandedOverrun, setExpandedOverrun] = useState(null);
            const [expandedSaving, setExpandedSaving] = useState(null);
            const [expandedBudgetRow, setExpandedBudgetRow] = useState(null); 
            const [expandedCardId, setExpandedCardId] = useState(null); 
            const [isSeasonal, setIsSeasonal] = useState(false);

            const dashboardRef = useRef(null);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const checkInterval = setInterval(() => { if (window.Recharts) { setIsRechartsReady(true); clearInterval(checkInterval); } }, 500);
                return () => clearInterval(checkInterval);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [aiMessages]);

            const normalizeString = (str) => str ? str.toLocaleLowerCase('tr-TR').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/[^a-z0-9]/g, '') : '';
            const parseNumber = (val) => { 
                if (!val) return 0; 
                let str = String(val).replace(/\s/g, '').replace(/\u00A0/g, ''); 
                if (str === '-' || str === '') return 0; 
                var clean = str; 
                if (clean.includes('-')) clean = clean.replace(/-/g, ''); 
                clean = clean.replace(/\./g, '').replace(',', '.'); 
                let result = parseFloat(clean); 
                return str.includes('-') ? -result : (isNaN(result) ? 0 : result); 
            };

            const parseCSV = (text, type) => {
                setLoading(true);
                setTimeout(() => {
                    try {
                        if (!text) throw new Error("Dosya boş.");
                        let cleanText = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
                        const lines = cleanText.split(/\r?\n/);
                        if (lines.length < 2) throw new Error("Yetersiz veri.");
                        const delimiter = lines[0].includes(';') ? ';' : ',';
                        const headers = lines[0].split(delimiter).map(h => h.trim());
                        const normalizedHeaders = headers.map(h => normalizeString(h));
                        const monthIndices = new Array(12).fill(-1);
                        MONTH_SEARCH_KEYS.forEach((keys, idx) => { const f = normalizedHeaders.findIndex(h => keys.some(k => h.includes(k))); if (f !== -1) monthIndices[idx] = f; });
                        
                        const parsedData = [];
                        for (let i = 1; i < lines.length; i++) {
                            const cols = lines[i].split(delimiter);
                            if (cols.length < 2) continue;
                            const getVal = (keys) => { let idx = normalizedHeaders.findIndex(h => keys.includes(h)); if (idx === -1) idx = normalizedHeaders.findIndex(h => keys.some(k => h.startsWith(k))); if (idx === -1) idx = normalizedHeaders.findIndex(h => keys.some(k => h.includes(k))); return idx !== -1 ? (cols[idx] || '') : ''; };
                            const mizanAdi = getVal(['mizanadi', 'mizanad']);
                            if (!mizanAdi && type === 'actual') continue; 
                            const monthlyData = {}; let total = 0;
                            monthIndices.forEach((cIdx, mIdx) => { const val = (cIdx !== -1 && cIdx < cols.length) ? parseNumber(cols[cIdx]) : 0; monthlyData[DISPLAY_MONTHS[mIdx]] = val; total += val; });
                            parsedData.push({ id: i, direktorluk: getVal(['direktorluk']).replace(/"/g, '').trim() || 'Diğer', masrafYeriKodu: getVal(['masrafyerikodu', 'masrafyerikod']).replace(/"/g, '').trim(), masrafYeriAdi: getVal(['masrafyeradi', 'masrafyerad']).replace(/"/g, '').trim(), masrafYeriTam: (getVal(['masrafyerikodu', 'masrafyerikod']) ? `[${getVal(['masrafyerikodu', 'masrafyerikod']).replace(/"/g, '').trim()}] ` : '') + getVal(['masrafyeradi', 'masrafyerad']).replace(/"/g, '').trim(), mizanKodu: getVal(['mizankodu']).replace(/"/g, '').trim(), mizanAdi: mizanAdi.replace(/"/g, '').trim(), mizanTam: (getVal(['mizankodu']) ? `[${getVal(['mizankodu']).replace(/"/g, '').trim()}] ` : '') + mizanAdi.replace(/"/g, '').trim(), butceSorumlusu: getVal(['butcesor']).replace(/"/g, '').trim(), toplam2025: total, monthlyData });
                        }
                        if (type === 'actual') setData(parsedData); else setBudgetData(parsedData);
                        setShowDataModal(false);
                    } catch (e) { alert(e.message); } finally { setLoading(false); }
                }, 200);
            };

            const handleFileUpload = (e, type) => { const f = e.target.files?.[0]; if (f) { if(type==='actual') setFileName(f.name); setLoading(true); const r = new FileReader(); r.onload = (ev) => parseCSV(ev.target.result, type); r.readAsText(f, 'ISO-8859-9'); } };
            const uniqueMasrafYerleri = useMemo(() => [...new Set([...data, ...budgetData].map(r => r.masrafYeriTam).filter(Boolean))].sort(), [data, budgetData]);
            const uniqueMizanlar = useMemo(() => [...new Set([...data, ...budgetData].map(r => r.mizanTam).filter(Boolean))].sort(), [data, budgetData]);
            const filteredData = useMemo(() => data.filter(r => (filterMasrafYeri ? r.masrafYeriTam === filterMasrafYeri : true) && (filterMizan ? r.mizanTam === filterMizan : true)), [data, filterMasrafYeri, filterMizan]);
            const filteredBudget = useMemo(() => budgetData.filter(r => (filterMasrafYeri ? r.masrafYeriTam === filterMasrafYeri : true) && (filterMizan ? r.mizanTam === filterMizan : true)), [budgetData, filterMasrafYeri, filterMizan]);

            const chartData = useMemo(() => {
                const monthTotals = DISPLAY_MONTHS.map(m => filteredData.reduce((acc, c) => acc + (c.monthlyData[m] || 0), 0));
                const budgetTotals = DISPLAY_MONTHS.map(m => filteredBudget.reduce((acc, c) => acc + (c.monthlyData[m] || 0), 0));
                let lastRealIndex = -1;
                for (let i = monthTotals.length - 1; i >= 0; i--) { if (monthTotals[i] !== 0) { lastRealIndex = i; break; } }
                const realMonthsCount = lastRealIndex + 1;
                const totalRealValue = monthTotals.slice(0, realMonthsCount).reduce((a,b)=>a+b, 0);
                const averageMonthly = realMonthsCount > 0 ? totalRealValue / realMonthsCount : 0;
                return {
                    monthlyTrend: DISPLAY_MONTHS.map((m, idx) => {
                        const isForecast = idx > lastRealIndex;
                        let actualVal = isForecast ? averageMonthly : monthTotals[idx];
                        if (isForecast && isSeasonal) actualVal = actualVal * (SEASONALITY_FACTORS[m] || 1);
                        const budgetVal = budgetTotals[idx];
                        let prevVal = null; let changePercent = 0; let direction = 'neutral';
                        if (idx > 0 && !isForecast) {
                            const prevMonthTotal = monthTotals[idx - 1];
                            prevVal = prevMonthTotal;

                    const deviationData = chartData.monthlyTrend.filter(m => !m.isForecast).map(m => ({ name: m.name, value: m.actual, diff: m.actual - avg }));
                    return (
                        <div className="p-6 h-full flex flex-col">
                            <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.TrendingUp size={24}/> Aylık Yük Analizi (Ortalamadan Sapma)</h2>
                            <div className="h-80 w-full"><ResponsiveContainer><ComposedChart data={deviationData}><CartesianGrid strokeDasharray="3 3" vertical={false}/><XAxis dataKey="name" /><YAxis /><Tooltip formatter={v => v.toLocaleString('tr-TR') + ' ₺'}/><Legend /><Bar dataKey="value" name="Aylık Tutar" fill="#cbd5e1" barSize={30} /><Line type="monotone" dataKey="diff" name="Ortalamadan Fark" stroke="#f97316" strokeWidth={2} /></ComposedChart></ResponsiveContainer></div>
                            <div className="mt-4 text-sm text-slate-500 text-center">Turuncu çizgi, aylık ortalamaya ({avg.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺) göre ne kadar yukarıda/aşağıda olduğunu gösterir.</div>
                        </div>
                    );
                }
                if (expandedCardId === 'kpi-avg') {
                     return (
                        <div className="p-6 h-full flex flex-col">
                            <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Scale size={24}/> Ortalama Harcama Analizi</h2>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-indigo-50 p-4 rounded-lg text-center"><div className="text-xs text-indigo-500 uppercase font-bold">Aylık Ortalama</div><div className="text-2xl font-bold text-indigo-700">{(kpiSummary.totalActual / 12).toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺</div></div>
                                <div className="bg-blue-50 p-4 rounded-lg text-center"><div className="text-xs text-blue-500 uppercase font-bold">Günlük Ortalama (Tahmini)</div><div className="text-2xl font-bold text-blue-700">{(kpiSummary.totalActual / 365).toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺</div></div>
                            </div>
                             <div className="flex-1 overflow-auto custom-scrollbar mt-4"><table className="w-full text-sm text-left"><thead className="bg-slate-100 text-slate-600 uppercase"><tr><th className="p-3">Ay</th><th className="p-3 text-right">Tutar</th><th className="p-3 text-right">Ortalamaya Göre</th></tr></thead><tbody className="divide-y divide-slate-100">{chartData.monthlyTrend.filter(m => !m.isForecast).map((m, i) => { const avg = kpiSummary.totalActual / 12; const diff = m.actual - avg; const percent = (diff / avg) * 100; return (<tr key={i} className="hover:bg-slate-50"><td className="p-3 font-bold">{m.name}</td><td className="p-3 text-right">{m.actual.toLocaleString('tr-TR')} ₺</td><td className={`p-3 text-right font-bold ${diff > 0 ? 'text-orange-600' : 'text-green-600'}`}>{diff > 0 ? '▲' : '▼'} %{Math.abs(percent).toFixed(1)}</td></tr>)})}</tbody></table></div>
                        </div>
                     );
                }
                return null;
            };

            if (data.length === 0) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 p-6">
                    <div className="bg-white p-10 rounded-2xl shadow-xl border border-slate-200 text-center max-w-2xl w-full">
                        <div className="flex justify-center mb-6"><div className="bg-blue-100 p-4 rounded-full"><Icons.Upload size={48} className="text-blue-600"/></div></div>
                        <h1 className="text-2xl font-bold text-slate-800 mb-2">Finansal Veri Yükleme</h1>
                        <p className="text-slate-500 mb-8">Lütfen analiz etmek istediğiniz dosyaları yükleyiniz.</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="border-2 border-dashed border-blue-200 rounded-xl p-6 hover:bg-blue-50 transition"><h3 className="font-bold text-slate-700 mb-2">1. Fiili Veri</h3><label className="bg-blue-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-700 block text-center text-sm"><input type="file" hidden onChange={(e)=>handleFileUpload(e, 'actual')}/>CSV Seç</label></div>
                            <div className="border-2 border-dashed border-purple-200 rounded-xl p-6 hover:bg-purple-50 transition"><h3 className="font-bold text-slate-700 mb-2">2. Bütçe Verisi</h3><label className="bg-purple-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-purple-700 block text-center text-sm"><input type="file" hidden onChange={(e)=>handleFileUpload(e, 'budget')}/>CSV Seç</label></div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div ref={dashboardRef} className={`min-h-screen ${THEME.bg} p-6 font-sans text-slate-800`}>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <div><h1 className="text-xl font-bold flex items-center gap-2 text-slate-800"><Icons.TrendingUp className="text-blue-600"/> Finansal Yönetim Paneli</h1><p className="text-xs text-slate-500 mt-1">Kaynak: {fileName}</p></div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowDataModal(true)} className="flex items-center gap-2 bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm hover:bg-slate-200 transition shadow-sm border border-slate-200"><Icons.Settings size={16}/> Veri İşlemleri</button>
                                <button onClick={exportPDF} className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition shadow-sm"><Icons.Printer size={16}/> PDF İndir</button>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Masraf Yeri</label><input list="masrafYerleri" className="w-full text-sm border border-slate-300 rounded-md p-2 outline-none" placeholder="Tümü..." value={filterMasrafYeri} onChange={e=>setFilterMasrafYeri(e.target.value)} /><datalist id="masrafYerleri">{uniqueMasrafYerleri.map((val, i) => <option key={i} value={val} />)}</datalist></div>
                            <div><label className="block text-xs font-bold text-slate-500 uppercase mb-1">Mizan</label><input list="mizanlar" className="w-full text-sm border border-slate-300 rounded-md p-2 outline-none" placeholder="Tümü..." value={filterMizan} onChange={e=>setFilterMizan(e.target.value)} /><datalist id="mizanlar">{uniqueMizanlar.map((val, i) => <option key={i} value={val} />)}</datalist></div>
                        </div>
                    </div>

                    {/* DATA MODAL */}
                    {showDataModal && (
                        <div className="modal-overlay" onClick={() => setShowDataModal(false)}>
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full m-4" onClick={e => e.stopPropagation()}>
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><Icons.Settings size={20}/> Veri Yönetimi</h2>
                                <div className="space-y-4">
                                    <div className="p-4 border rounded-lg bg-purple-50 border-purple-100">
                                        <h3 className="font-bold text-purple-800 mb-2 text-sm">Bütçe Verisi Ekle</h3>
                                        <label className="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-purple-700 text-sm justify-center w-full"><input type="file" hidden onChange={(e)=>handleFileUpload(e, 'budget')}/><Icons.Upload size={16}/> Bütçe CSV Seç</label>
                                        {budgetData.length > 0 && <div className="text-xs text-green-600 mt-2 text-center">✓ {budgetData.length} satır bütçe verisi yüklü</div>}
                                    </div>
                                    <button onClick={() => { setData([]); setBudgetData([]); setShowDataModal(false); }} className="w-full flex items-center justify-center gap-2 bg-red-50 text-red-600 border border-red-200 px-4 py-3 rounded-lg hover:bg-red-100 text-sm font-bold"><Icons.Trash size={16}/> Tüm Verileri Sıfırla & Çıkış</button>
                                </div>
                                <button onClick={() => setShowDataModal(false)} className="mt-4 w-full text-slate-500 text-sm hover:text-slate-700">Kapat</button>
                            </div>
                        </div>
                    )}

                    {/* AI MODAL */}
                    {showAIModal && (
                        <div className="modal-overlay" onClick={() => setShowAIModal(false)}>
                            <div className="expand-modal max-w-3xl h-[80vh]" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-white">
                                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Icons.Sparkles className="text-purple-600"/> Akıllı Finansal Asistan</h2>
                                    <button onClick={() => setShowAIModal(false)} className="text-slate-400 hover:text-slate-600"><Icons.Minimize size={20}/></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 bg-slate-50 flex flex-col gap-4">
                                    {aiMessages.length === 0 && (
                                        <div className="text-center py-10 text-slate-500">
                                            <div className="bg-purple-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.Sparkles size={32} className="text-purple-600"/></div>
                                            <p className="mb-4 font-medium">Finansal verilerinizi analiz etmem için bir komut verin:</p>
                                            <button onClick={generateAIAnalysis} className="bg-white border border-purple-200 text-purple-700 px-6 py-3 rounded-xl shadow-sm hover:shadow-md transition font-medium">✨ Otomatik Yönetici Özeti Oluştur</button>
                                        </div>
                                    )}
                                    {aiMessages.map((msg, i) => (
                                        <div key={i} className={`ai-message ${msg.role === 'user' ? 'user' : 'bot'}`}>
                                            {msg.role === 'bot' ? <div dangerouslySetInnerHTML={{ __html: marked.parse(msg.text) }} /> : msg.text}
                                        </div>
                                    ))}
                                    {isAiThinking && <div className="ai-message bot typing-indicator"><span></span><span></span><span></span></div>}
                                    <div ref={chatEndRef} />
                                </div>
                                <form onSubmit={handleChatSubmit} className="p-4 bg-white border-t border-slate-100 flex gap-2">
                                    <input 
                                        type="text" 
                                        value={aiInput} 
                                        onChange={(e) => setAiInput(e.target.value)} 
                                        placeholder="Veriler hakkında bir soru sorun (Örn: En yüksek bütçe sapması nerede?)" 
                                        className="flex-1 border border-slate-200 rounded-lg px-4 py-2 outline-none focus:border-purple-500 transition"
                                    />
                                    <button type="submit" className="bg-purple-600 text-white p-2 rounded-lg hover:bg-purple-700 transition disabled:opacity-50" disabled={isAiThinking || !apiKey}><Icons.Send size={20}/></button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* EXPAND MODAL */}
                    {expandedCardId && (
                        <div className="modal-overlay" onClick={() => setExpandedCardId(null)}>
                            <div className="expand-modal" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-end p-4"><button onClick={() => setExpandedCardId(null)} className="p-2 hover:bg-slate-100 rounded-full"><Icons.Minimize size={24} className="text-slate-500"/></button></div>
                                {renderExpandedContent()}
                            </div>
                        </div>
                    )}

                    {/* GLOBAL KPI CARDS (TOP LEVEL) */}
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6">
                        <KPICard title="Toplam Fiili (YTD)" value={`${kpiSummary.totalActual.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺`} icon={<Icons.Activity/>} border="border-l-blue-500" onExpand={() => setExpandedCardId('actual')} />
                        <KPICard title="Toplam Bütçe" value={`${kpiSummary.totalBudget.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺`} border="border-l-purple-500" onExpand={() => setExpandedCardId('budget')} />
                        <KPICard title="Yıl Sonu Tahmini" value={`${kpiSummary.yearEnd.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺`} border="border-l-indigo-500" onExpand={() => setExpandedCardId('forecast')} />
                        <KPICard title="Bütçe Aşımları" value={<span className="text-red-600">+{budgetDeviations.overruns.reduce((a,b)=>a+b.diff,0).toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</span>} border="border-l-red-500" onExpand={() => setExpandedCardId('overrun')} />
                        <KPICard title="Bütçe Tasarrufları" value={<span className="text-green-600">{budgetDeviations.savings.reduce((a,b)=>a+b.diff,0).toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</span>} border="border-l-green-500" onExpand={() => setExpandedCardId('saving')} />
                    </div>

                    <div className="flex mb-4 border-b border-slate-200 gap-1">{['dashboard','detail','audit'].map(t => (<button key={t} onClick={()=>setActiveTab(t)} className={`px-4 py-2 text-sm font-medium rounded-t-lg ${activeTab===t ? 'bg-white text-blue-600 border-x border-t border-slate-200' : 'text-slate-500 hover:bg-slate-100'}`}>{t==='dashboard'?'Özet':t==='detail'?'Detaylı Liste':<span className="flex items-center gap-2">Kontrol Merkezi <span className="bg-red-100 text-red-600 px-1.5 rounded-full text-xs">{groupedAnomalyData.length}</span></span>}</button>))}</div>

                    {activeTab === 'dashboard' && (
                        <div className="tab-content space-y-6">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                                <div className={`${THEME.card} p-6 lg:col-span-3`}>
                                    <div className="h-96"><ResponsiveContainer><ComposedChart data={chartData.monthlyTrend}><defs><linearGradient id="colorActual" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.8}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0.3}/></linearGradient><linearGradient id="colorBudget" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#8b5cf6" stopOpacity={0.8}/><stop offset="95%" stopColor="#8b5cf6" stopOpacity={0.3}/></linearGradient><pattern id="patternForecast" patternUnits="userSpaceOnUse" width="4" height="4"><path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" style={{stroke:'#94a3b8', strokeWidth:1}} /></pattern></defs><CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0"/><XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#64748b'}}/><YAxis axisLine={false} tickLine={false} tickFormatter={v=>`${(v/1000000).toFixed(1)}M`} width={60} tick={{fill: '#64748b'}}/><Tooltip content={<CustomTooltip />} cursor={{fill: '#f1f5f9'}} /><Legend verticalAlign="top" height={36}/><Bar name="Bütçe" dataKey="budget" fill="url(#colorBudget)" radius={[4,4,0,0]} barSize={20} /><Bar name="Fiili" dataKey="actual" radius={[4,4,0,0]} barSize={20}>{chartData.monthlyTrend.map((e,i)=>(<Cell key={i} fill={e.isForecast ? 'url(#patternForecast)' : 'url(#colorActual)'} opacity={e.isForecast?0.5:1} />))}</Bar><Line type="monotone" name="Trend" dataKey="actual" stroke="#f97316" strokeWidth={3} dot={false} activeDot={{r: 6}} strokeDasharray="5 5" /></ComposedChart></ResponsiveContainer></div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <KPICard title="Kayıt Sayısı" value={tableDisplayData.length} border="border-l-emerald-500" onExpand={() => setExpandedCardId('kpi-count')} />
                                <div className={`${THEME.card} p-4 border-l-4 border-l-blue-500 flex flex-col justify-between`}><div><div className="text-xs text-slate-400 uppercase font-bold mb-1">{selectedMonth ? `${selectedMonth} Tutarı` : 'Toplam Tutar'}</div><div className="text-2xl font-bold">{selectedMonth ? chartData.monthlyTrend.find(m=>m.name===selectedMonth)?.value.toLocaleString('tr-TR',{maximumFractionDigits:0}) : filteredData.reduce((acc,c)=>acc+c.toplam2025,0).toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</div></div><div className="h-6 mt-1">{selectedMonth && kpiTrend && kpiTrend.direction !== 'none' && (<div className={`flex items-center text-xs font-medium ${kpiTrend.direction==='up'?'text-red-600':'text-green-600'}`}>{kpiTrend.direction==='up' ? <Icons.TrendingUp size={14} className="mr-1"/> : <Icons.TrendingDown size={14} className="mr-1"/>}%{kpiTrend.percent} {kpiTrend.direction==='up'?'Artış':'Azalış'} ({kpiTrend.text})</div>)}</div></div>
                                <KPICard title="En Yüksek Ay" value={topMonth.name} subtext={<span className="text-orange-600 font-bold">{topMonth.value.toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺</span>} border="border-l-orange-500" onExpand={() => setExpandedCardId('kpi-peak')} />
                                <KPICard title="Ortalama/Ay" value={`${(filteredData.reduce((acc,c)=>acc+c.toplam2025,0)/12).toLocaleString('tr-TR',{maximumFractionDigits:0})} ₺`} border="border-l-indigo-500" onExpand={() => setExpandedCardId('kpi-avg')} />
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className={`${THEME.card} p-6`}><h3 className="font-bold text-slate-700 mb-4">Masraf Dağılımı</h3><div className="h-64"><ResponsiveContainer><PieChart><Pie data={chartData.pieData} innerRadius={40} outerRadius={60} paddingAngle={2} dataKey="value" labelLine={true} label={({ name, percent, value }) => `${formatMoney(value)} ₺ (%${(percent * 100).toFixed(1)})`}>{chartData.pieData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Pie><Tooltip formatter={v=>v.toLocaleString('tr-TR')+' ₺'} contentStyle={{borderRadius:'8px', border:'none', boxShadow:'0 4px 6px -1px rgba(0,0,0,0.1)'}}/><Legend layout="vertical" verticalAlign="middle" align="right" wrapperStyle={{fontSize: '11px', overflowY: 'auto', maxHeight: '200px'}}/></PieChart></ResponsiveContainer></div></div>
                                
                                <div className={`${THEME.card} p-6 overflow-hidden`}><h3 className="font-bold text-slate-700 mb-4">En Yüksek 5 Masraf Yeri</h3><div className="overflow-auto max-h-64"><table className="w-full text-sm text-left"><tbody>{top5Expenses.map((item, idx) => (<React.Fragment key={idx}><tr className="border-b last:border-0 border-slate-100 clickable-row" onClick={() => setExpandedTopExpense(expandedTopExpense === item.name ? null : item.name)}><td className="py-3 text-slate-600 truncate max-w-[150px] flex items-center gap-2">{expandedTopExpense === item.name ? <Icons.ChevronUp size={12}/> : <Icons.ChevronDown size={12}/>}<span title={item.name}>{item.name}</span></td><td className="py-3 text-right font-bold text-slate-700">{item.value.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺</td></tr>{expandedTopExpense === item.name && (<tr className="detail-row"><td colSpan="2" className="p-3"><div className="text-xs text-slate-500 font-bold mb-2">HARCAMA DETAYI (MİZAN):</div><div className="space-y-1">{getBreakdown('mizanAdi', 'masrafYeriAdi', item.name).map((sub, i) => (<div key={i} className="flex justify-between text-xs"><span className="text-slate-600 truncate max-w-[150px]" title={sub.name}>{sub.name}</span><span className="font-mono text-slate-800">{sub.value.toLocaleString('tr-TR')} ₺</span></div>))}</div></td></tr>)}</React.Fragment>))}</tbody></table></div></div>
                                
                                <div className={`${THEME.card} p-6 overflow-hidden`}><h3 className="font-bold text-slate-700 mb-4">En Yüksek 5 Mizan Kalemi</h3><div className="overflow-auto max-h-64"><table className="w-full text-sm text-left"><tbody>{top5Mizan.map((item, idx) => (<React.Fragment key={idx}><tr className="border-b last:border-0 border-slate-100 clickable-row" onClick={() => setExpandedTopMizan(expandedTopMizan === item.name ? null : item.name)}><td className="py-3 text-slate-600 flex items-center gap-2">{expandedTopMizan === item.name ? <Icons.ChevronUp size={12}/> : <Icons.ChevronDown size={12}/>}<div className="truncate max-w-[150px]"><div title={item.name}>{item.name}</div>{item.code && <div className="text-xs text-slate-400 font-mono">{item.code}</div>}</div></td><td className="py-3 text-right font-bold text-slate-700">{item.value.toLocaleString('tr-TR', {maximumFractionDigits:0})} ₺</td></tr>{expandedTopMizan === item.name && (<tr className="detail-row"><td colSpan="2" className="p-3"><div className="text-xs text-slate-500 font-bold mb-2">EN YÜKSEK ŞUBELER:</div><div className="space-y-1">{getBreakdown('masrafYeriAdi', 'mizanAdi', item.name).map((sub, i) => (<div key={i} className="flex justify-between text-xs"><span className="text-slate-600 truncate max-w-[150px]" title={sub.name}>{sub.name}</span><span className="font-mono text-slate-800">{sub.value.toLocaleString('tr-TR')} ₺</span></div>))}</div></td></tr>)}</React.Fragment>))}</tbody></table></div></div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'detail' && (
                        <div className={`${THEME.card} flex flex-col h-[600px] tab-content`}>
                            <div className="p-4 border-b flex justify-between items-center"><div className="font-bold text-sm text-slate-700">Detaylı Liste</div><div className="flex gap-2"><button onClick={()=>handleExport(tableDisplayData)} className="flex items-center gap-1 text-xs bg-white border px-3 py-2 rounded hover:bg-slate-50"><Icons.Download size={14}/> CSV İndir</button><div className="relative"><input className="pl-8 pr-2 py-1.5 border rounded text-sm w-48" placeholder="Ara..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/><Icons.Search className="absolute left-2 top-2 text-slate-400" size={14}/></div></div></div>
                            <div className="flex-1 overflow-auto custom-scrollbar"><table className="w-full text-sm text-left text-slate-600"><thead className="bg-slate-50 sticky top-0 z-10 text-xs uppercase font-bold text-slate-500"><tr><th className="px-4 py-3">Direktörlük</th><th className="px-4 py-3">Masraf Yeri</th><th className="px-4 py-3">Mizan</th><th className="px-4 py-3">Sorumlu</th>{DISPLAY_MONTHS.map(m=><th key={m} className="px-2 py-3 text-right">{m}</th>)}<th className="px-4 py-3 text-right">Top.</th></tr></thead><tbody className="divide-y divide-slate-100">{tableDisplayData.map(r => (<tr key={r.id} className="hover:bg-slate-50"><td className="px-4 py-2 font-medium">{r.direktorluk}</td><td className="px-4 py-2 truncate max-w-xs" title={r.masrafYeriTam}> {r.masrafYeriKodu && <span className="font-mono text-xs text-slate-500 bg-slate-100 px-1 rounded mr-1">{r.masrafYeriKodu}</span>} {r.masrafYeriAdi} </td><td className="px-4 py-2 truncate max-w-xs" title={r.mizanTam}> {r.mizanKodu && <span className="font-mono text-xs text-slate-500 bg-slate-100 px-1 rounded mr-1">{r.mizanKodu}</span>} {r.mizanAdi} </td><td className="px-4 py-2">{r.butceSorumlusu}</td>{DISPLAY_MONTHS.map(m=><td key={m} className={`px-2 py-2 text-right font-mono text-xs ${selectedMonth===m?'bg-amber-50 font-bold':''}`}>{r.monthlyData[m]?.toLocaleString('tr-TR',{maximumFractionDigits:0})||'-'}</td>)}<td className="px-4 py-2 text-right font-bold">{r.toplam2025.toLocaleString('tr-TR',{maximumFractionDigits:0})}</td></tr>))}</tbody></table></div>
                        </div>
                    )}

                    {activeTab === 'audit' && (
                        <div className={`${THEME.card} flex flex-col h-[600px] tab-content border-t-4 border-red-500`}>
                            <div className="p-4 border-b flex flex-col md:flex-row md:items-center justify-between gap-4 bg-red-50">
                                <div className="flex items-center gap-2 text-red-700 font-bold"><Icons.AlertTriangle size={20}/> Kontrol Merkezi</div>
                                <div className="flex items-center gap-4 text-sm"><div className="flex items-center gap-2 bg-white px-3 py-1 rounded border border-red-200"><span className="text-slate-500 text-xs uppercase font-bold">Sapma Limiti:</span><input type="number" value={auditThreshold} onChange={e=>setAuditThreshold(Number(e.target.value))} className="w-20 text-right font-mono outline-none text-slate-700"/> <span className="text-slate-400">TL</span></div><div className="flex items-center gap-2 bg-white px-3 py-1 rounded border border-red-200"><span className="text-slate-500 text-xs uppercase font-bold">Değişim:</span><input type="number" value={auditPercent} onChange={e=>setAuditPercent(Number(e.target.value))} className="w-12 text-right font-mono outline-none text-slate-700"/> <span className="text-slate-400">%</span></div><button onClick={()=>handleExport(groupedAnomalyData)} className="text-xs bg-white border border-red-200 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 flex gap-1"><Icons.Download size={14}/> İndir</button></div>
                            </div>
                            <div className="flex-1 overflow-auto custom-scrollbar">
                                {groupedAnomalyData.length===0 ? <div className="h-full flex flex-col items-center justify-center text-slate-400"><Icons.Activity size={48} className="mb-2 opacity-20"/><p>Kriterlere uygun anormallik bulunamadı.</p></div> : 
                                <table className="w-full text-sm text-left"><thead className="bg-slate-50 sticky top-0 font-bold text-xs uppercase text-slate-500"><tr><th className="px-6 py-3 w-10"></th><th className="px-6 py-3">Excel Satır No</th><th className="px-6 py-3">Durum</th><th className="px-6 py-3">Masraf Yeri (Kod - Ad)</th><th className="px-6 py-3">Mizan (Kod - Ad)</th></tr></thead><tbody className="divide-y divide-slate-100">{groupedAnomalyData.map((group) => { const hasSignFlip = group.anomalies.some(a => a.type === 'SIGN_FLIP'); return (<React.Fragment key={group.id}><tr className="hover:bg-red-50 cursor-pointer" onClick={() => toggleRow(group.id)}><td className="px-6 py-4 text-center text-slate-400">{expandedRows[group.id] ? <Icons.ChevronUp size={16}/> : <Icons.ChevronDown size={16}/>}</td><td className="px-6 py-4 font-mono font-bold text-slate-500">{group.id + 1}</td><td className="px-6 py-4"><span className={`px-2 py-1 rounded text-xs font-bold border ${hasSignFlip ? 'bg-orange-100 text-orange-800 border-orange-200' : 'bg-red-100 text-red-700 border-red-200'}`}>{group.anomalies.length} Tespit</span></td><td className="px-6 py-4">{group.masrafYeriKodu && <span className="font-mono text-xs bg-slate-100 px-1 rounded mr-1">{group.masrafYeriKodu}</span>} {group.masrafYeriAdi}</td><td className="px-6 py-4">{group.mizanKodu && <span className="font-mono text-xs bg-slate-100 px-1 rounded mr-1">{group.mizanKodu}</span>} {group.mizanAdi}</td></tr>{expandedRows[group.id] && (<tr className="bg-slate-50"><td colSpan="5" className="px-6 py-4"><div className="border border-slate-200 rounded-lg bg-white overflow-hidden"><table className="w-full text-xs"><thead className="bg-slate-100 text-slate-500 uppercase"><tr><th className="px-4 py-2">Ay</th><th className="px-4 py-2">Tip</th><th className="px-4 py-2">Tutar</th><th className="px-4 py-2">Açıklama</th></tr></thead><tbody>{group.anomalies.map((ano, idx) => (<tr key={idx} className="border-b last:border-0 border-slate-100"><td className="px-4 py-2 font-bold">{ano.month}</td><td className="px-4 py-2"><span className={`px-1.5 py-0.5 rounded ${ano.type==='SIGN_FLIP'?'bg-orange-100 text-orange-700':'bg-blue-100 text-blue-700'}`}>{ano.type==='SIGN_FLIP'?'İşaret Değişimi':'Sapma'}</span></td><td className="px-4 py-2 font-mono">{ano.val.toLocaleString('tr-TR')} ₺</td><td className="px-4 py-2 text-slate-600">{ano.desc}</td></tr>))}</tbody></table></div></td></tr>)}</React.Fragment>)})}</tbody></table>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

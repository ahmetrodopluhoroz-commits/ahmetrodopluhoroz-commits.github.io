<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASG | 2026 Ultimate Dashboard (v2.2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; transition: background 0.5s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .column-width { min-width: 320px; width: 320px; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px); z-index: 100; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .dragging { opacity: 0.5; transform: scale(0.95); }
        
        /* Crystal Quartz Efektleri */
        .glass-effect {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .quartz-bg {
            background: radial-gradient(circle at top right, #1e1b4b, #0c0c0e),
                        radial-gradient(circle at bottom left, #1e1b4b, #0c0c0e);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = "https://tjkfrcohungwocfbimih.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_uNiAvwlIFg8r9l7e_NDI6g_A_9b-n9x";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TEAM = [
            { id: 'AR', name: 'Ahmet', color: 'bg-orange-500' },
            { id: 'BD', name: 'Berkan', color: 'bg-blue-500' },
            { id: 'YE', name: 'Yiğit', color: 'bg-purple-500' }
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [tasks, setTasks] = useState([]);
            const [columns, setColumns] = useState([]);
            const [selectedTask, setSelectedTask] = useState(null);
            const [currentView, setCurrentView] = useState('board');
            const [theme, setTheme] = useState('dark'); // 'dark' veya 'quartz'
            const [draggedTaskId, setDraggedTaskId] = useState(null);
            const [filterAssignee, setFilterAssignee] = useState('All');
            const [filterTime, setFilterTime] = useState('All');

            const fetchData = async () => {
                const { data: cols } = await supabase.from('columns').select('*').order('order_index');
                const { data: tsk } = await supabase.from('tasks').select('*').order('created_at');
                setColumns(cols || []);
                setTasks(tsk || []);
            };

            useEffect(() => { if (isLoggedIn) fetchData(); }, [isLoggedIn]);

            const updateTask = async (taskId, updates) => {
                const { error } = await supabase.from('tasks').update(updates).eq('id', taskId);
                if (!error) {
                    fetchData();
                    if (selectedTask?.id === taskId) setSelectedTask(prev => ({ ...prev, ...updates }));
                }
            };

            const getFilteredTasks = () => {
                let filtered = [...tasks];
                if (filterAssignee !== 'All') filtered = filtered.filter(t => (t.assignee || []).includes(filterAssignee));
                if (filterTime !== 'All') {
                    const now = new Date();
                    const diff = filterTime === 'week' ? 7 : 30;
                    const limit = new Date(now.setDate(now.getDate() + diff));
                    filtered = filtered.filter(t => t.end_date && new Date(t.end_date) <= limit && new Date(t.end_date) >= new Date());
                }
                return filtered;
            };

            // Tema stilleri
            const isQuartz = theme === 'quartz';
            const bgClass = isQuartz ? "quartz-bg" : "bg-[#0c0c0e]";
            const cardClass = isQuartz ? "glass-effect shadow-xl" : "bg-[#1a1a1c] border-zinc-800";
            const headerClass = isQuartz ? "bg-white/5 backdrop-blur-md border-white/10" : "bg-[#1a1a1c] border-zinc-800";

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-black">
                        <div className="bg-[#1a1a1c] p-10 rounded-3xl border border-zinc-800 w-full max-w-sm shadow-2xl">
                            <h2 className="text-2xl font-black text-white mb-8 text-center italic uppercase tracking-tighter">RASG 2026</h2>
                            <form onSubmit={(e) => { e.preventDefault(); if(username==="RASG" && password==="RASG2026") setIsLoggedIn(true); else alert("Hata!"); }} className="space-y-4">
                                <input type="text" placeholder="Kullanıcı" onChange={e => setUsername(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <input type="password" placeholder="Şifre" onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-white outline-none focus:border-purple-500" />
                                <button className="w-full bg-purple-600 p-4 rounded-2xl font-bold text-white hover:bg-purple-700 transition shadow-lg shadow-purple-900/20">GİRİŞ</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const filteredTasks = getFilteredTasks();

            return (
                <div className={`h-screen flex flex-col transition-colors duration-500 ${bgClass} text-zinc-300`}>
                    {/* Header */}
                    <header className={`${headerClass} border-b p-4 flex justify-between items-center z-10 shadow-lg`}>
                        <div className="flex items-center gap-6">
                            <h1 className="font-black text-white italic tracking-tighter">RASG 2026</h1>
                            <div className="flex gap-4 text-[10px] font-bold uppercase tracking-[0.2em]">
                                <button onClick={() => setCurrentView('board')} className={`pb-1 transition-all ${currentView === 'board' ? 'border-b-2 border-purple-500 text-white' : 'text-zinc-500'}`}>BOARD</button>
                                <button onClick={() => setCurrentView('list')} className={`pb-1 transition-all ${currentView === 'list' ? 'border-b-2 border-purple-500 text-white' : 'text-zinc-500'}`}>LIST</button>
                            </div>
                        </div>

                        <div className="flex gap-4 items-center">
                            {/* Tema Switcher */}
                            <div className="flex items-center bg-black/30 rounded-full p-1 border border-white/10 mr-2">
                                <button onClick={() => setTheme('dark')} className={`px-3 py-1 rounded-full text-[9px] font-bold transition-all ${theme === 'dark' ? 'bg-zinc-700 text-white' : 'text-zinc-500'}`}>DARK</button>
                                <button onClick={() => setTheme('quartz')} className={`px-3 py-1 rounded-full text-[9px] font-bold transition-all ${theme === 'quartz' ? 'bg-purple-600 text-white shadow-lg' : 'text-zinc-500'}`}>QUARTZ</button>
                            </div>

                            <select onChange={(e) => setFilterAssignee(e.target.value)} className="bg-zinc-900/50 border border-white/10 text-[10px] text-zinc-400 px-3 py-1.5 rounded-lg outline-none">
                                <option value="All">Tüm Kişiler</option>
                                {TEAM.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>

                            <button onClick={async () => { const t = prompt("Görev?"); if(t) await supabase.from('tasks').insert([{text:t, status: columns[0].slug}]); fetchData(); }} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow-lg">+ TASK</button>
                            
                            <button onClick={() => setIsLoggedIn(false)} className="text-zinc-600 hover:text-red-500 ml-2 transition-colors"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-hidden">
                        {currentView === 'board' ? (
                            <div className="flex h-full p-6 gap-6 overflow-x-auto custom-scrollbar">
                                {columns.map(col => (
                                    <div 
                                        key={col.id} 
                                        className="column-width flex flex-col p-2"
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={() => { if(draggedTaskId) updateTask(draggedTaskId, { status: col.slug }); setDraggedTaskId(null); }}
                                    >
                                        <div className="flex items-center justify-between mb-5 px-2">
                                            <div className="flex items-center gap-2">
                                                <div style={{backgroundColor: col.dot_color}} className="w-2 h-2 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.3)]"></div>
                                                <span className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">{col.title}</span>
                                                <span className="text-zinc-500 text-[9px] font-bold bg-white/5 px-2 py-0.5 rounded-full">{filteredTasks.filter(t => t.status === col.slug).length}</span>
                                            </div>
                                        </div>

                                        <div className="flex-1 space-y-4 overflow-y-auto custom-scrollbar pr-2">
                                            {filteredTasks.filter(t => t.status === col.slug).map(task => (
                                                <div 
                                                    key={task.id} 
                                                    draggable 
                                                    onDragStart={() => setDraggedTaskId(task.id)}
                                                    onClick={() => setSelectedTask(task)} 
                                                    className={`${cardClass} p-4 rounded-2xl hover:scale-[1.02] cursor-grab active:cursor-grabbing transition-all group`}
                                                >
                                                    <p className="text-[13px] text-zinc-200 mb-4 font-medium leading-relaxed">{task.text}</p>
                                                    <div className="flex justify-between items-center">
                                                        <div className="flex -space-x-1.5">
                                                            {(task.assignee || []).map(id => {
                                                                const member = TEAM.find(m => m.id === id);
                                                                return <div key={id} title={member?.name} className={`w-6 h-6 rounded-full ${member?.color || 'bg-zinc-700'} border-2 ${isQuartz ? 'border-white/20' : 'border-[#1a1a1c]'} text-[8px] flex items-center justify-center font-bold text-white`}>{id}</div>
                                                            })}
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            {task.end_date && <span className="text-[9px] text-zinc-500 font-bold bg-white/5 px-2 py-1 rounded-md"><i className="far fa-calendar-alt mr-1"></i>{new Date(task.end_date).toLocaleDateString('tr-TR', {day:'numeric', month:'short'})}</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={() => { const t = prompt("Görev?"); if(t) supabase.from('tasks').insert([{text:t, status: col.slug}]).then(fetchData); }} className="w-full py-3 text-zinc-600 hover:text-zinc-400 text-[9px] font-black border border-dashed border-white/5 rounded-2xl transition-all uppercase tracking-widest">+ NEW TASK</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            /* List View */
                            <div className="h-full overflow-y-auto p-8 custom-scrollbar max-w-5xl mx-auto">
                                {columns.map(col => {
                                    const colTasks = filteredTasks.filter(t => t.status === col.slug);
                                    if (colTasks.length === 0) return null;
                                    return (
                                        <div key={col.id} className="mb-10">
                                            <div className="flex items-center gap-3 mb-4 border-b border-white/5 pb-2">
                                                <span className="text-[10px] font-black text-zinc-500 uppercase tracking-[0.2em]">{col.title}</span>
                                            </div>
                                            <div className={`${cardClass} rounded-2xl overflow-hidden divide-y divide-white/5`}>
                                                {colTasks.map(task => (
                                                    <div key={task.id} onClick={() => setSelectedTask(task)} className="flex items-center hover:bg-white/5 py-4 px-6 transition-colors cursor-pointer">
                                                        <div className="flex-1 text-sm font-medium text-zinc-300">{task.text}</div>
                                                        <div className="flex -space-x-1 w-32 justify-center">
                                                            {(task.assignee || []).map(id => <div key={id} className="w-6 h-6 rounded-full bg-zinc-800 border border-zinc-700 text-[8px] flex items-center justify-center font-bold">{id}</div>)}
                                                        </div>
                                                        <div className="w-32 text-right text-[10px] text-zinc-500 font-bold font-mono">
                                                            {task.end_date ? new Date(task.end_date).toLocaleDateString('tr-TR') : '-- / --'}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </main>

                    {/* Task Details Modal */}
                    {selectedTask && (
                        <div className="fixed inset-0 modal-overlay flex justify-end z-[100]">
                            <div className={`${isQuartz ? 'bg-zinc-900/80 backdrop-blur-2xl' : 'bg-[#141416]'} w-full max-w-xl h-full shadow-2xl border-l border-white/10 p-8 flex flex-col animate-in slide-in-from-right duration-300`}>
                                <div className="flex justify-between items-center mb-10">
                                    <span className="text-[10px] font-black text-zinc-500 uppercase tracking-widest">TASK SETTINGS</span>
                                    <div className="flex gap-4">
                                        <button onClick={async () => { if(confirm("Silinsin mi?")) { await supabase.from('tasks').delete().eq('id', selectedTask.id); setSelectedTask(null); fetchData(); } }} className="text-zinc-600 hover:text-red-500 transition-colors"><i className="fas fa-trash-alt"></i></button>
                                        <button onClick={() => setSelectedTask(null)} className="text-zinc-500 hover:text-white transition-colors"><i className="fas fa-times text-xl"></i></button>
                                    </div>
                                </div>

                                <textarea 
                                    className="text-2xl font-bold bg-transparent outline-none text-white mb-8 border-b border-white/5 focus:border-purple-500 pb-4 resize-none w-full" 
                                    defaultValue={selectedTask.text} 
                                    onBlur={(e) => updateTask(selectedTask.id, { text: e.target.value })} 
                                />

                                <div className="space-y-8 custom-scrollbar overflow-y-auto pr-2">
                                    <div>
                                        <label className="text-[10px] text-zinc-500 font-bold block mb-4 uppercase tracking-widest">Assignees</label>
                                        <div className="flex flex-wrap gap-2">
                                            {TEAM.map(u => {
                                                const active = (selectedTask.assignee || []).includes(u.id);
                                                return (
                                                    <button key={u.id} onClick={() => {
                                                        const cur = selectedTask.assignee || [];
                                                        const next = cur.includes(u.id) ? cur.filter(x => x !== u.id) : [...cur, u.id];
                                                        updateTask(selectedTask.id, { assignee: next });
                                                    }} className={`px-4 py-2 rounded-xl text-[10px] font-bold border transition-all ${active ? `${u.color} border-transparent text-white shadow-lg` : 'border-white/5 text-zinc-500 hover:border-white/20'}`}>{u.id} {u.name}</button>
                                                )
                                            })}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-6">
                                        <div>
                                            <label className="text-[10px] text-zinc-500 font-bold block mb-3 uppercase tracking-widest">Due Date</label>
                                            <input type="date" value={selectedTask.end_date || ""} onChange={(e) => updateTask(selectedTask.id, { end_date: e.target.value })} className="bg-white/5 border border-white/10 text-white p-3 rounded-xl w-full text-xs outline-none focus:border-purple-500" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-zinc-500 font-bold block mb-3 uppercase tracking-widest">Status</label>
                                            <select value={selectedTask.status} onChange={(e) => updateTask(selectedTask.id, { status: e.target.value })} className="bg-white/5 border border-white/10 text-zinc-300 p-3 rounded-xl w-full text-xs outline-none focus:border-purple-500">
                                                {columns.map(c => <option key={c.id} value={c.slug} className="bg-zinc-900">{c.title}</option>)}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] text-zinc-500 font-bold block mb-3 uppercase tracking-widest">Notes</label>
                                        <textarea className="w-full bg-black/20 border border-white/5 rounded-2xl p-4 text-xs min-h-[150px] outline-none focus:border-purple-500 transition-all leading-relaxed text-zinc-400" defaultValue={selectedTask.description} onBlur={(e) => updateTask(selectedTask.id, { description: e.target.value })} placeholder="Ekstra detaylar..." />
                                    </div>

                                    <button onClick={() => setSelectedTask(null)} className="w-full bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-2xl font-black text-xs shadow-xl transition-all">CLOSE SETTINGS</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
